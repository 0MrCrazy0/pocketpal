const SAVE_KEY = 'pocketpal_save';
function activeMinutesBetween(start, end) {
  // Closed-PWA simulation follows the same local sleep schedule as live play.
  // Minute stepping keeps midnight/stage schedule handling predictable.
  if (end <= start) return 0;
  const maxMs = 7 * 24 * 60 * 60000;
  start = Math.max(start, end - maxMs);
  let active = 0;
  for (let t = Math.floor(start / 60000) * 60000; t < end; t += 60000) {
    const d = new Date(t + 30000);
    const h = d.getHours();
    const bw = getBedWake();
    const night = bw.bed > bw.wake ? (h >= bw.bed || h < bw.wake) : (h >= bw.bed && h < bw.wake);
    if (!night) active++;
  }
  return active;
}

function updateCareStreak() {
  const day = new Date().toDateString();
  if (S.lastCareDay === day) return;
  const yest = new Date();
  yest.setDate(yest.getDate() - 1);
  if (S.lastCareDay === yest.toDateString()) {
    S.careStreak = (S.careStreak || 0) + 1;
  } else if (!S.lastCareDay) {
    S.careStreak = 1;
  } else {
    S.careStreak = 1; // broken streak resets to 1 for today
  }
  S.lastCareDay = day;
}

function applyOfflineCatchup(now) {
  if (S.stage === 'egg' || S.stage === 'dead' || S.paused) return 0;
  const last = Number(S.lastSave) || now;
  const elapsed = Math.max(0, now - last);
  if (elapsed < 2 * 60000) return 0;
  const activeMin = activeMinutesBetween(last, now);
  const d = DIFF[S.difficulty] || DIFF.realtime;
  const sp = d.timeScale || 0.15;
  const hungerStep = (S.age < 1 ? 3.2 : 2.5) / sp * d.hunger;
  const happyStep = (S.age < 1 ? 3.8 : 2.9) / sp * d.happy;
  const poopStep = 6.8 / sp;
  const ageStep = (12 * 60) / sp;
  const hLoss = Math.floor(activeMin / hungerStep);
  const yLoss = Math.floor(activeMin / happyStep);
  if (hLoss > 0) {
    S.hunger = Math.max(0, S.hunger - Math.min(hLoss, 4)); // cap offline drain
    // Care miss grows slowly offline — player gets a chance to recover on return
    S.careMiss += Math.min(3, Math.max(0, hLoss - 1)) * d.care;
    if (S.hunger === 0) { S.call = true; careNotify('hunger', 'Needs FOOD — open PocketPal and feed me!'); }
  }
  if (yLoss > 0) {
    S.happy = Math.max(0, S.happy - Math.min(yLoss, 4));
    S.careMiss += Math.min(3, Math.max(0, yLoss - 1)) * d.care;
    if (S.happy === 0) { S.call = true; careNotify('happy', 'Needs PLAY — open PocketPal and play with me!'); }
  }
  if (!S.poop && activeMin >= poopStep) {
    S.poop = true; S.call = true; S.poopX = Math.round(S.petX || 120) + 16; S.poopY = 145; S.poopSince = now;
    careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
  }
  // Classic aging: +1 age per night/morning crossed while away
  // (plus a very slow awake-time fallback so long daytime absences still progress)
  let nights = 0;
  try {
    const startDay = new Date(last);
    const endDay = new Date(now);
    // Count midnights crossed while the pet had a chance to complete a night
    const cursor = new Date(startDay);
    cursor.setHours(0,0,0,0);
    cursor.setDate(cursor.getDate() + 1); // first midnight after last save
    while (cursor.getTime() <= endDay.getTime()) {
      nights++;
      cursor.setDate(cursor.getDate() + 1);
    }
  } catch(e) { nights = 0; }
  // Cap: allow at least midnight-based nights (floor of hours/24 was wrongly zeroing overnight)
  const maxDays = Math.max(0, Math.ceil(elapsed / (24 * 3600000)));
  if (maxDays > 0) nights = Math.min(nights, maxDays);
  // If we crossed a midnight and were away > 3 hours, keep at least 1 night
  if (nights === 0 && elapsed > 3 * 3600000) {
    const a = new Date(last), b = new Date(now);
    if (a.getDate() !== b.getDate() || a.getMonth() !== b.getMonth() || a.getFullYear() !== b.getFullYear()) {
      nights = 1;
    }
  }
  // Fallback slow age from daytime activity (very slow in realtime)
  const awakeAgeGain = Math.floor(activeMin / ageStep);
  const ageGain = Math.max(nights, awakeAgeGain);
  const stageBefore = S.stage;
  const formBefore = S.form;
  // Catch up within-stage growth (hours awake-equivalent while away)
  const growthHours = Math.floor(activeMin / 60);
  if (growthHours > 0 && S.stage !== 'egg' && S.stage !== 'dead') {
    S.growthPhase = Math.min(3, (S.growthPhase || 0) + growthHours);
    S.lastGrowthAt = now;
  }
  if (ageGain > 0) {
    S.age += ageGain;
    S.lastAge = now;
    S.lastAgeDay = new Date(now).toDateString();
    for (let i = 0; i < 6; i++) {
      const beforeStage = S.stage;
      checkEvo();
      if (S.stage === beforeStage) break;
    }
  }
  // If we returned during daytime after being away overnight, wake the pet
  if (S.sleep && !isNightTime()) {
    S.sleep = false;
    S.lights = true;
    S.lightsMissPending = false;
  }
  S.lastH = now;
  S.lastY = now;
  S.lastP = now;
  S.lastVirtTick = now;
  // Show evo anim if stage/form changed while away; else soft grow if phase jumped
  if (S.stage !== stageBefore || S.form !== formBefore) {
    S.anim = 'evo';
    S.animTimer = now + 2200;
    toast('While you were away → ' + (NAMES[S.form] || S.form) + '!');
    melEvolve();
  } else if (growthHours > 0) {
    S.anim = 'grow';
    S.animTimer = now + 1000;
  } else if (activeMin > 0) {
    S.anim = null;
  }
  if (elapsed >= 2 * 60000) toast('Welcome back · ' + Math.floor(elapsed / 60000) + ' min passed');
  // Grace: do not die immediately after offline catch-up / app update
  S.loadGraceUntil = now + 3 * 60000; // 3 minutes to care for pet
  S.lastSave = now;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {}
  return elapsed;
}
function save() {
  S.lastSave = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {}
  // Keep live battle card fresh when worker configured
  if (workerBaseUrl() && S.stage !== 'egg' && S.stage !== 'dead') {
    if (!S._lastPublish || Date.now() - S._lastPublish > 60000) {
      S._lastPublish = Date.now();
      publishBattleCard();
    }
  }
}
function load() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
      const oldKeys = ['pocketpal_v24','pocketpal_v23','pocketpal_v21','pocketpal_v20','tama_v19'];
      for (const k of oldKeys) {
        raw = localStorage.getItem(k);
        if (raw) { localStorage.setItem(SAVE_KEY, raw); break; }
      }
    }
    if (!raw) return false;
    Object.assign(S, JSON.parse(raw));
    // migrate missing v2.16 fields
    if (S.poopX === undefined) S.poopX = 180;
    if (S.poopY === undefined) S.poopY = 145;
    if (S.paused === undefined) S.paused = false;
    if (S.pauseStarted === undefined) S.pauseStarted = 0;
    if (S.virtualHour === undefined) S.virtualHour = new Date().getHours();
    if (S.virtualMin === undefined) S.virtualMin = new Date().getMinutes();
    if (S.lastVirtTick === undefined) S.lastVirtTick = Date.now();
    if (S.lightsMissPending === undefined) S.lightsMissPending = false;
    if (S.sleepStart === undefined) S.sleepStart = 0;
    if (S.notifications === undefined) S.notifications = false;
    if (S.lastNotifyAt === undefined) S.lastNotifyAt = 0;
    if (S.lastNotifyType === undefined) S.lastNotifyType = '';
    if (S.lastAgeDay === undefined) S.lastAgeDay = '';
    if (S.battleWins === undefined) S.battleWins = 0;
    if (S.battleLosses === undefined) S.battleLosses = 0;
    if (S.battleXP === undefined) S.battleXP = 0;
    if (S.battle === undefined) S.battle = false;
    if (S.bat === undefined) S.bat = null;
    if (S.lastFalseCall === undefined) S.lastFalseCall = 0;
    if (S.sleptProperly === undefined) S.sleptProperly = false;
    // Keep preference; if permission was revoked, force alerts off
    if (typeof Notification !== 'undefined' && Notification.permission !== 'granted') {
      S.notifications = false;
    }
    // v2.17: authentic 8pm-8am sleep + morning age-up
    S.difficulty = 'realtime'; // locked to original pace
    // Growth catch-up: count calendar midnights since birth vs current age.
    // Re-runs if age is still behind (so a failed prior catch-up can recover).
    if (S.stage !== 'egg' && S.stage !== 'dead' && S.born) {
      const bornDate = new Date(Number(S.born));
      const nowDate = new Date();
      bornDate.setHours(0,0,0,0);
      nowDate.setHours(0,0,0,0);
      const calendarDays = Math.max(0, Math.round((nowDate - bornDate) / (24 * 3600000)));
      // At least 1 age if the pet has lived past one 8am wake after birth day
      let expected = calendarDays;
      // If born yesterday and it's already past 8am today, expect age >= 1
      if (expected === 0 && (Date.now() - Number(S.born)) > 12 * 3600000) expected = 1;
      if (expected > S.age) {
        const missed = Math.min(expected - S.age, 10);
        S.age += missed;
        S.lastAge = Date.now();
        S.lastAgeDay = new Date().toDateString();
        for (let i = 0; i < 6; i++) {
          const before = S.stage;
          checkEvo();
          if (S.stage === before) break;
        }
        setTimeout(() => toast('Growth catch-up! Age ' + S.age + (missed > 1 ? ' (+' + missed + ')' : '')), 600);
      }
      S._ageCatchupDone = true;
    }
    // Re-issue friend code if old format without checksum
    if (S.myCode && typeof isValidFriendCode === 'function' && !isValidFriendCode(S.myCode)) {
      S.myCode = null;
    }
    // Drop any previously added fake friends with invalid codes
    if (Array.isArray(S.friends)) {
      S.friends = S.friends.filter(f => f && isValidFriendCode(f.code));
    }
    // Always display the phone's actual local clock; it is not a simulated clock.
    syncDeviceClock(Date.now());
    // Recover from bad state: asleep during daytime (bug in older builds)
    if (S.sleep && !isNightTime()) {
      S.sleep = false;
      S.lights = true;
      S.lightsMissPending = false;
      S.anim = null;
    }
    if (!isNightTime()) S.lightsMissPending = false;
    // Never kill the moment the app/update loads
    S.loadGraceUntil = Date.now() + 3 * 60000;
    if (S.shellTheme === undefined) S.shellTheme = 0;
    applyShellTheme(S.shellTheme || 0);

    // If was paused, stay paused (true freeze). Otherwise simulate care while
    // the PWA was closed/backgrounded, including the night sleep window.
    if (S.paused) toast('Still paused · Hold B to resume');
    else applyOfflineCatchup(Date.now());
    updateCareStreak();
    tryAcceptFriendFromUrl();
    return true;
  } catch(e) { return false; }
}

window.addEventListener('beforeunload', save);
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    hiddenAt = Date.now();
    save();
    stopMusic();
  } else {
    if (hiddenAt && !S.paused) applyOfflineCatchup(Date.now());
    hiddenAt = 0;
    if (S.sound) startMusic();
    syncDeviceClock(Date.now());
    updateUI();
  }
});

function restart() {
  const deaths = S.deaths;
  const friends = S.friends;
  const generation = S.generation;
  const difficulty = S.difficulty;
  const sound = S.sound;
  const notifications = S.notifications;
  const battleWins = S.battleWins || 0;
  const battleLosses = S.battleLosses || 0;
  const battleXP = S.battleXP || 0;
  const petFamily = S.petFamily || [];
  const careStreak = S.careStreak || 0;
  const lastCareDay = S.lastCareDay || '';
  const myCode = S.myCode;
  Object.assign(S, {
    stage: 'egg', form: 'egg', age: 0, weight: 5,
    hunger: 4, happy: 4, disc: 0, careMiss: 0, discMiss: 0,
    sick: false, sleep: false, lights: true, poop: false,
    poopX: 180, poopY: 145, call: false,
    born: Date.now(), lastH: Date.now(), lastY: Date.now(),
    lastP: Date.now(), lastAge: Date.now(),
    game: false, menu: null, deaths, frame: 0, gameDir: 0,
    friends, married: false, anim: null, selectedFriend: 0,
    generation, difficulty, sound, notifications, petFamily, careStreak, lastCareDay, myCode, lastNotifyAt: 0, lastNotifyType: '', musicStep: 0, musicTimer: 0, musicPlaying: false, inheritedBonus: 0,
    battleWins, battleLosses, battleXP, battle: false, bat: null,
    petX: 120, petTargetX: 120, playResult: null,
    paused: false, pauseStarted: 0, sleepStart: 0, lightsMissPending: false,
    lastSleepCheck: Date.now(),
    virtualHour: new Date().getHours(),
    virtualMin: new Date().getMinutes(),
    lastVirtTick: Date.now(),
    lastAgeDay: '', sleptProperly: false, _ageCatchupDone: true,
    fx: [], hatchPhase: 0, deathPhase: 0, tiltTimer: 0
  });
  hide();
  // Hatch sequence: shake + cracks then baby
  setTimeout(() => {
    if (S.stage === 'egg') {
      S.anim = 'hatch';
      S.animTimer = Date.now() + 3000;
      beep(300, 0.05); beep(340, 0.05);
      toast('Egg is shaking...');
    }
  }, 2500);
  setTimeout(() => {
    if (S.stage === 'egg') {
      S.stage = 'baby';
      S.form = 'baby';
      S.born = Date.now();
      S.hunger = 2;
      S.happy = 2;
      S.anim = 'joy';
      S.animTimer = Date.now() + 1500;
      spawnFx('star', 120, 90, 5);
      toast('It hatched! Pip is here');
      beep(600, 0.1); beep(800, 0.15);
      save();
    }
  }, 5500);
  save();
}
function show(title, msg) {
  document.getElementById('otitle').textContent = title;
  document.getElementById('omsg').textContent = msg;
  document.getElementById('overlay').classList.remove('hidden');
}
function hide() {
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('overlay-extra').innerHTML = '';
  const btn = document.getElementById('obtn');
  btn.style.display = '';
  btn.textContent = 'Close';
}
document.getElementById('obtn').onclick = () => {
  if (S.stage === 'dead' || S.stage === 'egg') restart();
  else hide();
};

function loop() {
  update();
  render();
  updateUI();
  requestAnimationFrame(loop);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // A newly activated worker has the latest build. Reload so the
    // running page immediately uses the updated app shell.
    if (!window.__ppReloadingForUpdate) {
      window.__ppReloadingForUpdate = true;
      window.location.reload();
    }
  });

  try { applyShellTheme(S.shellTheme || 0); } catch(e) {}
navigator.serviceWorker.register('./service-worker.js?v=2.66', { updateViaCache: 'none' })
    .then(reg => reg.update())
    .catch(() => {});
}

function init() {
  if (!load() || S.stage === 'egg') {
    show('PocketPal v2.47.1', 'A = Select  B = Confirm  C = Cancel\\nHold B = Pause\\n\\nReal-time care · Grow with love!');
    document.getElementById('obtn').textContent = 'Start New Life';
  } else {
    hide();
    toast('Save restored · Gen ' + S.generation);
  }
  updateIconHighlight();
  requestAnimationFrame(loop);
}
init();
</script>
