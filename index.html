<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#e85a71">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root {
    --shell: #e85a71;
    --shell-dark: #c43c55;
    --lcd: #9bbc0f;
    --ink: #0f380f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 4px;
    overflow: hidden;
  }
  /* Banner stats moved onto LCD — keep panel out of the way */
  .info-panel { display: none; }

  .device {
    width: min(400px, 96vw);
    background: linear-gradient(165deg, #f2788c 0%, var(--shell) 45%, var(--shell-dark) 100%);
    border-radius: 24px;
    padding: 14px 14px 12px;
    box-shadow:
      0 0 0 3px #f9b4c0,
      0 0 0 6px #b83550,
      0 10px 24px rgba(0,0,0,0.45),
      inset 0 3px 10px rgba(255,255,255,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  /* Bell + sound on shell, top-right above LCD */
  .shell-controls {
    position: absolute;
    top: 4px;
    right: 10px;
    display: flex;
    gap: 3px;
    z-index: 30;
    pointer-events: auto;
  }
  .shell-controls .sound-btn {
    font-size: 13px;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.28);
    color: #fff;
    cursor: pointer;
    padding: 1px 5px;
    border-radius: 7px;
    line-height: 1.15;
  }
  .device::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 4px;
    background: #222;
    border-radius: 3px;
  }
  .lcd-bezel {
    width: 100%;
    background: #1a1a1a;
    border-radius: 10px;
    padding: 6px;
    margin-top: 28px; /* room for shell controls above LCD */
    box-shadow: inset 0 0 0 2px #333, inset 0 0 12px #000;
  }
  .lcd {
    width: 100%;
    aspect-ratio: 1.35 / 1;
    background: var(--lcd);
    border-radius: 5px;
    position: relative;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* Menu icons sit directly under the pet LCD */
  .icons {
    display: flex;
    width: 100%;
    gap: 3px;
    margin: 8px 0 6px;
    pointer-events: none; /* A/B/C only control */
    position: relative;
    z-index: 5;
  }
  .icon {
    flex: 1;
    height: 36px;
    background: #222;
    border: 2px solid #3a3a3a;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #888;
  }
  .icon.on {
    background: #333;
    border-color: #fff;
    color: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.3);
  }
  .btns {
    display: flex;
    justify-content: center;
    gap: 24px;
  }
  .btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(145deg, #4a4a4a, #222);
    border: 3px solid #111;
    box-shadow: 0 4px 0 #0a0a0a, inset 0 2px 3px rgba(255,255,255,0.1);
    color: #ccc;
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn:active, .btn.pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #0a0a0a, inset 0 2px 5px rgba(0,0,0,0.4);
  }
  .btn.a { border-color: #4a9; }
  .btn.b { border-color: #49a; }
  .btn.c { border-color: #a54; }
  /* Menus stay inside the pet LCD only — A/B/C and icons stay visible */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 56, 15, 0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    z-index: 20;
    color: var(--lcd);
    text-align: center;
    padding: 8px 8px 10px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    overflow-y: auto;
    border-radius: 5px;
  }
  .overlay h2 { font-size: 14px; margin: 4px 0 8px; color: #c4d84a; }
  .overlay p { margin: 3px 0; line-height: 1.35; }
  .overlay button {
    margin-top: 8px;
    padding: 8px 16px;
    background: transparent;
    border: 2px solid var(--lcd);
    border-radius: 5px;
    color: var(--lcd);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    min-height: 36px;
  }
  .overlay input {
    margin-top: 6px;
    padding: 8px 10px;
    font-size: 13px;
    width: 85%;
    background: #0a2a0a;
    border: 1px solid var(--lcd);
    color: var(--lcd);
    text-align: center;
    border-radius: 5px;
  }
  .overlay .btn-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .overlay .friend-list {
    width: 100%;
    max-height: 48px;
    overflow-y: auto;
    margin: 6px 0;
    text-align: left;
  }
  .overlay .friend-item {
    padding: 5px 8px;
    margin: 3px 0;
    border: 1px solid #3a5a3a;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .overlay .friend-item.selected {
    border-color: var(--lcd);
    background: #0a2a0a;
  }
  .hidden { display: none !important; }
  /* Toast on the pink shell, centered just above the LCD — never covers game prompts */
  .toast {
    position: absolute;
    left: 50%;
    top: 18px; /* under speaker hole, just above LCD bezel */
    transform: translateX(-50%);
    background: rgba(15, 56, 15, 0.95);
    color: #9bbc0f;
    border: 1px solid #0f380f;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    z-index: 40;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    max-width: 78%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .toast.show { opacity: 1; }
</style>
</head>

<script>

/* ============================================================
   POCKETPAL — GAME RULES & MECHANICS (dev notes)
   ------------------------------------------------------------
   CARE (Tamagotchi-style)
   - Hunger 0-4: drains while awake; meal fills more than snack
   - Happy 0-4: drains while awake; play/snack/train/win/clean raise
     Unhappy stages: 4 joy · 3 content · 2 ok · 1 low · 0 miserable
   - Discipline 0-100%: only rises on correct false-call scold
   - Weight: +meal/snack, -play/train/battle; evo path + battle power
   - Care miss: empty meters, ignored lights, piled poop, long sick
   - Poop: stacks up to 4 piles; pet avoids piles; full screen → unhappy/sick/death risk
   - Sick: neglect, max filth, battle injury; medicine or slow heal
   - Injury: battle loss flag → sick + needs medicine
   - Call: real need or false call (discipline only if false)

   CLOCK / SLEEP
   - Uses device local time
   - Night window 8:00 PM – 8:00 AM
   - Lights OFF at night → sleep; ignore lights → care miss + sleep
   - Lights OFF in day → dark room; babies/children may nap
   - Morning wake → +1 age (once per calendar day) + evo checks
   - Pause (hold B) freezes care timers

   GROWTH
   - Stages: egg → baby → child → teen → adult (+ secret Elder)
   - Forms: Pip→Nib→Lumi/Grub→Momo/Kiko/Taro/Poko/Nori/Zuzu/Nova/Bibi/Rin/Bolt
   - growthPhase 0-3: body visibly fills out each ~1h awake (and offline catch-up)
   - Morning/age evo changes stage form; growthPhase resets on evo
   - Offline: growth + age applied; evo animation plays on return if form changed
   - Discipline does not drain from unhappiness; false-calls rise when bored/sad

   PLAY
   - Look: guess left/right from pet lean/eyes (no arrow spoilers)
   - Memory: watch sequence then repeat; grows longer
   - Train XP: timing GO → Battle XP

   BATTLE (Teen+)
   - Training: roster of named PocketPals with age/XP/W-L/WT/DISC
   - Friend: code snapshot opponent
   - Stats: HP from stage+XP; power from stage/disc/happy/XP
   - POW charge (mash B); STA costs on attack; Guard recovers STA
   - Level = 1 + floor(XP/5) — shown on LCD + Status + battle

   LIFE
   - Death: long neglect or adult old-age after age ~12+
   - Restart → Gen+1; friends/XP preferences kept where saved
   ============================================================ */
// ============================================================
//  POCKETPAL v2.66
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 240, H = 178;

const S = {
  stage: 'egg', form: 'egg',
  age: 0, weight: 5,
  hunger: 4, happy: 4, disc: 0,
  careMiss: 0, discMiss: 0,
  sick: false, sleep: false, lights: true,
  poop: false, poopX: 180,
  poopCount: 0, poopY: 145,
  call: false,
  lastFalseCall: 0,
  loadGraceUntil: 0,
  injured: false,
  shellTheme: 0,
  growthPhase: 0,
  careStreak: 0,
  petFamily: [],
  lastCareDay: '',
  lastGrowthAt: 0,
  sickSince: 0,
  _wakePoopAt: 0,
  born: null,
  lastH: Date.now(), lastY: Date.now(),
  lastP: Date.now(), lastAge: Date.now(), lastSave: Date.now(),
  game: false, gScore: 0, gRound: 0, gameDir: 0,
  gameType: 'look', // 'look' | 'memory'
  memSeq: [], memIdx: 0, memPhase: 'show', // show | input
  memTimer: 0,
  // Battle
  battle: false,
  battleWins: 0,
  battleLosses: 0,
  battleXP: 0,
  bat: null, // active battle state object
  menu: null, sel: 0,
  sound: true,
  notifications: false,
  lastNotifyAt: 0,
  lastNotifyType: '',
  musicStep: 0,
  musicTimer: 0,
  musicPlaying: false,
  difficulty: 'realtime',  // classic hardware speed is the default
  generation: 1,
  deaths: 0, frame: 0,
  myCode: null,
  friends: [],
  selectedFriend: 0,
  married: false,
  anim: null,
  animTimer: 0,
  inheritedBonus: 0,
  petX: 120,
  petTargetX: 120,
  lastBeep: 0,
  playResult: null, // 'happy' | 'sad' | null for play feedback face
  // v2.17 sleep + pause + finished-game fx
  paused: false,
  pauseStarted: 0,
  sleepStart: 0,
  lightsMissPending: false,
  lastSleepCheck: Date.now(),
  virtualHour: new Date().getHours(),
  virtualMin: new Date().getMinutes(),
  lastVirtTick: Date.now(),
  lastAgeDay: '',   // YYYY-MM-DD of last morning age-up
  sleptProperly: false, // lights were off during night sleep
  fx: [],           // floating hearts / bubbles {type,x,y,life,vy}
  hatchPhase: 0,    // 0 idle egg, 1 shaking, 2 cracking, 3 done
  deathPhase: 0,    // 0 rising, 1 spirit
  tiltTimer: 0
};


const FORM_TRAITS = {
  egg: 'Waiting',
  baby: 'Curious',
  child: 'Playful',
  teenGood: 'Bright',
  teenBad: 'Stubborn',
  adult1: 'Gentle',
  adult2: 'Swift',
  adult3: 'Steady',
  adult4: 'Jolly',
  adult5: 'Sluggish',
  adult6: 'Gloomy',
  adult7: 'Radiant',
  adult8: 'Strict',
  adult9: 'Athletic',
  adult10: 'Fierce',
  secret: 'Wise',
  dead: 'Peaceful'
};
function formTrait(form) {
  return FORM_TRAITS[form] || 'Unique';
}
function recordFamilyMember(reason) {
  if (!S.petFamily) S.petFamily = [];
  const entry = {
    form: S.form,
    name: NAMES[S.form] || S.form,
    trait: formTrait(S.form),
    stage: S.stage,
    age: S.age,
    gen: S.generation || 1,
    wins: S.battleWins || 0,
    losses: S.battleLosses || 0,
    xp: S.battleXP || 0,
    disc: S.disc || 0,
    careMiss: Math.floor(S.careMiss || 0),
    reason: reason || 'lived',
    at: Date.now()
  };
  // One slot per form+gen to avoid spam; keep history of variants
  const key = entry.form + '-G' + entry.gen;
  S.petFamily = S.petFamily.filter(e => (e.form + '-G' + e.gen) !== key);
  S.petFamily.unshift(entry);
  if (S.petFamily.length > 24) S.petFamily.pop();
}

const NAMES = {
  egg: 'Egg', baby: 'Pip', child: 'Nib',
  teenGood: 'Lumi', teenBad: 'Grub',
  adult1: 'Momo', adult2: 'Kiko', adult3: 'Taro',
  adult4: 'Poko', adult5: 'Nori', adult6: 'Zuzu',
  adult7: 'Nova', adult8: 'Bibi',
  adult9: 'Rin', adult10: 'Bolt',
  secret: 'Elder', dead: 'Spirit'
};
const ICONS = ['status','feed','play','clean','med','light','connect','disc'];
const ICON_LABELS = {
  status: 'Status',
  feed: 'Feed',
  play: 'Play',
  clean: 'Clean',
  med: 'Medicine',
  light: 'Lights',
  connect: 'Connect',
  disc: 'Discipline'
};
// Original-paced only (no fast-forward modes).
// timeScale ~0.12 ≈ classic-inspired: ~20–25 min per hunger heart when awake.
const DIFF = {
  realtime: { hunger: 1.0, happy: 1.0, care: 1.0, timeScale: 0.12 }
};

// Shell case colors (cycle with 🎨)
const SHELL_THEMES = [
  { name: 'Pink', shell: '#e85a71', dark: '#c43c55', light: '#f2788c', edge: '#f9b4c0', deep: '#b83550' },
  { name: 'Blue', shell: '#4a7fd4', dark: '#2f5fad', light: '#6b9aef', edge: '#a8c4f5', deep: '#1e4a8c' },
  { name: 'Green', shell: '#3cb878', dark: '#2a8f5c', light: '#5dd49a', edge: '#9ae8c0', deep: '#1f7a4a' },
  { name: 'Purple', shell: '#9b59b6', dark: '#7d3c98', light: '#bb7fd4', edge: '#d4b0e8', deep: '#5b2c6f' },
  { name: 'Orange', shell: '#e67e22', dark: '#c96a12', light: '#f39c4a', edge: '#f5c48a', deep: '#a85a10' },
  { name: 'Teal', shell: '#1abc9c', dark: '#148f77', light: '#48d1b5', edge: '#8ee6d4', deep: '#0e6655' },
  { name: 'White', shell: '#eceff1', dark: '#b0bec5', light: '#ffffff', edge: '#ffffff', deep: '#78909c' },
  { name: 'Black', shell: '#37474f', dark: '#263238', light: '#546e7a', edge: '#78909c', deep: '#102027' }
];
function applyShellTheme(idx) {
  const t = SHELL_THEMES[((idx % SHELL_THEMES.length) + SHELL_THEMES.length) % SHELL_THEMES.length];
  const root = document.documentElement;
  root.style.setProperty('--shell', t.shell);
  root.style.setProperty('--shell-dark', t.dark);
  const dev = document.getElementById('device');
  if (dev) {
    dev.style.background = 'linear-gradient(165deg, ' + t.light + ' 0%, ' + t.shell + ' 45%, ' + t.dark + ' 100%)';
    dev.style.boxShadow = '0 0 0 3px ' + t.edge + ', 0 0 0 6px ' + t.deep + ', 0 10px 24px rgba(0,0,0,0.45), inset 0 3px 10px rgba(255,255,255,0.25)';
  }
}
function cycleShellColor() {
  S.shellTheme = ((S.shellTheme || 0) + 1) % SHELL_THEMES.length;
  applyShellTheme(S.shellTheme);
  toast('Shell: ' + SHELL_THEMES[S.shellTheme].name);
  beep(400, 0.05);
  save();
}

const actx = new (window.AudioContext || window.webkitAudioContext)();
function wakeAudio() {
  try {
    if (actx.state === 'suspended') actx.resume();
  } catch(e) {}
}
function beep(f=440, d=0.07, t='square', v=0.07) {
  if (!S.sound) return;
  wakeAudio();
  const now = Date.now();
  if (now - S.lastBeep < 50) return;
  S.lastBeep = now;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = t; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
    o.stop(actx.currentTime + d);
  } catch(e){}
}

// Classic short melodies (evolve / wake / death / win / lose)
function melody(notes) {
  // notes: [[freq, durationSec], ...]
  if (!S.sound) return;
  wakeAudio();
  let t = actx.currentTime;
  try {
    for (const [f, d] of notes) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + d + 0.02);
      t += d + 0.02;
    }
  } catch(e) {}
}
function melEvolve() { melody([[523,0.08],[659,0.08],[784,0.1],[988,0.1],[1175,0.18]]); }
function melWake()   { melody([[392,0.07],[523,0.07],[659,0.1],[784,0.12]]); }
function melDeath()  { melody([[392,0.12],[349,0.12],[311,0.15],[277,0.18],[220,0.28]]); }
function melWin()    { melody([[523,0.06],[659,0.06],[784,0.06],[1047,0.08],[784,0.06],[1047,0.14]]); }
function melLose()   { melody([[330,0.1],[294,0.12],[247,0.2]]); }
function melHappy()  { melody([[523,0.05],[659,0.06],[784,0.08],[880,0.1]]); }
function melEat()    { melody([[280,0.04],[240,0.04],[280,0.04],[320,0.05]]); }
function melPoop()   { melody([[180,0.08],[140,0.12]]); }
function melCall()   { melody([[600,0.06],[600,0.06],[450,0.1]]); }
function melSick()   { melody([[220,0.1],[200,0.1],[180,0.15]]); }
function melTrain()  { melody([[400,0.05],[500,0.05],[600,0.05],[800,0.1]]); }

// Small looping LCD-era chiptune. It starts only after a real user gesture,
// which keeps mobile browser autoplay rules happy.
const MUSIC = []; // no background loop — event melodies only
function musicNote(f) {
  if (!S.sound || S.paused || S.sleep || document.visibilityState === 'hidden') return;
  try {
    wakeAudio();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.018, actx.currentTime + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.25);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.27);
  } catch(e) {}
}
function startMusic() {
  // Background music disabled by design — only event melodies (evolve/wake/win/etc.)
  stopMusic();
}
function stopMusic() {
  S.musicPlaying = false;
  clearTimeout(S.musicTimer);
  S.musicTimer = 0;
}
function countDueCares() {
  let n = 0;
  if (S.stage === 'egg' || S.stage === 'dead' || S.paused) return 0;
  if (S.hunger <= 1) n++;
  if (S.happy <= 1) n++;
  if (S.poop) n++;
  if (S.sick || S.injured) n++;
  if (S.lightsMissPending) n++;
  if (S.call && S._falseCall) n++;
  return n;
}

async function subscribeWebPush() {

  if (!window.POCKETPAL_VAPID_PUBLIC) return null;
  try {
    const reg = await navigator.serviceWorker.ready;

        method: 'POST',

}
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

function drawFx() {

    if (p.life <= 0) { S.fx.splice(i, 1); continue; }
    const x = Math.round(p.x), y = Math.round(p.y);

      px(x+1, y-3, INK); px(x+2, y-3, INK); px(x+3, y-3, INK); px(x+4, y-3, INK);

function drawPet(cx, cy, form, f) {
  const INK = '#0f380f';
  const BG  = '#9bbc0f';
  const blink = S.game || S.battle ? (f % 120 < 3) : (f % 90 < 5);
  const a = S.anim;
  // Eyes closed during sleep (unless game), yawn, or death rise
  const eyesClosed = !S.battle && !S.game && ((S.sleep) || a === 'yawn') && a !== 'wake' && a !== 'poop';

  // Gentle idle breathe + stage-based pose
  let bob = (Math.sin(f * 0.05) > 0.5) ? 1 : 0;
  if (!S.game && !S.anim && !S.sleep && (f % 180 < 6)) bob = 1; // tiny hop
  let shift = 0;
  let scaleY = 1;
  let scaleX = 1;
  let rotHint = 0;
  // Stage personality in idle — breathe, sit, wave, hop (life-like)
  if (!S.battle && !S.game && !S.anim && !S.sleep && S.stage !== 'egg' && S.stage !== 'dead') {
    bob = (Math.sin(f * 0.08) > 0) ? 1 : 0;
    const cycle = Math.floor(f / 40) % 12;
    // Sit pose (lower bob) every few cycles
    if (cycle === 5 || cycle === 6) bob = 3;
    // Wave (shift + arm feel) when content
    if (S.happy >= 2 && (cycle === 8 || cycle === 9)) {
      shift = (f % 16 < 8) ? 2 : -1;
      bob = 1;
    }
    if (S.stage === 'baby' || S.stage === 'child') {
      if (f % 36 < 4) bob = 2;
      if (f % 90 < 8) shift = (f % 18 < 9) ? 1 : -1;
    } else if (S.stage === 'teen') {
      if (Math.floor(f / 80) % 2 === 0 && f % 80 < 35) shift = 1;
      else if (f % 80 < 35) shift = -1;
      if (f % 50 < 3) bob = 2;
    } else if (S.stage === 'adult') {
      // Per-adult idle personality
      const fm = S.form;
      if (fm === 'adult1' || fm === 'adult7') { // Momo / Nova — proud
        if (f % 120 < 50) shift = 0;
        if (f % 180 < 12) bob = 2;
      } else if (fm === 'adult2' || fm === 'adult9') { // Kiko / Rin — athletic sway
        shift = (Math.floor(f / 20) % 2 === 0) ? 1 : -1;
        if (f % 60 < 4) bob = 2;
      } else if (fm === 'adult5' || fm === 'adult6') { // Nori / Zuzu — heavy sit
        bob = 2 + ((f % 100 < 40) ? 1 : 0);
        shift = 0;
      } else if (fm === 'adult8' || fm === 'adult10') { // Bibi / Bolt — alert
        if (f % 70 < 8) shift = (f % 14 < 7) ? 2 : -2;
        if (f % 90 < 5) bob = 2;
      } else if (fm === 'secret') {
        bob = (Math.sin(f * 0.05) > 0) ? 0 : 1; // calm elder
      } else {
        if (f % 100 < 45) shift = (Math.floor(f / 25) % 2 === 0) ? 1 : 0;
        if (f % 200 < 10) bob = 2;
      }
    }
    if (S.happy >= 3 && S.hunger >= 3 && f % 160 < 5) bob = 2;
  }

  // Low energy slump when hearts low
  const lowEnergy = !S.sleep && !S.game && !a && (S.hunger <= 1 || S.happy <= 1);
  if (lowEnergy) {
    bob = 2; // sit lower — no fractional scale (keeps pixels crisp)
  }

  // Occasional head tilt when idle and content
  if (!S.game && !a && !S.sleep && S.stage !== 'egg' && S.stage !== 'dead' && S.happy >= 3 && S.hunger >= 2) {
    if (!S.tiltTimer && Math.random() < 0.002) S.tiltTimer = f + 40;
    if (S.tiltTimer && f < S.tiltTimer) shift = (S.tiltTimer - f) > 20 ? 2 : -2;
    else S.tiltTimer = 0;
  }

  if (S.game && S.gameType === 'look') {
    // After eyes settle, lean toward TRUE answer (clearer than body-trick confusion)
    const settled = !S._lookSettleAt || Date.now() >= S._lookSettleAt;
    if (settled) shift = S.gameDir === 0 ? -10 : 10;
    bob = (Math.sin(f * 0.15) > 0) ? 1 : 0;
  } else if (S.game && S.gameType === 'memory') {
    // Memory: pet stays mostly center; side labels teach the sequence
    bob = (Math.sin(f * 0.15) > 0) ? 1 : 0;
    if (S.memPhase === 'show') shift = S.gameDir === 0 ? -6 : 6;
  } else if (S.game && S.gameType === 'train') {
    bob = S.trainPhase === 'go' ? ((f % 6 < 3) ? 2 : 0) : ((Math.sin(f * 0.12) > 0) ? 1 : 0);
  }

  // ---- Animation poses ----
  if (a === 'eat') {
    // Gentle chew hop — no squash (squash looked like bending over)
    bob = (f % 10 < 5) ? 1 : 0;
    scaleY = 1;
    scaleX = 1;
  } else if (a === 'clean') {
    shift = Math.sin(f * 0.25) * 3;
    if (f % 6 === 0) spawnFx('bubble', cx, cy - 10, 1);
  } else if (a === 'happy' || a === 'joy') {
    bob = (f % 12 < 6) ? 2 : 0; // small hop, not a bounce-squash
    if (f % 10 === 0) spawnFx('heart', cx, cy - 18, 1);
    if (a === 'joy' && f % 8 === 0) spawnFx('star', cx, cy - 20, 1);
  } else if (a === 'dance') {
    shift = Math.sin(f * 0.3) * 5;
    bob = (f % 10 < 5) ? 2 : 0;
    if (f % 10 === 0) spawnFx('heart', cx, cy - 18, 1);
  } else if (a === 'sulk') {
    bob = 2; // slight sit
    scaleY = 1;
    shift = Math.sin(f * 0.05) * 1;
  } else if (a === 'evo') {
    bob = (f % 8 < 4) ? 2 : 0;
    scaleY = 1;
    scaleX = 1;
    shift = Math.sin(f * 0.4) * 3;
    if (f % 5 === 0) spawnFx('star', cx, cy - 12, 2);
  } else if (a === 'grow') {
    bob = (f % 10 < 5) ? 1 : 0;
    scaleY = 1;
    scaleX = 1;
  } else if (a === 'disc') {
    shift = (f % 10 < 5) ? -3 : 3; // head shake
  } else if (a === 'refuse') {
    shift = (f % 8 < 4) ? -4 : 4;
  } else if (a === 'sick' || (S.sick && !a && !S.sleep)) {
    shift = Math.sin(f * 0.45) * 2; // shiver
    bob = 0;
  } else if (a === 'poop') {
    bob = 3; // mild squat
    scaleY = 1;
    scaleX = 1.05;
  } else if (a === 'yawn') {
    bob = 0;
    scaleY = 1;
  } else if (a === 'wake') {
    bob = (f % 12 < 6) ? 1 : 0;
    scaleY = 1;
  } else if (a === 'call') {
    // Attention hop — vertical only, no squash
    bob = (f % 14 < 7) ? 3 : 0;
    shift = 0;
    scaleY = 1;
  } else if (a === 'wave') {
    shift = Math.sin(f * 0.3) * 4;
    bob = (f % 12 < 6) ? 1 : 0;
  } else if (a === 'marry') {
    bob = Math.abs(Math.sin(f * 0.25)) * 3;
    if (f % 6 === 0) spawnFx('heart', cx, cy - 16, 2);
  } else if (a === 'death') {
    bob = -Math.min(40, (Date.now() - (S.animTimer - 2500)) / 50); // rise up
  } else if (a === 'hatch') {
    shift = Math.sin(f * 0.6) * 4; // egg shake
    bob = (f % 10 < 5) ? 1 : 0;
  } else if (eyesClosed && S.sleep) {
    bob = (Math.sin(f * 0.02) > 0) ? 0 : 1;
  }

  // Idle wander — main screen only; avoid poop piles (classic)
  if (!S.battle && !S.game && !a && S.stage !== 'egg' && S.stage !== 'dead' && !S.sleep) {
    const spots = S.poopSpots || (S.poop ? [S.poopX || 180] : []);
    const blocked = (x) => spots.some(p => Math.abs(x - p) < 18);
    if (Math.abs(S.petX - S.petTargetX) < 2) {
      if (Math.random() < 0.006) {
        let tries = 0, tx = 50 + Math.random() * 140;
        while (blocked(tx) && tries++ < 8) tx = 50 + Math.random() * 140;
        // If floor is full of poop, pet is trapped → stay put (miserable)
        if (blocked(tx) && (S.poopCount || 0) >= 4) {
          S.petTargetX = S.petX;
        } else {
          S.petTargetX = blocked(tx) ? S.petX : tx;
        }
      }
    } else {
      const step = (lowEnergy || (S.poopCount || 0) >= 3) ? 0.12 : 0.3;
      const next = S.petX + Math.sign(S.petTargetX - S.petX) * step;
      if (!blocked(next)) S.petX = next;
      else S.petTargetX = S.petX; // stop at pile edge
    }
    cx = S.petX;
  }

  ctx.save();
  ctx.translate(Math.round(cx + shift), Math.round(cy + bob));
  // NEVER use fractional ctx.scale — it blurs/ghosts pixel art on mobile.
  // Size differences come from sprite shapes (baby vs adult fillCirc), not canvas scale.
  scaleX = 1;
  scaleY = 1;

  // Mouth style: care state faces (hungry / dirty / sick / happy)
  // Care faces suppressed during minigames/battles so poop doesn't force a sad face mid-game
  const busyPlay = S.game || S.battle;
  const faceHungry = !busyPlay && !S.playResult && S.hunger <= 1 && !S.sick && !S.sleep;
  const faceDirty = !busyPlay && !S.playResult && S.poop && !S.sick && !S.sleep;
  const faceSick = !busyPlay && (S.sick || S.anim === 'sick');
  const happyMouth = S.playResult === 'happy' || S.anim === 'happy' || S.anim === 'joy' || S.anim === 'dance' ||
    (!S.playResult && !faceHungry && !faceDirty && !faceSick && S.happy >= 3 && !S.sleep);
  const sadMouth = S.playResult === 'sad' || S.anim === 'sad' || S.anim === 'sulk' || faceHungry || faceDirty ||
    (!busyPlay && !S.playResult && S.happy <= 1 && !S.sleep && !faceSick);

  // ========== DISTINCT SPRITES PER FORM ==========
  if (form === 'egg') {
    // Classic spotted egg
    for (let y = -16; y <= 14; y++) {
      const w = Math.floor(8 + (16 - Math.abs(y)) * 0.42);
      for (let x = -w; x <= w; x++) {
        if ((x*x)/(w*w) + (y*y)/256 < 1.0) px(x, y, INK);
      }
    }
    // spots
    px(-4, -6, BG); px(5, -2, BG); px(-2, 4, BG); px(3, 8, BG);
    // Hatch cracks
    if (S.anim === 'hatch') {
      px(-2, -8, BG); px(-1, -7, BG); px(0, -6, BG); px(1, -5, BG);
      px(2, -4, BG); px(1, -3, BG); px(0, -2, BG);
      px(-6, 0, BG); px(-5, 1, BG); px(-4, 2, BG);
      px(5, 2, BG); px(6, 3, BG); px(7, 4, BG);
      // little star burst
      if (f % 8 < 4) {
        px(0, -20, BG); px(-12, -10, BG); px(12, -10, BG);
      }
    }
  }
  else if (form === 'dead') {
    // Angel spirit with halo
    fillCirc(0, 4, 13, INK);
    // wings
    for (let i = 0; i < 5; i++) {
      px(-18-i, -2+i, INK); px(-17-i, -1+i, INK);
      px(18+i, -2+i, INK); px(17+i, -1+i, INK);
    }
    // halo
    for (let a = 0; a < 12; a++) {
      const ang = a / 12 * Math.PI * 2;
      px(Math.round(Math.cos(ang)*10), -16 + Math.round(Math.sin(ang)*2), INK);
    }
  }
  else {
    // --- BODY shapes (unique per form) ---
    // growthPhase 0..3 = fills out + gains detail within stage
    // Keep YOUR pet's growth in battles; rivals use their stored growth
    let g = 0;
    if (form !== 'egg' && form !== 'dead') {
      if (S.battle && S.bat && form === S.bat.enemyForm && form !== S.form) {
        g = Math.min(3, S.bat.enemyGrowth || 0);
      } else {
        g = Math.min(3, S.growthPhase || 0);
      }
    }
    if (form === 'baby') {
      // Nugget → chubby baby with feet/arms as it grows
      const r = 10 + g;
      fillCirc(0, 2, r, INK);
      px(-12 - g, 4, INK); px(12 + g, 4, INK);
      if (g >= 1) { px(-13 - g, 5, INK); px(13 + g, 5, INK); }
      if (g >= 2) { fillRect(-5, 10 + g, 3, 2, INK); fillRect(3, 10 + g, 3, 2, INK); }
      if (g >= 3) { px(-2, -r + 2, BG); px(2, -r + 2, BG); } // tiny brow nubs
    } else if (form === 'child') {
      const r = 13 + g;
      fillCirc(0, 1, r, INK);
      fillCirc(-8 - g, -12 - Math.floor(g/2), 3 + (g > 1 ? 1 : 0), INK);
      fillCirc(8 + g, -12 - Math.floor(g/2), 3 + (g > 1 ? 1 : 0), INK);
      if (g >= 1) { fillRect(-6, 12 + Math.floor(g/2), 4, 2, INK); fillRect(3, 12 + Math.floor(g/2), 4, 2, INK); }
      if (g >= 2) { px(-r + 2, 2, INK); px(r - 2, 2, INK); } // stub arms
      if (g >= 3) { px(0, -r - 1, INK); px(-1, -r, INK); px(1, -r, INK); } // little tuft
    } else if (form === 'teenGood') {
      const r = 14 + g;
      fillCirc(0, 0, r, INK);
      for (let i = -7; i <= 7; i += 2) px(i, -17 - g, INK);
      px(0, -19 - g, INK); px(-2, -18 - g, INK); px(2, -18 - g, INK);
      if (g >= 1) { fillRect(-7, 13 + g, 4, 2, INK); fillRect(4, 13 + g, 4, 2, INK); }
      if (g >= 2) { px(-r, -2, INK); px(r, -2, INK); px(-r - 1, 0, INK); px(r + 1, 0, INK); }
      if (g >= 3) { px(-3, -r + 4, BG); px(3, -r + 4, BG); } // cheek shine
    } else if (form === 'teenBad') {
      const r1 = 12 + g, r2 = 10 + g;
      fillCirc(-3, 1, r1, INK);
      fillCirc(5, 3, r2, INK);
      px(-12 - g, -12, INK); px(12 + g, -10, INK);
      px(-10 - g, -14, INK); px(10 + g, -13, INK);
      if (g >= 1) { fillRect(-8, 14, 4, 2, INK); fillRect(5, 14, 4, 2, INK); }
      if (g >= 2) { px(-14 - g, 2, INK); px(14 + g, 4, INK); }
      if (g >= 3) { px(-5, -2, BG); px(6, 0, BG); }
      fillRect(-5, 8, 10, 3, BG);
    } else if (form === 'adult1') {
      // Momo — best care, round with side fins/ears
      fillCirc(0, 1, 16, INK);
      fillRect(-22, -10, 6, 12, INK); fillRect(16, -10, 6, 12, INK);
      // little feet
      fillRect(-8, 16, 5, 3, INK); fillRect(4, 16, 5, 3, INK);
    } else if (form === 'adult2') {
      // Kiko — pointed ears, leaner
      fillCirc(0, 1, 15, INK);
      // triangle ears
      for (let i = 0; i < 8; i++) {
        px(-12+i/2, -12-i, INK); px(-11+i/2, -12-i, INK);
        px(12-i/2, -12-i, INK); px(11-i/2, -12-i, INK);
      }
      fillRect(-7, 15, 4, 3, INK); fillRect(4, 15, 4, 3, INK);
    } else if (form === 'adult3') {
      // Taro — wide hat/head band
      fillCirc(0, 2, 16, INK);
      fillRect(-14, -12, 28, 8, INK);
      px(-14, -13, INK); px(13, -13, INK);
      fillRect(-8, 16, 5, 3, INK); fillRect(4, 16, 5, 3, INK);
    } else if (form === 'adult4') {
      // Poko — chubby with belly mark
      fillCirc(0, 2, 18, INK);
      fillCirc(0, 6, 10, BG);
      px(-6, 5, INK); px(6, 5, INK);
      fillRect(-9, 18, 6, 3, INK); fillRect(4, 18, 6, 3, INK);
    } else if (form === 'adult5') {
      // Nori — tall stacked / caterpillar-ish
      fillCirc(0, -10, 10, INK);
      fillCirc(0, 0, 12, INK);
      fillCirc(0, 10, 11, INK);
      px(-14, 2, INK); px(14, 2, INK);
    } else if (form === 'adult6') {
      // Zuzu — neglected, flat wide + heavy brow
      fillCirc(0, 4, 17, INK);
      fillRect(-12, -6, 24, 5, INK);
      fillRect(-10, 18, 7, 3, INK); fillRect(4, 18, 7, 3, INK);
    } else if (form === 'adult7') {
      // Nova — rare perfect-care star form
      fillCirc(0, 2, 15, INK);
      for (let i = 0; i < 8; i++) {
        const ang = i * Math.PI / 4;
        px(Math.round(Math.cos(ang) * 20), Math.round(2 + Math.sin(ang) * 20), INK);
      }
      fillRect(-7, 16, 4, 3, INK); fillRect(4, 16, 4, 3, INK);
    } else if (form === 'adult8') {
      // Bibi — disciplined little horned form
      fillCirc(0, 2, 14, INK);
      for (let i = 0; i < 7; i++) {
        px(-10+i, -12-i, INK); px(10-i, -12-i, INK);
      }
      fillRect(-9, 15, 5, 3, INK); fillRect(4, 15, 5, 3, INK);
    } else if (form === 'adult9') {
      // Rin — sleek athletic (good care + play/train heavy)
      fillCirc(0, 0, 14, INK);
      fillRect(-18, -2, 8, 4, INK); fillRect(10, -2, 8, 4, INK);
      px(-8, -14, INK); px(8, -14, INK);
      fillRect(-6, 14, 4, 3, INK); fillRect(3, 14, 4, 3, INK);
    } else if (form === 'adult10') {
      // Bolt — battle-hardened spiky adult
      fillCirc(0, 1, 15, INK);
      px(0, -18, INK); px(-2, -16, INK); px(2, -16, INK);
      px(-16, 0, INK); px(16, 0, INK); px(-15, -4, INK); px(15, -4, INK);
      fillRect(-8, 15, 5, 3, INK); fillRect(4, 15, 5, 3, INK);
    } else if (form === 'secret') {
      // Elder — dignified with staff-like marks and beard
      fillCirc(0, 0, 16, INK);
      fillRect(-6, 8, 12, 6, INK); // beard
      px(-12, -12, INK); px(12, -12, INK);
      px(-14, -8, INK); px(14, -8, INK);
      // tiny crown
      px(-4, -18, INK); px(0, -20, INK); px(4, -18, INK);
      fillRect(-5, -17, 11, 2, INK);
    } else {
      fillCirc(0, 0, 16, INK);
    }

    // Eyes — fixed sockets, pupils look around together (real eye feel)
    if (form !== 'dead') {
      const ey = form === 'baby' ? -1 : -3; // socket vertical position
      if (eyesClosed) {
        px(-7, ey+1, BG); px(-6, ey+1, BG); px(-5, ey+1, BG); px(-4, ey+1, BG);
        px(4, ey+1, BG); px(5, ey+1, BG); px(6, ey+1, BG); px(7, ey+1, BG);
      } else if (!blink) {
        // Cute larger sockets + tiny pupil dots
        fillRect(-8, ey - 1, 6, 6, BG);
        fillRect(3, ey - 1, 6, 6, BG);

        let lookX = 0, lookY = 0;
        // Fast life-like glance cycle (everywhere including minigames)
        const lookCycle = Math.floor(f / 22) % 12;

        if (S.game && S.gameType === 'look') {
          // First ~0.7s glance around, then lock onto true answer (gameDir)
          const settled = !S._lookSettleAt || Date.now() >= S._lookSettleAt;
          if (!settled) {
            if (lookCycle % 4 === 0) lookX = -1;
            else if (lookCycle % 4 === 1) lookX = 1;
            else if (lookCycle % 4 === 2) lookY = -1;
            else lookX = 0;
          } else {
            lookX = (S.gameDir === 0) ? -1 : 1;
            lookY = 0;
          }
        } else if (S.game && S.gameType === 'memory' && S.memPhase === 'show') {
          lookX = (S.gameDir === 0) ? -1 : 1;
        } else if (S.game || S.battle) {
          // Still lively in other games/battles
          if (lookCycle === 2 || lookCycle === 3) lookX = -1;
          else if (lookCycle === 6 || lookCycle === 7) lookX = 1;
          else if (lookCycle === 4) lookY = -1;
          else if (lookCycle === 9) lookY = 1;
        } else if (S.poop) {
          lookX = (S.poopX > (S.petX || 120)) ? 1 : -1;
          lookY = 1;
        } else if (S.call || S.lightsMissPending) {
          lookX = 1; lookY = -1;
        } else if (S.hunger <= 1 || S.happy <= 1) {
          lookY = -1;
          lookX = (lookCycle < 6) ? -1 : 1;
        } else {
          if (lookCycle === 2 || lookCycle === 3) lookX = -1;
          else if (lookCycle === 6 || lookCycle === 7) lookX = 1;
          if (lookCycle === 4) lookY = -1;
          if (lookCycle === 8 || lookCycle === 9) lookY = 1;
        }

        // Single dark pupil dot per eye (reads clearly in sockets)
        const lx = lookX;
        const ly = lookY;
        px(-6 + lx, ey + 1 + ly, INK);
        px(-5 + lx, ey + 1 + ly, INK);
        px(5 + lx, ey + 1 + ly, INK);
        px(6 + lx, ey + 1 + ly, INK);
      }
    }

    // Mouth
    if (form !== 'dead') {
      const my = form === 'baby' ? 6 : 5;
      if (S.anim === 'yawn') {
        // Big open yawn
        fillRect(-3, my, 7, 5, BG);
        px(-2, my+1, INK); px(0, my+2, INK); px(2, my+1, INK);
      } else if (!eyesClosed) {
        if (faceSick) {
          // Wavy sick mouth
          px(-3, my+1, BG); px(-2, my, BG); px(-1, my+1, BG); px(0, my+2, BG); px(1, my+1, BG); px(2, my, BG); px(3, my+1, BG);
        } else if (happyMouth) {
          px(-3, my, BG); px(-2, my+1, BG); px(-1, my+2, BG); px(0, my+2, BG); px(1, my+2, BG); px(2, my+1, BG); px(3, my, BG);
        } else if (faceHungry) {
          // Open hungry frown
          px(-3, my+1, BG); px(-2, my+2, BG); px(-1, my+3, BG); px(0, my+3, BG); px(1, my+3, BG); px(2, my+2, BG); px(3, my+1, BG);
          px(-1, my+1, BG); px(1, my+1, BG);
        } else if (sadMouth || faceDirty || S.anim === 'sulk') {
          px(-3, my+2, BG); px(-2, my+1, BG); px(-1, my, BG); px(0, my, BG); px(1, my, BG); px(2, my+1, BG); px(3, my+2, BG);
        } else {
          px(-2, my, BG); px(-1, my+1, BG); px(0, my+1, BG); px(1, my+1, BG); px(2, my, BG);
        }
      }
    }
  }

  // Action props — richer classic-style feedback
  if (S.anim === 'eat') {
    // Food morsel near mouth (side), not above head
    const chew = (f % 10 < 5);
    px(12, 2, INK); px(13, 2, INK); px(14, 3, INK); // food bit by mouth
    if (chew) {
      px(-2, 4, BG); px(-1, 5, BG); px(0, 5, BG); px(1, 5, BG); px(2, 4, BG); // open mouth
    }
  }
  if (S.sick || S.anim === 'sick') {
    // Small skull / cross mark
    fillCirc(20, -14, 3, INK);
    px(20, -14, BG);
    px(18, -11, INK); px(22, -11, INK);
  }
  if (S.anim === 'wave' && (f % 10 < 5)) {
    px(18, -6, INK); px(20, -8, INK); px(22, -10, INK); px(23, -9, INK);
  }
  // Call ! beside head (not a long streak)
  if (S.anim === 'call' || (S.call && !S.sleep && !S.anim)) {
    px(15, -16, INK); px(15, -14, INK); px(15, -12, INK);
    px(15, -9, INK);
  }
  // Zzz only when actually sleeping or yawning — never during poop
  if ((S.sleep || S.anim === 'yawn') && S.anim !== 'poop') {
    const z = Math.floor((f % 48) / 16);
    for (let k = 0; k <= z; k++) {
      const zx = 12 + k * 5;
      const zy = -14 - k * 5;
      px(zx, zy, INK); px(zx+1, zy, INK); px(zx+2, zy, INK); px(zx+3, zy, INK);
      px(zx+3, zy+1, INK);
      px(zx+2, zy+2, INK);
      px(zx+1, zy+3, INK);
      px(zx, zy+4, INK); px(zx+1, zy+4, INK); px(zx+2, zy+4, INK); px(zx+3, zy+4, INK);
    }
  }

  ctx.restore();

  // Poop piles only on main home — fill the floor as stacks grow (classic)
  if (S.poop && !S.game && !S.battle && form !== 'egg' && form !== 'dead' && S.anim !== 'poop') {
    const BG2 = '#9bbc0f';
    const py0 = S.poopY || 145;
    const spots = (S.poopSpots && S.poopSpots.length) ? S.poopSpots : [S.poopX || 180];
    const n = Math.max(spots.length, Math.min(4, S.poopCount || 1));
    for (let s = 0; s < n; s++) {
      const ox = spots[s] !== undefined ? spots[s] : (50 + s * 45);
      fillCirc(ox, py0 + 1, 5, INK);
      fillCirc(ox - 4, py0 + 2, 3, INK);
      fillCirc(ox + 4, py0 + 2, 3, INK);
      fillCirc(ox - 1, py0 - 3, 4, INK);
      fillCirc(ox, py0 - 7, 3, INK);
      px(ox - 2, py0 - 4, BG2);
      px(ox + 1, py0 - 8, BG2);
    }
  }
}

function drawModeStrip() {
  // Small selected-mode icon strip at bottom of LCD (classic feel)
  const INK = '#0f380f';
  const labels = ['ST','FD','PL','CL','MD','LT','CN','DS'];
  const x0 = 8;
  const y = H - 12;
  for (let i = 0; i < labels.length; i++) {
    const x = x0 + i * 29;
    if (i === S.sel) {
      fillRect(x - 2, y - 2, 26, 11, INK);
      drawText(labels[i], x + 2, y, '#9bbc0f');
    } else {
      drawText(labels[i], x + 2, y, INK);
    }
  }
}

function drawMain() {
  const night = isNightTime();
  const lcdBg = night ? '#8fad0e' : '#9bbc0f';
  ctx.fillStyle = lcdBg;
  ctx.fillRect(0, 0, W, H);
  if (!S.paused) S.frame++;

  const INK = '#0f380f';

  // --- TOP LEFT: Hunger + Happy ---
  drawText('HUNGER', 4, 3, INK);
  drawHeartsRow(48, 2, S.hunger);
  drawText('HAPPY', 4, 14, INK);
  drawHeartsRow(48, 13, S.happy);

  // Under Happy: evolution stage + name + mood
  const stageLabel = (S.stage || '').toUpperCase();
  const nm = (NAMES[S.form] || 'PAL').toUpperCase().slice(0, 6);
  drawText(stageLabel + ' ' + nm, 4, 26, INK);
  // One-line mood
  let mood = 'OK';
  if (S.stage === 'dead') mood = 'GONE';
  else if (S.sleep) mood = 'ASLEEP';
  else if (S.injured && S.sick) mood = 'INJURED';
  else if (S.sick) mood = 'SICK';
  else if ((S.poopCount || 0) >= 4) mood = 'TRAPPED';
  else if ((S.poopCount || 0) >= 2 || S.poop) mood = 'DIRTY';
  else if (S.hunger <= 0) mood = 'STARVING';
  else if (S.hunger <= 1) mood = 'HUNGRY';
  else if (S.happy <= 0) mood = 'MISERY';
  else if (S.happy <= 1) mood = 'SAD';
  else if (S.happy >= 4 && S.hunger >= 3) mood = 'JOY';
  else if (S.happy >= 3 && S.hunger >= 2) mood = 'HAPPY';
  else if (S.call) mood = 'CALLING';
  drawText(mood, 4, 37, INK);

  // --- TOP MIDDLE: weight / discipline / age / battle XP ---
  drawText('WT ' + (S.weight || 0) + 'G', 100, 3, INK);
  drawText('DISC ' + (S.disc || 0) + '%', 100, 14, INK);
  drawText('AGE ' + S.age, 100, 26, INK);
  drawText('XP ' + (S.battleXP || 0) + ' LV' + battleLevel(S.battleXP), 100, 37, INK);

  // --- TOP RIGHT: Gen above Friends, then clock, sun/moon ---
  let h12 = S.virtualHour % 12;
  if (h12 === 0) h12 = 12;
  const ampm = S.virtualHour < 12 ? 'AM' : 'PM';
  const clock = h12 + ':' + S.virtualMin.toString().padStart(2,'0') + ampm;
  const genStr = 'GEN ' + (S.generation || 1);
  const frStr = 'FR ' + ((S.friends && S.friends.length) || 0);
  const CW = 6; // must match drawText advance
  const rightPad = 4;
  drawText(genStr, W - rightPad - genStr.length * CW, 3, INK);
  drawText(frStr, W - rightPad - frStr.length * CW, 14, INK);
  drawText(clock, W - rightPad - clock.length * CW, 25, INK);
  // Sun / Moon under clock
  const sunX = W - 14;
  if (night) {
    fillCirc(sunX, 42, 5, INK);
    fillCirc(sunX + 3, 40, 4, lcdBg);
  } else {
    fillCirc(sunX, 42, 3, INK);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      px(sunX + Math.round(Math.cos(a) * 6), 42 + Math.round(Math.sin(a) * 6), INK);
    }
  }

  // Attention / call icon — bottom-left of pet area
  if ((S.call || S.lightsMissPending || S.poop) && !S.sleep) {
    fillRect(6, 128, 16, 16, INK);
    fillRect(8, 130, 12, 12, lcdBg);
    px(13, 132, INK); px(13, 133, INK); px(13, 134, INK); px(13, 135, INK);
    px(13, 138, INK);
  }

  drawPet(S.petX || 120, 100, S.form, S.frame);
  drawFx();

  if (S.sleep) {
    const z = Math.floor(S.frame / 16) % 3;
    drawText('Z'.repeat(z + 1), 150, 58 - z * 3, INK);
  }

  drawModeStrip();

  if (S.paused) {
    fillRect(72, 72, 96, 24, INK);
    drawText('PAUSED', 102, 80, lcdBg);
  }
}

function nextEvoHint() {
  if (S.stage === 'egg') return 'WAIT TO HATCH';
  if (S.stage === 'baby') return 'CHILD (TIME)';
  if (S.stage === 'child') return S.age >= 2 ? 'READY FOR TEEN' : ('NEED AGE 2 NOW ' + S.age);
  if (S.stage === 'teen') return S.age >= 5 ? 'READY FOR ADULT' : ('NEED AGE 5 NOW ' + S.age);
  if (S.stage === 'adult') {
    if ((S.form === 'adult1' || S.form === 'adult3' || S.form === 'adult7' || S.form === 'adult10') && S.disc >= 75 && S.age >= 12) return 'SECRET READY';
    return 'FULLY GROWN';
  }
  if (S.stage === 'dead') return '---';
  return '';
}
function drawStatus() {
  ctx.fillStyle = '#9bbc0f';
  ctx.fillRect(0, 0, W, H);
  const timeStr = (() => { let h=S.virtualHour%12; if(h===0)h=12; return h+':'+S.virtualMin.toString().padStart(2,'0')+(S.virtualHour<12?'AM':'PM'); })();
  let state = 'AWAKE';
  if (S.paused) state = 'PAUSED';
  else if (S.stage === 'dead') state = 'RETURNED';
  else if (S.sleep) state = 'SLEEPING';
  else if (isNightTime()) state = 'NIGHT';
  const flags = [
    S.sick ? 'SICK' : null,
    S.poop ? 'DIRTY' : null,
    S.call ? 'CALLING' : null,
    !S.lights ? 'LIGHTS OFF' : null,
    S.married ? 'PARENT' : null,
    S.battle ? 'IN BATTLE' : null
  ].filter(Boolean).join(' ') || 'OK';
  const lines = [
    (NAMES[S.form] || S.form) + ' · ' + formTrait(S.form),
    (S.stage||'').toUpperCase() + ' GEN' + S.generation + '  POW ' + battlePower(),
    'AGE ' + S.age + '  WT ' + S.weight + 'G  LV ' + battleLevel(S.battleXP),
    'HUN ' + S.hunger + '/4  HAP ' + S.happy + '/4  DISC ' + S.disc + '%',
    'STREAK ' + (S.careStreak || 0) + 'D  FAMILY ' + ((S.petFamily&&S.petFamily.length)||0),
    'BATTLE ' + (S.battleWins||0) + 'W-' + (S.battleLosses||0) + 'L  XP ' + (S.battleXP||0),
    'NEXT ' + nextEvoHint(),
    'CODE ' + (S.myCode || '---') + '  FR ' + ((S.friends && S.friends.length)||0),
    'TIME ' + timeStr + '  8PM-8AM',
    'PACE REAL-PET  ALERT ' + (S.notifications?'ON':'OFF'),
    state + (flags && flags !== 'OK' ? ' ' + flags : '')
  ];
  lines.forEach((l, i) => drawText(String(l).slice(0, 38), 4, 3 + i * 16, '#0f380f'));
}

function drawGame() {
  ctx.fillStyle = '#9bbc0f';
  ctx.fillRect(0, 0, W, H);
  const INK = '#0f380f';

  // ========== TRAIN XP (timing skill — Digimon training vibe) ==========
  if (S.gameType === 'train') {
    drawTextCentered('TRAIN XP', 4, INK);
    drawTextCentered('PRESS THE LETTER', 16, INK);
    drawTextCentered(S.gScore + ' OK / R' + S.gRound + '/4', 28, INK);
    drawPet(120, 100, S.form, S.frame);
    if (S.trainPhase === 'go') {
      // Always show a concrete letter (never blank)
      if (S.trainBtn !== 'A' && S.trainBtn !== 'B') S.trainBtn = 'B';
      const letter = S.trainBtn;
      drawTextCentered('*** GO ***', 44, INK);
      drawTextCentered('PRESS ' + letter + ' NOW', 56, INK);
      drawTextCentered('HURRY!', 150, INK);
    } else {
      drawTextCentered('WAIT FOR IT...', 48, INK);
      drawTextCentered('DONT PRESS YET', 150, INK);
    }
    drawTextCentered('C CANCEL', 166, INK);
    return;
  }

  // ========== MEMORY (Simon sequence — NOT the same as Look) ==========
  if (S.gameType === 'memory') {
    drawTextCentered('MEMORY', 4, INK);
    drawTextCentered('REPEAT THE ORDER', 16, INK);
    drawTextCentered('LEN ' + (S.memSeq ? S.memSeq.length : 0) + '  OK ' + S.gScore, 28, INK);
    if (S.memPhase === 'show') {
      const dir = S.memSeq[S.memIdx];
      S.gameDir = dir;
      // Big side flash only (sequence teach) — pet stays centered
      drawTextCentered('WATCH', 42, INK);
      drawTextCentered((S.memIdx + 1) + ' / ' + S.memSeq.length, 54, INK);
      if (dir === 0) {
        drawText('<<<', 16, 90, INK);
        drawText('LEFT', 16, 102, INK);
      } else {
        drawText('>>>', 190, 90, INK);
        drawText('RIGHT', 180, 102, INK);
      }
      drawPet(120, 115, S.form, S.frame);
    } else {
      // Input: no spoilers, centered pet, player must remember
      drawTextCentered('YOUR TURN', 42, INK);
      drawTextCentered('STEP ' + (S.memIdx + 1) + '/' + S.memSeq.length, 54, INK);
      drawPet(120, 110, S.form, S.frame);
      drawTextCentered('A LEFT   B RIGHT', 152, INK);
    }
    drawTextCentered('C CANCEL', 166, INK);
    return;
  }

  // ========== LOOK (classic Tamagotchi — guess facing, one shot per round) ==========
  // Completely different: no sequence, no GO timing — just read the pet once
  drawTextCentered('LOOK', 4, INK);
  drawTextCentered('WHICH WAY?', 16, INK);
  drawTextCentered('R' + S.gRound + '/5  SCORE ' + S.gScore, 28, INK);
  drawPet(120, 100, S.form, S.frame);
  if (S._lookSettleAt && Date.now() < S._lookSettleAt) {
    drawTextCentered('WATCH...', 48, INK);
  } else {
    drawTextCentered('A LEFT  OR  B RIGHT', 48, INK);
  }
  drawTextCentered('C CANCEL', 166, INK);
}

function render() {
  if (S.stage === 'dead') {
    ctx.fillStyle = '#9bbc0f';
    ctx.fillRect(0, 0, W, H);
    if (S.anim === 'death') {
      // rising body before spirit form
      drawPet(120, 85, S.form === 'dead' ? 'adult1' : S.form, S.frame);
      drawText('FAREWELL...', 80, 160, '#0f380f');
    } else {
      drawPet(120, 85, 'dead', S.frame);
      drawText('RETURNED HOME', 70, 150, '#0f380f');
    }
    drawFx();
  } else if (S.menu === 'status') {
    drawStatus();
  } else if (S.battle) {
    drawBattle();
  } else if (S.game) {
    drawGame();
  } else {
    drawMain();
  }
  // Darken when lights are off
  if (!S.lights) {
    ctx.fillStyle = S.sleep ? 'rgba(0,0,0,0.55)' : 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);
  }
  // Strong pause veil
  if (S.paused && S.stage !== 'dead') {
    ctx.fillStyle = 'rgba(15,56,15,0.25)';
    ctx.fillRect(0, 0, W, H);
  }
}

function update() {
  const now = Date.now();

  // The wall clock always follows the phone, including egg/dead/paused states.
  syncDeviceClock(now);

  // Battle state machine
  if (S.battle) advanceBattle(now);

  // Training timing game
  if (S.game && S.gameType === 'train') {
    if (S.trainPhase === 'wait' && now >= (S.trainUntil || 0)) {
      S.trainPhase = 'go';
      S.trainBtn = (Math.random() < 0.5) ? 'A' : 'B';
      S.trainUntil = now + 750;
      toast('PRESS ' + S.trainBtn + '!');
      beep(880, 0.06);
    } else if (S.trainPhase === 'go' && now >= (S.trainUntil || 0)) {
      // Too slow
      S.playResult = 'sad';
      endTraining(false);
    }
  }

  // Memory game: show each step, then switch to input
  if (S.game && S.gameType === 'memory' && S.memPhase === 'show' && now > (S.memTimer || 0)) {
    // Finished displaying current step — advance
    if (S.memIdx >= S.memSeq.length - 1) {
      // Whole sequence shown
      S.memIdx = 0;
      S.memPhase = 'input';
      toast('Your turn! A=Left B=Right');
      beep(600, 0.05);
    } else {
      S.memIdx++;
      S.memTimer = now + 750;
      beep(400, 0.03);
    }
  }

  // Egg/dead states do not run the care simulation.
  if (S.stage === 'dead' || S.stage === 'egg') return;

  // True pause: freeze gameplay timers and animation state. The wall clock
  // remains the real phone time, but pause never causes sleep/care catch-up.
  if (S.paused) return;

  // Clear temporary face / anim when timer expires (except permanent sleep)
  if (S.animTimer && now > S.animTimer) {
    if (S.anim !== 'sleep') {
      // Finish poop sequence → show pile + call
      if (S.anim === 'poop' || S._pendingPoop) {
        S.poop = true;
        S.call = true;
        S._falseCall = false;
        S._pendingPoop = false;
        S.poopSince = now;
      }
      S.anim = null;
      S.playResult = null;
      S.animTimer = 0;
    }
  }

  const d = DIFF[S.difficulty] || DIFF.realtime;
  const sp = d.timeScale || 0.15;  // higher = faster; realtime default is classic speed

  // --- Automatic sleep / wake cycle ---
  const night = isNightTime();
  // Daytime safety: clear stale bedtime flags; never stay asleep at 2pm
  if (!night) {
    if (S.lightsMissPending) S.lightsMissPending = false;
    if (S.sleep) {
      // Force wake if somehow sleeping outside night window
      S.sleep = false;
      S.lights = true;
      S.anim = 'wake';
      S.animTimer = now + 1000;
      toast('Woke up (daytime)');
      save();
    }
  }
  if (!S.sleep && night && !S.game) {
    // Pet wants to sleep
    if (!S.lightsMissPending) {
      S.lightsMissPending = true;
      S.sleepStart = now;
      S.call = true; // attention icon for "turn lights off"
      careNotify('lights', 'Needs LIGHTS OUT — turn lights OFF for sleep!');
      S.anim = 'yawn';
      S.animTimer = now + 1600;
      toast('Getting sleepy... turn lights OFF');
      beep(300, 0.12);
    } else if (now - S.sleepStart > (S.difficulty === 'realtime' ? 12*60000 : 55*1000)) {
      // realtime keeps closer to classic 15 min grace; others use short web-friendly window
      S.careMiss += d.care;
      S.lightsMissPending = false;
      S.sleep = true; // falls asleep anyway (but grumpy / lights still on)
      S.call = false;
      S.anim = 'sleep';
      S.animTimer = now + 999999;
      toast('Left lights on! Care mistake');
      beep(160, 0.15);
      save();
    }
  } else if (S.sleep && !night) {
    // Natural morning wake-up — classic Tamagotchi ages +1 day here
    S.sleep = false;
    S.lights = true;
    S.lightsMissPending = false;
    S.anim = 'wake';
    S.animTimer = now + 1400;
    S.call = false;
    // Age once per calendar morning after a night of sleep
    const dayKey = new Date(now).toDateString();
    // Also age if last age-up was more than 10 hours ago (covers edge cases)
    const longEnough = !S.lastAge || (now - S.lastAge > 10 * 3600000);
    if (S.lastAgeDay !== dayKey && longEnough) {
      S.age++;
      S.lastAgeDay = dayKey;
      S.lastAge = now;
      S.anim = 'grow';
      S.animTimer = now + 1200;
      checkEvo();
      toast('Good morning! Age ' + S.age);
      melWake();
    } else if (S.lastAgeDay !== dayKey) {
      // Same morning re-wake: still mark the day, soft toast
      S.lastAgeDay = dayKey;
      toast('Good morning!');
      melWake();
    } else {
      toast('Good morning!');
      melWake();
    }
    S.sleptProperly = false;
    // Authentic: if poop timer was due overnight, go shortly after wake
    const d2 = DIFF[S.difficulty] || DIFF.realtime;
    const sp2 = d2.timeScale || 0.15;
    if (!S.poop && S.lastP && (now - S.lastP > 5.5 * 60000 / sp2)) {
      S._wakePoopAt = now + 4000 + Math.floor(Math.random() * 4000);
    }
    save();
  }

  // If already night and lights are off, auto-sleep cleanly
  if (night && !S.sleep && !S.lights && !S.game) {
    S.sleep = true;
    S.lightsMissPending = false;
    S.sleptProperly = true;
    S.anim = 'sleep';
    S.animTimer = now + 999999;
  }

  // While asleep — care timers freeze (no poop / hunger / false calls mid-sleep)
  // Matches classic: pet rests at night; needs resume after wake
  if (S.sleep) {
    // Keep anim locked to sleep
    if (S.anim !== 'sleep' && S.anim !== 'wake') {
      S.anim = 'sleep';
      S.animTimer = now + 999999;
    }
    return; // skip hunger/happy/poop/discipline while sleeping
  }

  if (true) {
    // Hunger drain
    if (now - S.lastH > (S.age < 1 ? 3.2 : 2.5) * 60000 / sp * d.hunger) {
      if (S.hunger > 0) {
        S.hunger--;
        if (S.hunger === 0) {
          S.call = true; S._falseCall = false;
          careNotify('hunger', 'Needs FOOD — open PocketPal and feed me!');
          S.anim = 'call'; S.animTimer = now + 1200;
        }
      } else {
        S.careMiss += d.care;
        S.call = true;
        S._falseCall = false;
        S.anim = 'call'; S.animTimer = now + 1200;
        if (Math.random() < 0.22) {
          S.sick = true; S.sickSince = now;
          careNotify('sick', 'Needs MEDICINE — open PocketPal and heal me!');
          S.anim = 'sick';
          S.animTimer = now + 2000;
          melSick();
        }
      }
      S.lastH = now;
      save();
    }

    // Happy drain
    if (now - S.lastY > (S.age < 1 ? 3.8 : 2.9) * 60000 / sp * d.happy) {
      if (S.happy > 0) {
        S.happy--;
        if (S.happy === 0) {
          S.call = true; S._falseCall = false;
          careNotify('happy', 'Needs PLAY — open PocketPal and play with me!');
          S.anim = 'call'; S.animTimer = now + 1200;
        }
      } else {
        S.careMiss += d.care;
        S.call = true;
        S._falseCall = false;
        S.anim = 'call'; S.animTimer = now + 1200;
      }
      S.lastY = now;
      save();
    }

    // Soft injury recovery over time (slow natural heal if not critical)
    if (S.sick && S.sickSince && now - S.sickSince > 25 * 60000 / sp) {
      // ~25 min realtime-scaled without meds — chance to improve
      if (S.hunger >= 2 && S.happy >= 1 && !S.poop && Math.random() < 0.15) {
        S.sick = false;
        S.sickSince = 0;
        S.injured = false;
        S.anim = 'happy';
        S.animTimer = now + 1000;
        toast('Feeling better on its own');
        melHappy();
        save();
      }
    } else if (S.sick && !S.sickSince) {
      S.sickSince = now;
    }

    // Post-wake delayed poop (if due overnight)
    if (S._wakePoopAt && now >= S._wakePoopAt && (S.poopCount || 0) < 4 && S.anim !== 'poop') {
      S._wakePoopAt = 0;
      S.poopX = Math.round(S.petX || 120) + 16;
      S.poopY = 145;
      S.lastP = now;
      S.poopSince = now;
      if (S.game || S.battle) {
        S.poop = true;
        S.poopCount = Math.min(4, (S.poopCount || 0) + 1);
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
      } else {
        S.anim = 'poop';
        S.animTimer = now + 1100;
        S._pendingPoop = true;
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
        toast('Needs cleaning!');
        melPoop();
      }
      save();
    }

    // Poop — squat animation first, then pile appears
    if (now - S.lastP > 5.5 * 60000 / sp && (S.poopCount || 0) < 4 && S.anim !== 'poop') {
      S.poopX = Math.round(S.petX || 120) + 16;
      S.poopY = 145;
      S.lastP = now;
      S.poopSince = now;
      if (S.game || S.battle) {
        S.poop = true;
        S.poopCount = Math.min(4, (S.poopCount || 0) + 1);
        if (!S.poopSpots) S.poopSpots = [];
        S.poopSpots.push(Math.round(S.petX || 120) + 16);
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
      } else {
        S.anim = 'poop';
        S.animTimer = now + 1100;
        S._pendingPoop = true;
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
        toast('Needs cleaning!');
        melPoop();
        beep(200, 0.08);
      }
      save();
    }
    // Filth escalation (classic: piles fill screen → misery → sick → death risk)
    if (S.poop && S.poopSince && now - S.poopSince > 6 * 60000 / sp) {
      const stacks = Math.max(1, S.poopCount || 1);
      S.careMiss += d.care * stacks;
      if (S.happy > 0) S.happy = Math.max(0, S.happy - 1);
      // Screen full of poop (4) — pet trapped, gets sick
      if (stacks >= 4 && !S.sick && Math.random() < 0.35) {
        S.sick = true;
        S.sickSince = now;
        S.call = true;
        careNotify('sick', 'Needs MEDICINE — too filthy!');
        toast('Sick from the mess!');
        melSick();
      } else if (stacks >= 3) {
        toast('Filthy! (' + stacks + '/4 piles)');
      } else {
        toast(stacks > 1 ? 'Messy! (' + stacks + ' piles)' : 'Still dirty!');
      }
      S.poopSince = now;
      S.call = true;
      save();
    }

    // Classic false call — pet seeks attention for no real need (teach discipline)
    // Well-trained pets (high disc) almost never false-call; at 100% they stop.
    const fcCooldown = 8 * 60000;
    const disc = S.disc || 0;
    if (disc < 100 &&
        !S.call && !S.poop && !S.sick && !S.lightsMissPending &&
        S.stage !== 'egg' && S.stage !== 'dead' && !S.sleep &&
        (now - (S.lastFalseCall || 0)) > fcCooldown / Math.max(0.5, (DIFF[S.difficulty]||DIFF.realtime).timeScale || 0.15)) {
      // Unhappy pets false-call more; disc does NOT passively drain (classic scold-based)
      let chance = disc >= 80 ? 0.000008 : disc >= 50 ? 0.000015 : 0.000025;
      if (S.happy <= 1) chance *= 2.5;
      if (S.hunger <= 1) chance *= 0.5; // real need prefers hunger call
      if (Math.random() < chance) {
        S.call = true;
        S._falseCall = true;
        S.lastFalseCall = now;
        S.anim = 'call';
        S.animTimer = now + 1500;
        toast('Calling... (try Discipline)');
        melCall();
        careNotify('discipline', 'False call — open PocketPal and use Discipline!');
        save();
      }
    }
  }


  // Daytime boredom / sleepiness (not a full night sleep)
  if (!S.sleep && !S.game && !S.battle && !isNightTime() && S.stage !== 'egg' && S.stage !== 'dead') {
    // Bored (happy 0-1): yawn + call for attention/play; lights optional comfort
    if (S.happy <= 1 && !S.call && Math.random() < 0.00002) {
      S.anim = 'yawn';
      S.animTimer = now + 1200;
      S.call = true;
      careNotify('happy', 'Needs PLAY — bored and restless!');
      toast('Bored... wants to play');
    }
    // Babies get sleepy in long daytime stretches
    if ((S.stage === 'baby' || S.stage === 'child') && S.happy >= 2 && S.hunger >= 2 &&
        (now - (S.lastNapOffer || 0)) > 25 * 60000 && Math.random() < 0.000015) {
      S.lastNapOffer = now;
      S.call = true;
      S.lightsMissPending = false;
      careNotify('lights', 'Sleepy baby — lights OFF for a nap?');
      toast('Getting sleepy...');
      S.anim = 'yawn';
      S.animTimer = now + 1000;
    }
  }

  // Mid-day growth ticks (visible change every ~1 real hour while awake)
  if (!S.sleep && S.stage !== 'egg' && S.stage !== 'dead') {
    const gEvery = 90 * 60000; // ~90 min real time per growth step
    if (!S.lastGrowthAt) S.lastGrowthAt = now;
    if (now - S.lastGrowthAt > gEvery) {
      S.lastGrowthAt = now;
      if ((S.growthPhase || 0) < 3) {
        S.growthPhase = (S.growthPhase || 0) + 1;
        S.anim = 'grow';
        S.animTimer = now + 1000;
        toast('Growing... (' + S.growthPhase + '/3)');
        beep(500, 0.06);
        save();
      }
    }
  }

  // Backup awake-time age (secondary to morning wake-up age).

  // Guarded by lastAgeDay so we never age twice on the same calendar day.
  if (!S.sleep && now - S.lastAge > 20 * 3600000 / sp) {
    const dayKey = new Date(now).toDateString();
    if (S.lastAgeDay !== dayKey) {
      S.age++;
      S.lastAge = now;
      S.lastAgeDay = dayKey;
      S.anim = 'grow';
      S.animTimer = now + 1000;
      checkEvo();
      beep(520, 0.1); beep(700, 0.12);
      toast('Happy birthday! Age ' + S.age);
      save();
    }
  }

  // Death: neglect always; old-age closer to classic adult lifespan
  // Classic units often lived ~10–14+ days with good care, then returned.
  // Our age ≈ days; adults become eligible after a full life.
  if (now < (S.loadGraceUntil || 0)) {
    // grace after load/offline — no death
  } else if ((S.hunger + S.happy === 0 && S.careMiss > 14 * d.care) ||
      (S.sick && S.hunger === 0 && S.careMiss > 16 * d.care) ||
      ((S.poopCount || 0) >= 4 && S.sick && S.happy === 0 && S.careMiss > 12 * d.care)) {
    die();
  } else if (S.stage === 'adult' && S.age >= 12) {
    // Rising chance with age (classic: long adult life → natural return)
    // ~age 12 soft start; by 18–20 much more likely over time
    const over = S.age - 11; // 1 at age 12
    const chance = Math.min(0.00012, 0.000012 * over * over);
    if (Math.random() < chance) die();
  }

  if (now - S.lastSave > 30000) save();
}

function checkEvo() {
  const t = Date.now() - (S.born || Date.now());
  // Classic-style timing (accelerated for web play)
  // Real Gen1: baby ~65 min, child ~1 day, teen ~1-2 days — we scale for playable sessions
  // Real-pet pace (web-friendly): longer stages so growth phases matter
  // Baby ~4 min life, child needs age 2, teen needs age 5, secret later
  if (S.stage === 'baby' && t > 4 * 60000) {
    evo('child', 'child');
  } else if (S.stage === 'child' && S.age >= 2) {
    const good = (S.careMiss - S.inheritedBonus) < 3;
    evo('teen', good ? 'teenGood' : 'teenBad');
  } else if (S.stage === 'teen' && S.age >= 5) {
    evoAdult();
  } else if (S.stage === 'adult' && (S.form === 'adult1' || S.form === 'adult3' || S.form === 'adult7' || S.form === 'adult10') && S.disc >= 75 && S.age >= 12) {
    evo('adult', 'secret');
    toast('Secret form unlocked: Elder!');
  }
}
function evo(st, fm) {
  S.stage = st;
  S.form = fm;
  S.growthPhase = 0;
  S.lastGrowthAt = Date.now();
  S.careMiss = Math.floor(S.careMiss * 0.45);
  S.anim = 'evo';
  S.animTimer = Date.now() + 2200;
  S.playResult = null;
  melEvolve();
  toast('Evolved → ' + (NAMES[fm] || fm) + ' · ' + formTrait(fm));
  if (st === 'adult' || st === 'teen') recordFamilyMember('evolved');
  save();
}
function evoAdult() {
  // Classic care-mistake + discipline + weight tiers
  // Lower careMiss = better adult (matches Gen1/Gen2 philosophy)
  const c = Math.max(0, S.careMiss - S.inheritedBonus);

const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function codeChecksum(body) {

}
function isValidFriendCode(code) {

  const body = code.slice(0, 5);
  const check = code[5];
  for (let i = 0; i < 5; i++) {

  }
  return codeChecksum(body) === check;
}

  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 0x100000000; };
  const forms = ['teenGood','teenBad','adult1','adult2','adult3','adult4','adult5','adult6','adult7','adult8','adult9','adult10'];
  const names = ['Momo','Kiko','Taro','Poko','Nori','Zuzu','Lumi','Grub','Nova','Bibi','Rin','Bolt'];
  const form = forms[Math.floor(rnd() * forms.length)];
  const stage = form.startsWith('teen') ? 'teen' : 'adult';
  return {
    code,
    name: names[Math.floor(rnd() * names.length)] + '-' + code.slice(0, 2),
    form,
    stage,
    age: stage === 'teen' ? 3 + Math.floor(rnd() * 3) : 5 + Math.floor(rnd() * 8),
    xp: Math.floor(rnd() * 40),
    wins: Math.floor(rnd() * 15),
    losses: Math.floor(rnd() * 10),
    wt: 10 + Math.floor(rnd() * 12),
    disc: Math.floor(30 + rnd() * 70),
    growth: Math.floor(rnd() * 4),
    quality: 0.25 + rnd() * 0.7
  };
}

function stageRank(st) {

      if (B.myPower > B.enPower && (B.charge || 0) >= 3) raw += 1;
      if (battleLevel(S.battleXP) >= 10 && (B.charge || 0) >= 4) raw += 1;
      if (sta <= 0) { raw = Math.max(0, raw - 2); B.log = 'TIRED...'; }
      else if (sta <= 3) { raw = Math.max(0, raw - 1); }
      if (enGuard) raw = Math.max(0, raw - 2);

    const dmg = Math.min(4, raw);
    B.myHP = Math.max(0, B.myHP - dmg);
    B.pendingDmg = dmg;
    B.log = dmg >= 3 ? 'OUCH!!' : (dmg > 0 ? '-' + dmg + ' HP' : 'BLOCKED!');
    B.phase = 'result';
    B.phaseUntil = now + 1100;
    if (dmg >= 2) { S.anim = 'sulk'; S.animTimer = now + 700; beep(150, 0.08); }
    return;
  }
  if (B.phase === 'result') {
    if (B.myHP <= 0) {
      B.phase = 'end';
      B.won = false;
      B.phaseUntil = now + 1600;
      B.log = 'DEFEAT...';

      return;
    }
    B.phase = 'order';
    B.phaseUntil = now + 2800;
    B.order = null;
    B.charge = 0;
    B.myStamina = Math.min(B.myStaminaMax, (B.myStamina || 0) + 2);

function workerBaseUrl() {
  const u = window.POCKETPAL_PUSH_URL || window.POCKETPAL_WORKER_URL || '';
  if (!u) return '';
  return u.replace(/\/push\/?$/, '').replace(/\/$/, '');
}
function myBattleCard() {
  return {
    code: generateCode(),
    name: NAMES[S.form] || 'Pal',
    form: S.form,
    stage: S.stage,
    age: S.age || 0,
    xp: S.battleXP || 0,
    wins: S.battleWins || 0,
    losses: S.battleLosses || 0,
    wt: S.weight || 10,
    disc: S.disc || 0,
    growth: S.growthPhase || 0,
    quality: Math.min(0.95, 0.3 + (S.disc || 0) / 150 + (S.battleWins || 0) / 40),
    updated: Date.now()
  };
}
async function publishBattleCard() {
  const base = workerBaseUrl();
  if (!base) return false;
  try {
    await fetch(base + '/battle/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(myBattleCard())
    });
    return true;
  } catch (e) { return false; }
}
async function fetchLiveBattleCard(code) {
  const base = workerBaseUrl();
  if (!base) return null;
  try {
    const r = await fetch(base + '/battle/' + encodeURIComponent(code));
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

async function startFriendBattle() {
  hide();
  if (!S.friends.length) {
    toast('Add a friend code first (Connect menu)');
    beep(160, 0.08);
    return;
  }
  const block = canBattle();
  if (block) {
    toast(block);
    beep(160, 0.08);
    return;
  }
  let f = S.friends[S.selectedFriend] || S.friends[0];
  // Publish our card, then try live snapshot of friend from Cloudflare Worker
  toast('Linking...');
  await publishBattleCard();
  const live = await fetchLiveBattleCard(f.code);
  if (live && live.form) {
    f = {
      code: f.code,
      name: live.name || f.name,
      form: live.form,
      stage: live.stage,
      age: live.age,
      xp: live.xp,
      wins: live.wins,
      losses: live.losses,
      wt: live.wt,
      disc: live.disc,
      growth: live.growth,
      quality: live.quality,
      tier: live.tier
    };
    toast('Live card: ' + (f.name || 'Friend'));
  } else {
    toast('Snapshot battle (friend offline)');
  }
  startBattle('friend', f);
}

window.startFriendBattle = startFriendBattle;

// Light training mini-game → Battle XP (Digimon-inspired, simple timing)
function startStatTraining() {
  hide();
  if (S.stage === 'egg' || S.stage === 'dead') { toast('No pet'); return; }
  if (S.sleep) { toast('Sleeping...'); return; }
  if (S.sick) { toast('Too sick to train'); return; }
  if (S.hunger <= 0) { toast('Too hungry'); return; }
  S.battle = false; S.bat = null;
  S.game = true;
  S.gameType = 'train';
  S.gRound = 1;
  S.gScore = 0;
  S.trainPhase = 'wait';
  S.trainUntil = Date.now() + 500 + Math.random() * 2200;
  S.menu = null;
  toast('TRAIN XP: wait, then press the letter shown!');
  beep(400, 0.05);
}
window.startStatTraining = startStatTraining;

function trainPress(btn) {
  // btn: 'A' or 'B' — must match S.trainBtn during GO phase
  if (!S.game || S.gameType !== 'train') return;
  const now = Date.now();
  if (S.trainPhase === 'go') {
    const need = S.trainBtn || 'B';
    if (btn !== need) {
      S.playResult = 'sad';
      beep(160, 0.08);
      toast('Wrong button! Needed ' + need);
      endTraining(S.gScore >= 2);
      return;
    }
    S.gScore++;
    S.playResult = 'happy';
    beep(700, 0.05);
    S.gRound++;
    if (S.gRound > 4) {
      endTraining(true);
    } else {
      S.trainPhase = 'wait';
      S.trainBtn = null;
      S.trainUntil = now + 400 + Math.random() * 2000;
      S.playResult = null;
      toast('Good! Round ' + S.gRound);
    }
  } else {
    // Too early
    S.playResult = 'sad';
    beep(160, 0.08);
    toast('Too early!');
    endTraining(false);
  }
}
function endTraining(ok) {
  S.game = false;
  S.gameType = null;
  S.trainPhase = null;
  if (ok) {
    const bonus = S.gScore >= 4 ? 3 : 2;
    S.battleXP = (S.battleXP || 0) + bonus;
    S.weight = Math.max(5, S.weight - 1);
    S.happy = Math.min(4, S.happy + (S.gScore >= 3 ? 1 : 0));
    S.anim = 'happy';
    S.animTimer = Date.now() + 1400;
    spawnFx('star', S.petX || 120, 70, 4);
    spawnFx('heart', S.petX || 120, 85, 2);
    toast(S.gScore >= 4 ? 'Perfect train! +' + bonus + ' XP' : 'Trained! +' + bonus + ' XP');
    melTrain();
  } else {
    S.battleXP = (S.battleXP || 0) + 1;
    S.anim = 'sulk';
    S.animTimer = Date.now() + 900;
    toast('Missed — still +1 XP');
    melLose();
  }
  save();
}

function addFriend() {
  const input = document.getElementById('friend-code');
  if (!input) return;
  const code = (input.value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!isValidFriendCode(code)) {
    toast('Invalid code');
    beep(140, 0.1);
    return;
  }
  if (code === S.myCode) { toast('That is your own code'); return; }
  if (S.friends.find(f => f.code === code)) { toast('Already friends'); return; }
  if (S.friends.length >= 10) { toast('Friend list full (10)'); return; }

  const friend = friendFromCode(code);
  S.friends.push(friend);
  S.happy = Math.min(4, S.happy + 1);
  S.anim = 'wave';
  S.animTimer = Date.now() + 1600;
  spawnFx('heart', S.petX || 120, 80, 3);
  toast('Connected with ' + friend.name + '!');
  beep(600, 0.1); beep(800, 0.12);
  save();
  showConnectMenu();
}

function tryBreed() {
  if (S.stage !== 'adult') { toast('Need to be Adult first'); return; }
  if (S.friends.length === 0) { toast('Add a friend first'); return; }
  if (S.married) { toast('Already has offspring'); return; }

  const partner = S.friends[S.selectedFriend] || S.friends[0];
  S.married = true;
  S.happy = 4;
  // Parent care quality + partner quality → inherited bonus for next gen
  const myCare = S.careMiss < 2 ? 0.85 : S.careMiss < 5 ? 0.5 : 0.25;
  const parentQuality = myCare + (partner.quality || 0.4) * 0.6;
  S.inheritedBonus = parentQuality > 1.1 ? 2 : parentQuality > 0.75 ? 1 : 0;

  S.anim = 'marry';
  S.animTimer = Date.now() + 3000;
  spawnFx('heart', S.petX || 120, 80, 6);
  toast('Married ' + partner.name + '! ♥');
  beep(500, 0.1); beep(700, 0.1); beep(900, 0.15);

  setTimeout(() => {
    toast('Egg appearing...');
    beep(400, 0.1);
  }, 1800);

  setTimeout(() => {
    S.stage = 'baby';
    S.form = 'baby';
    S.age = 0;
    S.weight = 5;
    S.hunger = 2 + (S.inheritedBonus > 0 ? 1 : 0);
    S.happy = 2 + (S.inheritedBonus > 1 ? 1 : 0);
    S.disc = Math.min(40, Math.floor(S.disc / 2));
    S.careMiss = 0;
    S.discMiss = 0;
    S.sick = false;
    S.poop = false;
    S.call = false;
    S.sleep = false;
    S.lights = true;
    S.paused = false;
    S.lightsMissPending = false;
    S.sleepStart = 0;
    S._falseCall = false;
    S.born = Date.now();
    S.married = false;
    S.generation++;
    S.lastH = Date.now();
    S.lastY = Date.now();
    S.lastP = Date.now();
    S.lastAge = Date.now();
    S.lastVirtTick = Date.now();
    S.anim = 'evo';
    S.animTimer = Date.now() + 1800;
    const geneTxt = S.inheritedBonus >= 2 ? ' (excellent genes!)' : S.inheritedBonus === 1 ? ' (good genes)' : '';
    toast('Gen ' + S.generation + ' hatched!' + geneTxt);
    beep(620, 0.1); beep(820, 0.15);
    save();
    hide();
  }, 3200);
}

// ===== REAL TAMAGOTCHI A/B/C CONTROL =====
// A = move selection left / Left in game
// B = confirm selection / Right in game
// C = cancel

function updateIconHighlight() {
  document.querySelectorAll('.icon').forEach((el, i) => el.classList.toggle('on', i === S.sel));
}

function selectIcon(dir) {
  if (S.paused || S.game || S.battle || S.stage === 'egg' || S.stage === 'dead') return;
  // Changing mode with A closes open menus (status / connect / feed pick)
  // C remains Cancel for explicit close without changing icon
  if (S.menu === 'status' || S.menu === 'feed' || S.menu === 'playpick') {
    S.menu = null;
  }
  try { hide(); } catch(e) {}
  S.sel = (S.sel + dir + ICONS.length) % ICONS.length;
  updateIconHighlight();
  const name = ICON_LABELS[ICONS[S.sel]] || ICONS[S.sel];
  toast(name);
  beep(150, 0.02, 'square', 0.03);
}

function confirm() {
  if (S.paused) { toast('Paused — Hold B to resume'); return; }
  if (S.battle) {
    battleOrder('attack');
    return;
  }
  if (S.game && S.gameType === 'train') {
    trainPress('B');
    return;
  }
  if (S.game) {
    resolve(1); // B = Right for Look/Memory
    return;
  }
  if (S.menu === 'feed') {
    feed('meal');
    S.menu = null;
    return;
  }
  if (S.stage === 'dead') {
    restart();
    return;
  }
  if (S.stage === 'egg') return;

  const a = ICONS[S.sel];
  if (a === 'status') {
    S.menu = S.menu === 'status' ? null : 'status';
    toast(S.menu === 'status' ? 'Status' : 'Closed');
  } else if (a === 'feed') {
    if (S.sleep) { toast('Sleeping...'); return; }
    S.menu = 'feed';
    toast('A: Meal   B: Snack');
  } else if (a === 'play') {
    play();
  } else if (a === 'clean') {
    clean();
  } else if (a === 'med') {
    med();
  } else if (a === 'light') {
    light();
  } else if (a === 'connect') {
    if (S.sleep) { toast('Sleeping...'); return; }
    showConnectMenu();
  } else if (a === 'disc') {
    disc();
  }
  beep(250, 0.04);
}

function cancel() {
  if (S.battle) {
    cancelBattle();
    return;
  }
  if (S.game) {
    S.game = false;
    S.gameType = null;
    S.trainPhase = null;
    S.playResult = null;
    toast('Cancelled');
    beep(120, 0.03);
    return;
  }
  if (S.menu === 'feed' || S.menu === 'playpick') {
    S.menu = null;
    toast('Cancelled');
    return;
  }
  if (S.menu === 'status') {
    S.menu = null;
    toast('Closed');
    return;
  }
  hide();
  beep(120, 0.03);
}
