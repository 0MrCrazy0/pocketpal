<style>
  :root {
    --shell: #e85a71;
    --shell-dark: #c43c55;
    --lcd: #9bbc0f;
    --ink: #0f380f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 4px;
    overflow: hidden;
  }
  /* Banner stats moved onto LCD — keep panel out of the way */
  .info-panel { display: none; }

  .device {
    width: min(400px, 96vw);
    background: linear-gradient(165deg, #f2788c 0%, var(--shell) 45%, var(--shell-dark) 100%);
    border-radius: 24px;
    padding: 14px 14px 12px;
    box-shadow:
      0 0 0 3px #f9b4c0,
      0 0 0 6px #b83550,
      0 10px 24px rgba(0,0,0,0.45),
      inset 0 3px 10px rgba(255,255,255,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  /* Bell + sound on shell, top-right above LCD */
  .shell-controls {
    position: absolute;
    top: 4px;
    right: 10px;
    display: flex;
    gap: 3px;
    z-index: 30;
    pointer-events: auto;
  }
  .shell-controls .sound-btn {
    font-size: 13px;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.28);
    color: #fff;
    cursor: pointer;
    padding: 1px 5px;
    border-radius: 7px;
    line-height: 1.15;
  }
  .device::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 4px;
    background: #222;
    border-radius: 3px;
  }
  .lcd-bezel {
    width: 100%;
    background: #1a1a1a;
    border-radius: 10px;
    padding: 6px;
    margin-top: 28px; /* room for speaker + toast above LCD */
    box-shadow: inset 0 0 0 2px #333, inset 0 0 12px #000;
    position: relative;
    overflow: visible;
  }
  .lcd {
    width: 100%;
    aspect-ratio: 1.35 / 1;
    background: var(--lcd);
    border-radius: 5px;
    position: relative;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* Menu icons sit directly under the pet LCD */
  .icons {
    display: flex;
    width: 100%;
    gap: 3px;
    margin: 8px 0 6px;
    pointer-events: none; /* A/B/C only control */
    position: relative;
    z-index: 5;
  }
  .icon {
    flex: 1;
    height: 36px;
    background: #222;
    border: 2px solid #3a3a3a;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #888;
  }
  .icon.on {
    background: #333;
    border-color: #fff;
    color: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.3);
  }
  .icon.need {
    border-color: #9bbc0f;
    box-shadow: 0 0 8px rgba(155,188,15,0.55);
    animation: needPulse 1.1s ease-in-out infinite;
  }
  @keyframes needPulse {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .btns {
    display: flex;
    justify-content: center;
    gap: 24px;
  }
  .btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(145deg, #4a4a4a, #222);
    border: 3px solid #111;
    box-shadow: 0 4px 0 #0a0a0a, inset 0 2px 3px rgba(255,255,255,0.1);
    color: #ccc;
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn:active, .btn.pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #0a0a0a, inset 0 2px 5px rgba(0,0,0,0.4);
  }
  .btn.a { border-color: #4a9; }
  .btn.b { border-color: #49a; }
  .btn.c { border-color: #a54; }
  /* Menus stay inside the pet LCD only — A/B/C and icons stay visible */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 56, 15, 0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    z-index: 20;
    color: var(--lcd);
    text-align: center;
    padding: 8px 8px 10px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    overflow-y: auto;
    border-radius: 5px;
  }
  .overlay h2 { font-size: 14px; margin: 4px 0 8px; color: #c4d84a; }
  .overlay p { margin: 3px 0; line-height: 1.35; }
  .overlay button {
    margin-top: 8px;
    padding: 8px 16px;
    background: transparent;
    border: 2px solid var(--lcd);
    border-radius: 5px;
    color: var(--lcd);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    min-height: 36px;
  }
  .overlay input {
    margin-top: 6px;
    padding: 8px 10px;
    font-size: 13px;
    width: 85%;
    background: #0a2a0a;
    border: 1px solid var(--lcd);
    color: var(--lcd);
    text-align: center;
    border-radius: 5px;
  }
  .overlay .btn-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .overlay .friend-list {
    width: 100%;
    max-height: 120px;
    overflow-y: auto;
    margin: 6px 0;
    text-align: left;
  }
  .overlay .friend-item {
    padding: 5px 8px;
    margin: 3px 0;
    border: 1px solid #3a5a3a;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .overlay .friend-item.selected {
    border-color: var(--lcd);
    background: #0a2a0a;
  }
  /* LCD-green scrollbars — never the OS default chrome */
  .overlay,
  .overlay .friend-list,
  #overlay-extra {
    scrollbar-width: thin;
    scrollbar-color: #8bac0f #0a280a;
  }
  .overlay::-webkit-scrollbar,
  .overlay .friend-list::-webkit-scrollbar,
  #overlay-extra::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .overlay::-webkit-scrollbar-track,
  .overlay .friend-list::-webkit-scrollbar-track,
  #overlay-extra::-webkit-scrollbar-track {
    background: #0a280a;
  }
  .overlay::-webkit-scrollbar-thumb,
  .overlay .friend-list::-webkit-scrollbar-thumb,
  #overlay-extra::-webkit-scrollbar-thumb {
    background: #8bac0f;
    border-radius: 6px;
    border: 1px solid #0f380f;
  }
  .hidden { display: none !important; }
  /* Toast sits on the pink shell: centered under the speaker, flush above the LCD bezel */
  .toast {
    position: absolute;
    left: 50%;
    bottom: 100%;
    top: auto;
    transform: translateX(-50%);
    margin-bottom: 4px;
    background: rgba(15, 56, 15, 0.95);
    color: #9bbc0f;
    border: 1px solid #0f380f;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    z-index: 40;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    max-width: 78%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .toast.show { opacity: 1; }
</style>

<script>


/* ============================================================
   POCKETPAL — GAME RULES & MECHANICS (dev notes)
   ------------------------------------------------------------
   CARE (Tamagotchi-style)
   - Hunger 0-4: drains while awake; meal fills more than snack
   - Happy 0-4: drains while awake; play/snack/train/win/clean raise
     Unhappy stages: 4 joy · 3 content · 2 ok · 1 low · 0 miserable
   - Discipline 0-100%: UP on correct false-call scold; DOWN on mistakes / neglect / nights unused
   - Weight: +meal/snack, -play/train/battle; evo path + battle power
   - Care miss: empty meters, ignored lights, piled poop, long sick, wrong medicine
   - Poop: stacks up to 4 piles; pet avoids piles; full screen → unhappy/sick/death risk
   - Sick: neglect, max filth, battle injury; medicine or slow heal
   - Injury: battle loss flag → sick + needs medicine
   - Call: real need or false call (discipline only if false)

   CLOCK / SLEEP
   - Uses device local time
   - Night window = this pal's Status bedtime → wake (default 8pm–8am)
   - Lights are a player switch — never auto-flipped on during the day
   - Night + lights OFF → sleep, good rest. Night + lights left ON → yawn, then miss
   - Day + lights OFF → dark room (no miss). Baby/child may nap until lights on
   - Waking a night sleeper with lights ON = care miss. Ending a day nap is free
   - Morning wake → +1 age (once per calendar day) + evo checks
   - Pause (hold B) freezes care timers; Away (20 min idle) freezes like pause; hidden tab skips live care

   GROWTH
   - Stages: egg → baby → child → teen → adult (+ secret Elder)
   - 256 Pal species (8 ears × 8 tails × 4 patterns) on 12 body lines
   - Forms: Pip→Nib→Lumi/Grub→Momo/Kiko/Taro/Poko/Nori/Zuzu/Nova/Bibi/Rin/Bolt + unique morph #
   - growthPhase 0-3: body radius + kit buds fill out each ~1h awake (faster if well-cared)
   - kitLevel: baby micro→stubs→buds; child real ears/tail+arms; teen fuller; adult full (4)
   - Morning/age evo changes stage form; growthPhase resets on evo
   - Offline: growth + age applied; grow cinema / evo animation on return if phase/form changed
   - Discipline UP: correct false-call scold (+12)
   - Discipline DOWN: wrong scold (−8), scold-for-nothing (−5), ignored false-call (−6),
     wrong medicine (−3), woken at night (−4), neglect/filth (−1..4), unused overnight (−4),
     breed (halved)

   PLAY
   - Look: watch pupils lock left/right (body may fake-lean the other way)
   - Memory: watch sequence then repeat; grows longer
   - Train XP: timing GO → Battle XP

   BATTLE (Teen+)
   - Training: rotating roster of weak/mid/hard pals (never the same twice)
   - Friend: code snapshot opponent
   - Fresh foes ~3 HP; mid ~6; hard ~8. Mash B to charge; Guard recovers STA
   - Uncharged hits still tap for 1 if you have stamina (pets fight with autonomy)
   - Level = 1 + floor(XP/5) — shown on LCD + Status + battle

   LIFE
   - Death: long neglect only (no old-age death)
   - Restart after death → Gen+1; friends/XP preferences kept where saved
   ============================================================ */
// ============================================================
//  POCKETPAL v5.71 FINAL — closed-app care push projection fix · prior polish kept
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 240, H = 178;
// Intro/reveal name plates sit under the pet, clearly above mode strip (icons ~y 164–175)
// v5.21+: taller plate so both 7px glyph lines clear the ink frame; bottom ≤ ~148
const LCD_NAME_PLATE_Y = 114;
const LCD_NAME_PLATE_H = 28;
const HATCH_PLATE_MS = 5000;

const S = {
  stage: 'egg', form: 'egg',
  age: 0, weight: 5,
  hunger: 4, happy: 4, disc: 0,
  careMiss: 0, discMiss: 0,
  sick: false, sleep: false, lights: true,
  poop: false, poopX: 180,
  poopCount: 0, poopY: 145,
  call: false,
  lastFalseCall: 0,
  lastNaughtyDay: '',
  loadGraceUntil: 0,
  injured: false,
  shellTheme: 0,
  petId: '',
  morphId: null,
  petName: '',
  lastDiscTick: 0,
  _discPracticed: false,
  speciesSeen: {},
  growthPhase: 0,
  careStreak: 0,
  petFamily: [],
  petMemory: [],
  activeSlot: null,
  lastCareDay: '',
  lastGrowthAt: 0,
  sickSince: 0,
  _wakePoopAt: 0,
  born: null,
  lastH: Date.now(), lastY: Date.now(),
  lastP: Date.now(), lastAge: Date.now(), lastSave: Date.now(),
  game: false, gScore: 0, gRound: 0, gameDir: 0,
  gameType: 'look', // 'look' | 'memory'
  memSeq: [], memIdx: 0, memPhase: 'show', // show | input
  memTimer: 0,
  // Battle
  battle: false,
  battleWins: 0,
  battleLosses: 0,
  battleXP: 0,
  bat: null, // active battle state object
  battleLocked: false,
  menu: null, sel: 0,
  sound: true,
  notifications: false,
  lastNotifyAt: 0,
  lastNotifyType: '',
  musicStep: 0,
  musicTimer: 0,
  musicPlaying: false,
  difficulty: 'realtime',  // classic hardware speed is the default
  generation: 1,
  deaths: 0, frame: 0,
  myCode: null,
  friends: [],
  // v5.22 account economy (persist like friends)
  coins: 0,
  invChip: 0,
  invTonic: 0,
  invRevive: 0,
  coinsPlayDay: '',
  coinsPlayEarned: 0,
  _coinToastPend: 0,
  selectedFriend: 0,
  married: false,
  anim: null,
  animTimer: 0,
  inheritedBonus: 0,
  petX: 120,
  petTargetX: 120,
  lastBeep: 0,
  playResult: null, // 'happy' | 'sad' | null for play feedback face
  // v2.17 sleep + pause + finished-game fx
  paused: false,
  pauseStarted: 0,
  // v5.11 Away Safeguard (runtime; cleared on load)
  _away: false,
  _awayStarted: 0,
  _lastInputAt: Date.now(),
  _critWarned: false,
  _critGraceUntil: 0,
  sleepStart: 0,
  lightsMissPending: false,
  lastSleepCheck: Date.now(),
  virtualHour: new Date().getHours(),
  virtualMin: new Date().getMinutes(),
  lastVirtTick: Date.now(),
  lastAgeDay: '',   // YYYY-MM-DD of last morning age-up
  sleptProperly: false, // lights were off during night sleep
  bedHour: 20,
  wakeHour: 8,
  goodNights: 0,
  shortNights: 0,
  fx: [],           // floating hearts / bubbles {type,x,y,life,vy}
  hatchPhase: 0,    // 0 idle egg, 1 shaking, 2 cracking, 3 done (pop/name)
  deathPhase: 0,    // 0 rising, 1 spirit
  tiltTimer: 0,
  // v5.09 Origin Pass — first bond egg
  eggId: null,      // 0–5 DOT/BAND/AURA/WAVE/CROSS/STAR — persisted look + bias
  eggChoice: null,  // alias of eggId (save-compat)
  eggSelect: true,  // LCD pick 6 eggs before timer starts
  eggPick: 0,       // cursor during egg select (0..5)
  eggReadyAt: null, // set on confirm (~5 min)
  _hatchCut: null,  // post-hatch name/species plate
  _eggBiasTrait: null, // seed temperament from egg (CALM/BRAVE/BRATTY/CHEERY/SHY/CLEVER)
  // v5.08 Life Pass — runtime cinema only (cleared on load / pose reset)
  _care: null,
  _evoCut: null,
  _growCut: null,
  // v5.10 Arena Pass — runtime battle/train theatre (not saved)
  _postArena: null,
  _trainWork: null,   // pushup | spar | hop during wait
  _trainReact: null,  // pumped | stumble after cue
  _trainReactUntil: 0,
  _chargeShake: 0
};

// ============================================================
//  v5.19 — Account globals vs per-pet defaults
//  New life / restart MUST NOT inherit prior pal schedule or
//  growth/injury/cinema fields. Parked cards keep their own.
// ============================================================
const ACCOUNT_KEEP_KEYS = [
  'friends', 'petFamily', 'petMemory', 'speciesSeen', 'deaths',
  'sound', 'notifications', 'difficulty', 'shellTheme', 'myCode',
  'careStreak', 'lastCareDay',
  'coins', 'invChip', 'invTonic', 'invRevive', 'coinsPlayDay', 'coinsPlayEarned'
];

function captureAccountGlobals() {
  return {
    friends: S.friends,
    petFamily: S.petFamily,
    petMemory: S.petMemory,
    speciesSeen: S.speciesSeen,
    deaths: S.deaths,
    sound: S.sound,
    notifications: S.notifications,
    difficulty: S.difficulty,
    shellTheme: S.shellTheme,
    myCode: S.myCode,
    careStreak: S.careStreak,
    lastCareDay: S.lastCareDay,
    coins: S.coins | 0,
    invChip: S.invChip | 0,
    invTonic: S.invTonic | 0,
    invRevive: S.invRevive | 0,
    coinsPlayDay: S.coinsPlayDay || '',
    coinsPlayEarned: S.coinsPlayEarned | 0,
    activeSlot: S.activeSlot
  };
}

function restoreAccountGlobals(keep, opts) {
  opts = opts || {};
  S.friends = keep.friends;
  S.petFamily = keep.petFamily;
  S.petMemory = keep.petMemory;
  S.speciesSeen = keep.speciesSeen;
  S.deaths = keep.deaths;
  S.sound = keep.sound;
  S.notifications = keep.notifications;
  S.difficulty = keep.difficulty;
  S.shellTheme = keep.shellTheme;
  S.myCode = keep.myCode;
  S.careStreak = keep.careStreak;
  S.lastCareDay = keep.lastCareDay;
  S.coins = keep.coins | 0;
  S.invChip = keep.invChip | 0;
  S.invTonic = keep.invTonic | 0;
  S.invRevive = keep.invRevive | 0;
  S.coinsPlayDay = keep.coinsPlayDay || '';
  S.coinsPlayEarned = keep.coinsPlayEarned | 0;
  if (opts.keepActiveSlot) S.activeSlot = keep.activeSlot;
}

function wipeNonAccountKeys() {
  const keep = new Set(ACCOUNT_KEEP_KEYS);
  Object.keys(S).forEach(k => {
    if (!keep.has(k)) delete S[k];
  });
}

/** Fresh per-pet defaults for a new egg life (timestamps = now). */
function petDefaults(now) {
  now = now || Date.now();
  const d = new Date(now);
  return {
    stage: 'egg', form: 'egg',
    age: 0, weight: 5,
    hunger: 4, happy: 4, disc: 0,
    careMiss: 0, discMiss: 0,
    sick: false, sleep: false, lights: true,
    poop: false, poopX: 180, poopY: 145, poopCount: 0, poopSpots: [],
    call: false,
    lastFalseCall: 0,
    lastNaughtyDay: '',
    loadGraceUntil: 0,
    injured: false,
    petId: '',
    morphId: null,
    petName: '',
    lastDiscTick: 0,
    _discPracticed: false,
    growthPhase: 0,
    lastGrowthAt: 0,
    sickSince: 0,
    _wakePoopAt: 0,
    born: now,
    lastH: now, lastY: now, lastP: now, lastAge: now, lastSave: now,
    game: false, gScore: 0, gRound: 0, gameDir: 0,
    gameType: 'look',
    memSeq: [], memIdx: 0, memPhase: 'show', memTimer: 0,
    battle: false, battleWins: 0, battleLosses: 0, battleXP: 0,
    bat: null, battleLocked: false,
    menu: null, sel: 0,
    lastNotifyAt: 0, lastNotifyType: '',
    musicStep: 0, musicTimer: 0, musicPlaying: false,
    generation: 1,
    frame: 0,
    selectedFriend: 0,
    married: false,
    anim: null, animTimer: 0,
    inheritedBonus: 0,
    petX: 120, petTargetX: 120,
    lastBeep: 0,
    playResult: null,

  }

  // Low energy slump when hearts low

  }

  // Occasional head tilt when idle and content

  } else if (S.game && S.gameType === 'memory') {

  } else if (S.game && S.gameType === 'train') {

      px(-4, metB.crown - 1, INK); px(4, metB.crown - 1, INK);
      px(-4, metB.crown - 2, INK); px(4, metB.crown - 2, INK);
    } else if (form === 'secret' && kv >= 3) {
      fillRect(-4, metB.headCy + 4, 8, 4, INK);
      fillRect(-4, metB.crown - 1, 8, 2, INK);
    }
    if (form === 'teenBad' || form === 'adult5' || form === 'adult6') {
      fillRect(-metB.r + 1, metB.cy, metB.r * 2 - 2, metB.r - 1, INK);
    }
    if (kv >= 1) {
      const fy = metB.cy + metB.r - 1;
      const step = (((f || 0) >> 3) & 1);
      fillRect(-6, fy + step, 5, 4, INK);
      fillRect(2, fy + (1 - step), 5, 4, INK);
    }
    if (kv >= 2) {
      const ay = metB.mouthY + 1;
      const wave = (S._idleBit === 'wave' && (f % 10 < 5)) ? -3 : 0;
      fillRect(-metB.r + 1, ay, 2, 2, INK);
      fillRect(-metB.r - 3, ay + wave, 4, 2, INK);
      fillRect(metB.r - 2, ay, 2, 2, INK);
      fillRect(metB.r - 1, ay + (wave ? 0 : 1), 4, 2, INK);
    }

    drawMorphTail(form, mid, g, INK, f);
    drawMorphHead(form, mid, g, INK, BG, f);
    drawPetArms(form, g, f, INK);

    // Face — v5.20 body-aware sockets/pupils/mouth (fit inside met.r)
    if (form !== 'dead') {
      const metF = formMetrics(form, g);
      const eyeKind = morphParts(mid).eyes;
      const lay = faceSocketLayout(metF, eyeKind);
      const sockW = lay.sockW, sockH = lay.sockH;
      const eyeL = lay.eyeL, eyeR = lay.eyeR;
      const ey = lay.ey;
      function paintSocket(x, y) {
        if (eyeKind === 1) {
          fillCirc(x + Math.floor(sockW / 2), y + Math.floor(sockH / 2), Math.max(2, Math.floor(sockW / 2)), BG);
        } else {
          fillRect(x, y, sockW, sockH, BG);
        }
      }
      if (eyesClosed || idleBit === 'wink') {
        fillRect(eyeL, ey + Math.max(1, Math.floor(sockH / 2)), sockW, Math.min(2, sockH), BG);
        if (idleBit === 'wink') {
          paintSocket(eyeR, ey);
          const wb = sockW >= 6 ? 2 : 1;
          fillRect(eyeR + wb, ey + Math.max(0, Math.floor((sockH - 2) / 2)), 2, 2, INK);
        } else {
          fillRect(eyeR, ey + Math.max(1, Math.floor(sockH / 2)), sockW, Math.min(2, sockH), BG);
        }
      } else if (!blink) {
        paintSocket(eyeL, ey);
        paintSocket(eyeR, ey);

        let lookX = 0, lookY = 0;
        const glanceSeed = ((form || '').length * 5 + (S._morphDraw || 0) * 3) | 0;
        const lookCycle = Math.floor((f + glanceSeed) / 16) % 16;

        if (S._battleFace === 'hurt' || S._battleFace === 'sulk') {
          lookX = 0; lookY = 1;
        } else if (S._battleFace === 'charge' || S._battleFace === 'dash') {
          lookX = S._rivalDraw ? -2 : 2; lookY = 0;
        } else if (S._battleFace === 'happy' || S._battleFace === 'dance') {
          lookX = 0; lookY = -1;
        } else if (S._battleFace === 'guard') {
          lookX = 0; lookY = 1;
        } else if (S._battleFace === 'windup') {
          lookX = S._rivalDraw ? -1 : 1; lookY = 1;
        } else if (S._battleFace === 'sad') {
          lookX = 0; lookY = 1;
        } else if (S.game && S.gameType === 'train') {
          lookX = 0; lookY = S.trainPhase === 'go' ? -1 : 0;
        } else if (S.game && S.gameType === 'look') {
          const settled = !S._lookSettleAt || Date.now() >= S._lookSettleAt;
          if (!settled) {
            const t = Math.floor(f / 7) % 6;
            if (t === 0) lookX = -2;
            else if (t === 1) lookX = 2;
            else if (t === 2) { lookX = 0; lookY = -1; }
            else if (t === 3) lookX = -2;
            else if (t === 4) lookX = 1;
            else { lookX = 0; lookY = 1; }
          } else {
            lookX = (S.gameDir === 0) ? -2 : 2;
            lookY = 0;
          }
        } else if (S.game && S.gameType === 'memory' && S.memPhase === 'show') {
          lookX = (S.gameDir === 0) ? -2 : 2;
        } else if (S.game || S.battle) {
          if (lookCycle <= 2) lookX = -2;
          else if (lookCycle <= 4) lookX = -1;
          else if (lookCycle <= 6) lookX = 0;
          else if (lookCycle <= 8) lookX = 2;
          else if (lookCycle <= 10) lookX = 1;
          else if (lookCycle === 11) { lookX = 0; lookY = -1; }
          else if (lookCycle === 12) { lookX = -1; lookY = 1; }
          else if (lookCycle === 13) lookX = 2;
          else lookX = 0;
        } else if (S.anim === 'care' && S._care && S._care.itemX != null) {
          const c = S._care;
          const ph = carePhase(c);
          if (ph === 'show' || ph === 'approach' || ph === 'act') {
            lookX = (c.itemX > (S.petX || 120)) ? 2 : -2;
            lookY = 1;
          } else {
            lookX = 0; lookY = -1;
          }
        } else if (careWant()) {
          const w = careWant();
          const phase = Math.floor(f / 36) % 8;
          if (phase <= 1) { lookX = 0; lookY = -1; } // player first
          else if (phase <= 5) {
            lookX = (w.x > (S.petX || 120)) ? 2 : -2;
            lookY = (w.kind === 'you' || w.kind === 'bed') ? -1 : 1;
          } else { lookX = 0; lookY = -1; } // back to player
        } else if (idleBit === 'peek') {
          // SHY peek: look away, then quick glance at player
          const left = Math.max(0, (S._idleUntil || f) - f);
          if (left > 18) { lookX = -2; lookY = 1; }
          else if (left > 8) { lookX = 0; lookY = 0; }
          else { lookX = 0; lookY = -1; }
        } else if (idleBit === 'look') {
          // Look-at-player flourish
          if (lookCycle <= 4) { lookX = 0; lookY = -1; }
          else if (lookCycle <= 8) lookX = (lookCycle % 2 === 0) ? -1 : 1;
          else if (lookCycle <= 12) { lookX = 0; lookY = -1; }
          else lookX = 0;
        } else {
          // CLEVER: more frames looking at player; others keep wide glance
          const clever = personalityOf(S) === 'CLEVER';
          if (clever) {
            if (lookCycle <= 5) { lookX = 0; lookY = -1; }
            else if (lookCycle <= 8) lookX = -1;
            else if (lookCycle <= 11) lookX = 1;
            else { lookX = 0; lookY = -1; }
          } else if (lookCycle <= 3) lookX = -2;
          else if (lookCycle <= 5) lookX = 0;
          else if (lookCycle <= 9) lookX = 2;
          else if (lookCycle === 10) lookY = -1;
          else if (lookCycle === 11) { lookX = 1; lookY = 1; }
          else lookX = 0;
        }

        // Clamp 2x2 pupil fully inside socket (scale glance on tiny eyes)
        const pupBase = sockW >= 6 ? 2 : 1;
        const maxLX = Math.max(0, sockW - 2 - pupBase);
        const minLX = -pupBase;
        let lx = lookX;
        if (lx < minLX) lx = minLX;
        if (lx > maxLX) lx = maxLX;
        // Preserve L/R lock on tiny sockets when glance saturates both ways
        if (maxLX >= 1 && lookX <= -2) lx = minLX;
        if (maxLX >= 1 && lookX >= 2) lx = maxLX;
        const maxLY = Math.max(0, sockH - 2);
        let ly = lookY + (sockH >= 5 ? 1 : 0);
        if (ly < 0) ly = 0;
        if (ly > maxLY) ly = maxLY;
        fillRect(eyeL + pupBase + lx, ey + ly, 2, 2, INK);
        fillRect(eyeR + pupBase + lx, ey + ly, 2, 2, INK);
      }

      // Mouth below eyes with a clear gap; stay on body
      let my = metF.mouthY;
      const minMouth = ey + sockH + 2;
      if (my < minMouth) my = minMouth;
      // Soft baby tweak: don't sit on the rim
      if (metF.r <= 10 && my > metF.cy + Math.floor(metF.r * 0.45)) {
        my = metF.cy + Math.max(3, Math.floor(metF.r * 0.35));
        if (my < minMouth) my = minMouth;
      }
      if (!onPetBody(0, my, metF) && onPetBody(0, my - 1, metF)) my -= 1;
      let mouth = 'smile';
      if (S.anim === 'yawn') mouth = 'yawn';
      else if (S.anim === 'eat' || (S.anim === 'care' && S._care && (S._care.kind === 'meal' || S._care.kind === 'snack') && carePhase(S._care) === 'act')) mouth = 'eat';
      else if (eyesClosed && S.sleep) mouth = 'rest';
      else if (faceSick || (S.anim === 'care' && S._care && S._care.result === 'sick' && carePhase(S._care) === 'result')) mouth = 'sick';
      else if (faceHungry || idleBit === 'lean') mouth = 'plead';
      else if (sadMouth || faceDirty || S.anim === 'sulk' || idleBit === 'mad') mouth = 'frown';
      else if (idleBit === 'tongue') mouth = 'tongue';
      else if (happyMouth || (S.anim === 'care' && S._care && (S._care.result === 'yum' || S._care.result === 'joy' || S._care.result === 'better' || S._care.result === 'cleanHappy') && carePhase(S._care) === 'result')) mouth = 'smile';
      drawPetMouth(mouth, my, f, BG);
    }
  }

  // Action props — richer classic-style feedback
  if (S.anim === 'eat' || (S.anim === 'care' && S._care && (S._care.kind === 'meal' || S._care.kind === 'snack') && carePhase(S._care) === 'act')) {
    // Chew crumbs beside mouth (body-scaled — not floating off tiny faces)
    const ch = Math.floor(f / 6) % 4;
    let cg = 0;
    if (form !== 'egg' && form !== 'dead') {
      if (S._rivalDraw && S.bat) cg = Math.min(3, S.bat.enemyGrowth || 0);
      else cg = Math.min(3, S.growthPhase || 0);
    }
    const cm = formMetrics(form, cg);
    const cx0 = Math.min(cm.r - 2, Math.max(3, Math.floor(cm.r * 0.55)));
    const cy0 = cm.mouthY;
    if (ch === 0) { px(cx0, cy0, INK); px(cx0 + 1, cy0, INK); }
    if (ch === 1) { px(cx0 + 1, cy0 - 1, INK); px(cx0 + 2, cy0, INK); px(cx0 + 2, cy0 + 1, INK); }
    if (ch === 2) { px(cx0 - 1, cy0 + 1, INK); px(cx0, cy0 + 1, INK); }
    if (ch === 3) { px(cx0, cy0, INK); px(cx0 + 2, cy0 + 1, INK); }
  }
  if (S.anim === 'care' && S._care && S._care.kind === 'med' && carePhase(S._care) === 'act') {
    // Tiny shiver sparkles
    if (f % 6 < 3) { px(16, -10, INK); px(-16, -8, INK); }
  }
  if (S.sick || S.anim === 'sick') {
    // Small skull / cross mark
    fillCirc(20, -14, 3, INK);
    px(20, -14, BG);
    px(18, -11, INK); px(22, -11, INK);
  }
  // Wave is drawn as a raised right arm in drawPetArms — no extra floating pixels
  // Call ! beside head (not a long streak)
  if (S.anim === 'call' || (S.call && !S.sleep && !S.anim)) {
    px(15, -16, INK); px(15, -14, INK); px(15, -12, INK);
    px(15, -9, INK);
  }
  // Zzz only when actually sleeping or yawning — never during poop
  if ((S.sleep || S.anim === 'yawn') && S.anim !== 'poop') {
    const z = Math.floor((f % 48) / 16);
    for (let k = 0; k <= z; k++) {
      const zx = 12 + k * 5;
      const zy = -14 - k * 5;
      px(zx, zy, INK); px(zx+1, zy, INK); px(zx+2, zy, INK); px(zx+3, zy, INK);
      px(zx+3, zy+1, INK);
      px(zx+2, zy+2, INK);
      px(zx+1, zy+3, INK);
      px(zx, zy+4, INK); px(zx+1, zy+4, INK); px(zx+2, zy+4, INK); px(zx+3, zy+4, INK);
    }
  }

  } finally {
    ctx.restore();
  }

  // Poop piles only on main home — fill the floor as stacks grow (classic)
  if (S.poop && !S.game && !S.battle && form !== 'egg' && form !== 'dead' && S.anim !== 'poop') {
    const BG2 = '#9bbc0f';
    const py0 = S.poopY || 145;
    const spots = (S.poopSpots && S.poopSpots.length) ? S.poopSpots : [S.poopX || 180];
    const n = Math.max(spots.length, Math.min(4, S.poopCount || 1));
    for (let s = 0; s < n; s++) {
      const ox = spots[s] !== undefined ? spots[s] : (50 + s * 45);
      fillCirc(ox, py0 + 1, 5, INK);
      fillCirc(ox - 4, py0 + 2, 3, INK);
      fillCirc(ox + 4, py0 + 2, 3, INK);
      fillCirc(ox - 1, py0 - 3, 4, INK);
      fillCirc(ox, py0 - 7, 3, INK);
      px(ox - 2, py0 - 4, BG2);
      px(ox + 1, py0 - 8, BG2);
    }
  }
}

function drawModeStrip() {
  // Small selected-mode icon strip at bottom of LCD (classic feel)
  // Selection = filled invert; care-need = blinking outline/underline only
  const INK = '#0f380f';
  const LCD = '#9bbc0f';
  const labels = ['ST','FD','PL','CL','MD','LT','CN','DS'];
  const x0 = 8;
  const y = H - 12;
  for (let i = 0; i < labels.length; i++) {
    const x = x0 + i * 29;
    const need = (typeof careNeedKind === 'function') ? careNeedKind() : null;
    const map = { hunger:1, happy:2, poop:3, sick:4, lights:5 };
    const needIdx = need ? map[need] : -1;
    if (i === S.sel) {
      fillRect(x - 2, y - 2, 26, 11, INK);
      drawText(labels[i], x + 2, y, LCD);
    } else if (i === needIdx && (S.frame % 40 < 22)) {
      fillRect(x - 2, y - 2, 26, 1, INK);
      fillRect(x - 2, y + 8, 26, 1, INK);
      fillRect(x - 2, y - 2, 1, 11, INK);
      fillRect(x + 23, y - 2, 1, 11, INK);
      drawText(labels[i], x + 2, y, INK);
    } else {
      drawText(labels[i], x + 2, y, INK);
    }
  }
}

function drawMain() {
  const night = isNightTime();
  const lcdBg = night ? '#8fad0e' : '#9bbc0f';
  ctx.fillStyle = lcdBg;
  ctx.fillRect(0, 0, W, H);

  const INK = '#0f380f';

  // --- TOP LEFT: Hunger + Happy ---
  drawText('HUNGER', 4, 3, INK);
  drawHeartsRow(48, 2, S.hunger);
  drawText('HAPPY', 4, 14, INK);
  drawHeartsRow(48, 13, S.happy);

  // Under Happy: evolution stage + name + mood
  const stageLabel = (S.stage || '').toUpperCase();
  const nm = displayName(S).toUpperCase().slice(0, 6);
  drawText(stageLabel + ' ' + nm, 4, 26, INK);
  // One-line mood
  let mood = 'OK';
  if (S.stage === 'dead') mood = 'GONE';
  else if (S.sleep) mood = 'ASLEEP';
  else if (S.injured && S.sick) mood = 'INJURED';
  else if (S.sick) mood = 'SICK';
  else if ((S.poopCount || 0) >= 4) mood = 'TRAPPED';
  else if ((S.poopCount || 0) >= 2 || S.poop) mood = 'DIRTY';
  else if (S.hunger <= 0) mood = 'STARVING';
  else if (S.hunger <= 1) mood = 'HUNGRY';
  else if (S.happy <= 0) mood = 'MISERY';
  else if (S.happy <= 1) mood = 'SAD';
  else if (S.happy >= 4 && S.hunger >= 3) mood = 'JOY';
  else if (S.happy >= 3 && S.hunger >= 2) mood = 'HAPPY';
  else if (S.call) mood = 'CALLING';
  drawText(mood, 4, 37, INK);

  // --- TOP MIDDLE: weight / discipline / age / battle XP ---
  drawText('WT ' + (S.weight || 0) + 'G', 100, 3, INK);
  drawText('DISC ' + (S.disc || 0) + '%', 100, 14, INK);
  drawText('AGE ' + S.age, 100, 26, INK);
  drawText('LV ' + battleLevel(S.battleXP) + '  PWR ' + battlePower(), 100, 37, INK);

  // --- TOP RIGHT: Gen above Friends, then clock, sun/moon ---
  let h12 = S.virtualHour % 12;
  if (h12 === 0) h12 = 12;
  const ampm = S.virtualHour < 12 ? 'AM' : 'PM';
  const clock = h12 + ':' + S.virtualMin.toString().padStart(2,'0') + ampm;
  const genStr = 'GEN ' + (S.generation || 1);
  const frStr = 'FR ' + ((S.friends && S.friends.length) || 0);
  const CW = 6; // must match drawText advance
  const rightPad = 4;
  drawText(genStr, W - rightPad - genStr.length * CW, 3, INK);
  drawText(frStr, W - rightPad - frStr.length * CW, 14, INK);
  drawText(clock, W - rightPad - clock.length * CW, 25, INK);
  // Sun / Moon under clock
  const sunX = W - 14;
  if (night) {
    fillCirc(sunX, 42, 5, INK);
    fillCirc(sunX + 3, 40, 4, lcdBg);
  } else {
    fillCirc(sunX, 42, 3, INK);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      px(sunX + Math.round(Math.cos(a) * 6), 42 + Math.round(Math.sin(a) * 6), INK);
    }
  }

  // Attention badge — unique 1-bit sprite per need (not the same box)
  const need = careNeedKind();
  if (need && !S.sleep) drawNeedBadge(need, 4, 120);



  // v5.09 egg select owns the LCD until a choice is locked
  if (S.stage === 'egg' && S.eggSelect) {
    drawEggSelectUI(S.frame);
    return;
  }

  // Evo cutscene can own the middle of the LCD briefly
  if (!(S.anim === 'evo' && S._evoCut && drawEvoCutscene(S.frame))) {
    drawPet(S.petX || 120, 100, S.form, S.frame);
  }
  drawCareProps(S.frame);
  drawGrowCutscene(S.frame);
  if (S.stage === 'egg' && S.anim === 'hatch') drawHatchShellBits();
  if (S.anim === 'hatch' || S._hatchCut) drawHatchNamePlate(S.frame);
  drawFx();
  drawPostArenaPlate(S.frame);

  if (S.stage === 'egg') {
    if (!S.eggSelect) {
      if (!S.eggReadyAt) S.eggReadyAt = Date.now() + 5 * 60000;
      const left = Math.max(0, S.eggReadyAt - Date.now());
      const done = Math.max(0, Math.min(1, 1 - left / (5 * 60000)));
      fillRect(50, 138, 140, 6, INK);
      fillRect(52, 140, Math.max(2, Math.floor(136 * done)), 2, lcdBg);
    }
  }

  drawModeStrip();

  if (S.paused) {
    fillRect(72, 72, 96, 24, INK);
    drawText('PAUSED', 102, 80, lcdBg);
  } else if (S._away) {
    fillRect(72, 72, 96, 24, INK);
    drawText('AWAY', 108, 80, lcdBg);
  }
}

function nextEvoHint() {
  if (S.stage === 'egg') return 'HATCH ~5 MIN';
  if (S.stage === 'baby') return S.age >= 2 ? 'READY CHILD' : ('CHILD AT AGE 2 NOW ' + S.age);
  if (S.stage === 'child') return S.age >= 5 ? 'READY TEEN' : ('TEEN AT AGE 5 NOW ' + S.age);
  if (S.stage === 'teen') return S.age >= 15 ? 'READY ADULT' : ('ADULT AT AGE 15 NOW ' + S.age);
  if (S.stage === 'adult') {
    if ((S.form === 'adult1' || S.form === 'adult3' || S.form === 'adult7' || S.form === 'adult10') && S.disc >= 75 && S.age >= 20) return 'SECRET READY';
    return 'FULL FORM';
  }
  if (S.stage === 'dead') return '---';
  return '';
}
function drawStatus() {
  ctx.fillStyle = '#9bbc0f';
  ctx.fillRect(0, 0, W, H);
  const timeStr = (() => { let h=S.virtualHour%12; if(h===0)h=12; return h+':'+S.virtualMin.toString().padStart(2,'0')+(S.virtualHour<12?'AM':'PM'); })();
  let state = 'AWAKE';
  if (S.paused) state = 'PAUSED';
  else if (S._away) state = 'AWAY';
  else if (S.stage === 'dead') state = 'RETURNED';
  else if (S.sleep) state = 'SLEEPING';
  else if (isNightTime()) state = 'NIGHT';
  const flags = [
    S.sick ? 'SICK' : null,
    S.poop ? 'DIRTY' : null,
    S.call ? 'CALLING' : null,
    S.married ? 'PARENT' : null,
    S.battle ? 'BATTLE' : null
  ].filter(Boolean).join(' ');
  const hun = Math.max(0, Math.min(4, S.hunger | 0));
  const hap = Math.max(0, Math.min(4, S.happy | 0));
  const nm = displayName(S);
  const tag = (S.stage !== 'egg' && S.stage !== 'dead') ? (' ' + speciesTag(ensureMorph(S))) : '';
  const formNm = (NAMES[S.form] || '').toUpperCase();
  const temp = personalityOf(S) || 'MELLOW';
  // v5.17: clear labels — no formTrait (Curious) beside TEMP (BRATTY)
  const lines = [
    nm + tag,
    (S.stage || '').toUpperCase() + (formNm ? (' ' + formNm) : '') + ' GEN' + (S.generation || 1),
    'AGE ' + S.age + '  WT ' + S.weight + 'G  LV ' + battleLevel(S.battleXP),
    'TEMP ' + temp,
    'HUN ' + hun + '/4  HAP ' + hap + '/4  DISC ' + (S.disc || 0) + '%',
    'PALS ' + speciesSeenCount() + '/' + SPECIES_COUNT + '  FAMILY ' + ((S.petFamily && S.petFamily.length) || 0),
    'STREAK ' + (S.careStreak || 0) + 'D  COINS ' + (S.coins | 0),
    'BATTLE ' + (S.battleWins || 0) + 'W-' + (S.battleLosses || 0) + 'L  CHIP' + (S.invChip|0) + ' TON' + (S.invTonic|0) + ' REV' + (S.invRevive|0),
    'NEXT ' + nextEvoHint(),
    'FRIENDS ' + ((S.friends && S.friends.length) || 0) + '  SHARE VIA CONNECT',
    'TIME ' + timeStr + '  ' + state,
    'BED ' + formatHour(getBedWake().bed) + '  WAKE ' + formatHour(getBedWake().wake) + '  ' + nightHours() + 'H ' + restQuality(),
    ('ALERTS ' + (S.notifications ? 'ON' : 'OFF') + '  LT ' + (S.lights ? 'ON' : 'OFF') + (flags ? ('  ' + flags) : '')),
    'A BED   B WAKE   C BACK'
  ];
  // v5.22: 14 lines × 12px fits 178 LCD
  lines.forEach((l, i) => drawText(String(l).slice(0, 38), 4, 2 + i * 12, '#0f380f'));
}

function drawGame() {
  ctx.fillStyle = '#9bbc0f';
  ctx.fillRect(0, 0, W, H);
  const INK = '#0f380f';

  // ========== TRAIN XP (timing skill — Digimon training vibe) ==========
  // v5.10 Arena: workout staging between GO cues
  if (S.gameType === 'train') {
    drawTextCentered('TRAIN XP', 4, INK);
    drawTextCentered('WAIT THEN TAP', 16, INK);
    drawTextCentered(S.gScore + ' HIT  R' + S.gRound + '/3', 28, INK);
    // Floor marks
    for (let x = 60; x < 180; x += 4) px(x, 130, INK);
    drawPet(120, 100, S.form, S.frame);
    const reactOn = S._trainReact && Date.now() < (S._trainReactUntil || 0);
    if (S.trainPhase === 'go') {
      if (S.trainBtn !== 'A' && S.trainBtn !== 'B') S.trainBtn = 'B';
      const letter = S.trainBtn;
      drawTextCentered('*** GO ***', 44, INK);
      drawTextCentered('PRESS ' + letter, 56, INK);
      drawTextCentered('A OR B', 150, INK);
      if (S.frame % 6 === 0) spawnFx('spark', 120, 70, 1);
    } else if (reactOn) {
      if (S._trainReact === 'pumped') {
        drawTextCentered('PUMPED!', 44, INK);
        drawTextCentered('NICE HIT', 150, INK);
      } else {
        drawTextCentered('STUMBLE...', 44, INK);
        drawTextCentered('SHAKE IT OFF', 150, INK);
      }
    } else {
      const work = S._trainWork || 'hop';
      const label = work === 'pushup' ? 'PUSH-UPS!' : (work === 'spar' ? 'SPAR DRILL!' : 'HOP DRILLS!');
      drawTextCentered(label, 44, INK);
      drawTextCentered('WAIT FOR GO', 150, INK);
      // Coach beep ticks (visual metronome dots)
      const tick = Math.floor(S.frame / 10) % 4;
      for (let i = 0; i < 4; i++) fillRect(100 + i * 10, 58, 6, 4, i <= tick ? INK : '#8fad0e');
    }
    drawTextCentered('C CANCEL', 166, INK);
    drawFx();
    return;
  }

  // ========== MEMORY (Simon sequence — NOT the same as Look) ==========
  if (S.gameType === 'memory') {
    drawTextCentered('MEMORY', 4, INK);
    drawTextCentered('REPEAT THE ORDER', 16, INK);
    drawTextCentered('LEN ' + (S.memSeq ? S.memSeq.length : 0) + '  OK ' + S.gScore, 28, INK);
    if (S.memPhase === 'show') {
      const dir = S.memSeq[S.memIdx];
      S.gameDir = dir;
      // Big side flash only (sequence teach) — pet stays centered
      drawTextCentered('WATCH', 42, INK);
      drawTextCentered((S.memIdx + 1) + ' / ' + S.memSeq.length, 54, INK);
      if (dir === 0) {
        drawText('<<<', 16, 90, INK);
        drawText('LEFT', 16, 102, INK);
      } else {
        drawText('>>>', 190, 90, INK);
        drawText('RIGHT', 180, 102, INK);
      }
      drawPet(120, 115, S.form, S.frame);
    } else {
      // Input: no spoilers, centered pet, player must remember
      drawTextCentered('YOUR TURN', 42, INK);
      drawTextCentered('STEP ' + (S.memIdx + 1) + '/' + S.memSeq.length, 54, INK);
      drawPet(120, 110, S.form, S.frame);
      drawTextCentered('A LEFT   B RIGHT', 152, INK);
    }
    drawTextCentered('C CANCEL', 166, INK);
    return;
  }

  // ========== LOOK (classic Tamagotchi — guess facing, one shot per round) ==========
  // Completely different: no sequence, no GO timing — just read the pet once
  drawTextCentered('LOOK', 4, INK);
  drawTextCentered('WHICH WAY?', 16, INK);
  drawTextCentered('R' + S.gRound + '/5  SCORE ' + S.gScore, 28, INK);
  drawPet(120, 100, S.form, S.frame);
  if (S._lookSettleAt && Date.now() < S._lookSettleAt) {
    drawTextCentered('WATCH...', 48, INK);
  } else {
    drawTextCentered('A LEFT  OR  B RIGHT', 48, INK);
  }
  drawTextCentered('C CANCEL', 166, INK);
}

function render() {
  if (!S.paused) S.frame++;
  if (S.stage === 'dead') {
    ctx.fillStyle = '#9bbc0f';
    ctx.fillRect(0, 0, W, H);
    if (S.anim === 'death') {
      // rising body before spirit form
      drawPet(120, 85, S.form === 'dead' ? 'adult1' : S.form, S.frame);
      drawText('FAREWELL...', 80, 160, '#0f380f');
    } else {
      drawPet(120, 85, 'dead', S.frame);
      drawText('RETURNED HOME', 70, 150, '#0f380f');
    }
    drawFx();
  } else if (S.menu === 'status') {
    drawStatus();
  } else if (S.menu === 'shop') {
    drawShop();
  } else if (S.menu === 'feedpick') {
    drawFeedPick();
  } else if (S.menu === 'medpick') {
    drawMedPick();
  } else if (S.battle) {
    drawBattle();
  } else if (S.game) {
    drawGame();
  } else {
    drawMain();
  }
  // Darken when lights are off — never over a battle/minigame (eyes stay readable)
  if (!S.lights && !S.battle && !S.game) {
    ctx.fillStyle = S.sleep ? 'rgba(0,0,0,0.55)' : 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);
  }
  // Strong pause / away veil
  if ((S.paused || S._away) && S.stage !== 'dead') {
    ctx.fillStyle = 'rgba(15,56,15,0.25)';
    ctx.fillRect(0, 0, W, H);
  }
  // since v5.23: MEMORY FULL LCD flash (revive blocked)
  if (S._memFullUntil && Date.now() < S._memFullUntil) {
    ctx.fillStyle = 'rgba(15,56,15,0.55)';
    ctx.fillRect(20, 70, 200, 36);
    drawTextCentered('MEMORY FULL', 82, '#9bbc0f');
  }
}

function update() {
  const now = Date.now();

  // The wall clock always follows the phone, including egg/dead/paused states.
  syncDeviceClock(now);

  // v5.30: battle / train / memory clocks freeze with Pause / Away / hidden tab (audit A H2)
  const arenaFrozen = !!(S.paused || S._away || (typeof document !== 'undefined' && document.visibilityState === 'hidden'));
  if (!arenaFrozen) {
    // Battle state machine
    if (S.battle) advanceBattle(now);

    // Training timing game
    if (S.game && S.gameType === 'train') {
      // Coach-style metronome beeps between cues (sparse; beep() no-ops when sound off)
      if (S.trainPhase === 'wait' && !S.paused && S.sound) {
        if (!S._trainBeepAt) S._trainBeepAt = now + 900;
        if (now >= S._trainBeepAt) {
          beep(320 + (Math.floor(S.frame / 14) % 3) * 30, 0.02, 'square', 0.035);
          S._trainBeepAt = now + 900;
        }
      }
      if (S.trainPhase === 'wait' && now >= (S.trainUntil || 0)) {
        S.trainPhase = 'go';
        // First cue is always B (the confirm button). Later rounds mix A/B.
        S.trainBtn = (S.gRound <= 1) ? 'B' : ((Math.random() < 0.5) ? 'A' : 'B');
        S.trainUntil = now + 2000; // 2s window — readable on a phone (unchanged by personality)
        S._trainBeepAt = 0;
        toast('PRESS ' + S.trainBtn + '!');
        beep(880, 0.06);
        // CLEVER: sharper spark + tiny follow-up beep (feel only — no STA/win change)
        if (personalityOf(S) === 'CLEVER') {
          spawnFx('spark', 120, 68, 2);
          beep(1180, 0.028);
        }
      } else if (S.trainPhase === 'go' && now >= (S.trainUntil || 0)) {
        S.playResult = 'sad';
        S._trainReact = 'stumble';
        S._trainReactUntil = now + 450;
        if ((S.trainOops || 0) > 0) {
          S.trainOops--;
          toast('Missed it — 1 more chance');
          S.gRound++;
          if (S.gRound > 3) endTraining(S.gScore >= 2);
          else trainNextWait(now);
        } else {
          endTraining(S.gScore >= 2);
        }
      }
    }

    // v5.10 post-arena praise / tough-love plate expiry
    if (S._postArena && now >= (S._postArena.until || 0)) S._postArena = null;

    // Memory game: show each step, then switch to input
    if (S.game && S.gameType === 'memory' && S.memPhase === 'show' && now > (S.memTimer || 0)) {
      // Finished displaying current step — advance
      if (S.memIdx >= S.memSeq.length - 1) {
        // Whole sequence shown
        S.memIdx = 0;
        S.memPhase = 'input';
        toast('Your turn! A=Left B=Right');
        beep(600, 0.05);
      } else {
        S.memIdx++;
        S.memTimer = now + 750;
        beep(400, 0.03);
      }
    }
  }

  // Egg/dead states do not run the care simulation.
  if (S.stage === 'dead') return;
  if (S.stage === 'egg') {
    // Wait for LCD egg select before starting the ~5 min timer
    if (S.eggSelect) {
      S.anim = null;
      S.hatchPhase = 0;
      return;
    }
    ensureEggChoice(S);
    if (!S.eggReadyAt) S.eggReadyAt = now + 5 * 60000;
    const left = S.eggReadyAt - now;
    // Cinematic hatch in the last ~30s
    if (left <= 30000 && left > 0) {
      if (S.anim !== 'hatch') {
        S.anim = 'hatch';
        S.hatchPhase = 1;
        S._hatchBits = [];
        S.animTimer = S.eggReadyAt + HATCH_PLATE_MS;
        toast('Egg is shaking...', { pri: 2 });
        beep(300, 0.05);
      }
      // Phase timeline: shake → crack → pop (still egg until ready)
      if (left > 18000) {
        S.hatchPhase = 1;
      } else if (left > 6000) {
        if (S.hatchPhase < 2) {
          S.hatchPhase = 2;
          toast('Cracking...', { pri: 2 });
          beep(360, 0.04);
        }
        // Spawn shell bits occasionally
        if (!S._hatchBits) S._hatchBits = [];
        if ((S.frame % 14) === 0 && S._hatchBits.length < 12) {
          const ang = Math.random() * Math.PI * 2;
          S._hatchBits.push({
            x: (S.petX || 120) + Math.cos(ang) * (10 + Math.random() * 16),
            y: 100 + Math.sin(ang) * (6 + Math.random() * 12),
            w: Math.random() < 0.5 ? 1 : 2,
            vx: Math.cos(ang) * 0.4,
            vy: 0.2 + Math.random() * 0.4
          });
        }
        for (const b of (S._hatchBits || [])) {
          b.x += b.vx || 0; b.y += b.vy || 0;
        }
      } else {
        if (S.hatchPhase < 3) {
          S.hatchPhase = 3;
          beep(480, 0.05);
          spawnFx('star', S.petX || 120, 80, 4);
        }
      }
    }
    if (now >= S.eggReadyAt) {
      S.stage = 'baby';
      S.form = 'baby';
      S.born = now;
      S.hunger = 2;
      S.happy = 2;
      assignNewMorph(S);
      if (!S._eggBiasTrait && S.eggId != null) S._eggBiasTrait = eggTraits(S.eggId).trait;
      S.hatchPhase = 3;
      S.anim = 'hatch';
      S.animTimer = now + HATCH_PLATE_MS;
      S._hatchCut = {
        t0: now,
        name: displayName(S),
        species: speciesTag(S.morphId),
        trait: personalityOf(S)
      };
      S._hatchBits = [];
      toast('It hatched! ' + displayName(S) + ' · TEMP ' + personalityOf(S), { pri: 3, hold: 2800 });
      melHatch();
      careNotify('egg', 'Your PocketPal hatched!');
      claimSlotForActive();
      save();
      updateIconHighlight();
    }
    return;
  }

  // True pause: freeze gameplay timers and animation state. The wall clock
  // remains the real phone time, but pause never causes sleep/care catch-up.
  if (S.paused) return;

  // v5.11: hidden tab — skip live care drip (visibilitychange applies catchup/timer-shift on return)
  if (typeof document !== 'undefined' && document.visibilityState === 'hidden') return;

  // v5.11 Away: freeze care like pause (timer-shift on clearAway)
  if (S._away) return;

  // Enter Away after 20 min with no input while visible (not egg/dead/game/battle)
  if (S.stage !== 'egg' && S.stage !== 'dead' && !S.game && !S.battle &&
      typeof document !== 'undefined' && document.visibilityState === 'visible' &&
      (now - (S._lastInputAt || now)) > AWAY_MS) {
    enterAway(now);
    return;
  }

  // Clear temporary face / anim when timer expires (except permanent sleep)
  if (S.animTimer && now > S.animTimer) {
    if (S.game || S.battle) {
      if (S.anim && S.anim !== 'sleep') S.anim = null;
    } else if (S.anim !== 'sleep') {
      // Finish poop sequence → show pile + call
      if (S.anim === 'poop' || S._pendingPoop) {
        S.poop = true;
        S.call = true;
        S._falseCall = false;
        S._pendingPoop = false;
        S.poopSince = now;
        S.poopCount = Math.min(4, (S.poopCount || 0) + 1);
        if (!S.poopSpots) S.poopSpots = [];
        S.poopSpots.push(Math.round(S.poopX || S.petX || 180));
      }
      // Flush care result toast if cinema ended before result tick ran
      if (S.anim === 'care' && S._care && S._care.toast && !S._care.toastShown) {
        toast(S._care.toast, { pri: 2, hold: 2200 });
      }
      S.anim = null;
      S.playResult = null;
      S.animTimer = 0;
      S._care = null;
      S._evoCut = null;
      S._growCut = null;
      S._hatchCut = null;
      if (S.hatchPhase) S.hatchPhase = 0;
    }
  }

  if (S.call && !S._falseCall && !S.poop && !S.sick && !S.injured &&
      !S.lightsMissPending && (S.hunger || 0) > 1 && (S.happy || 0) > 1) {
    S.call = false;
  }

  // Advance care cinema walk / deferred clean
  if (S.anim === 'care') tickCareCinema(now);

  const d = DIFF[S.difficulty] || DIFF.realtime;
  const sp = d.timeScale || 0.15;  // higher = faster; realtime default is classic speed

  // --- Automatic sleep / wake cycle ---
  const night = isNightTime();
  // Daytime: clear bedtime nag only. Never flip the player's light switch.
  if (!night) {
    if (S.lightsMissPending) S.lightsMissPending = false;
  }
  // Day nap ends on its own after ~25 min (lights stay as the player left them)
  if (S.sleep && S._dayNap && !night) {
    if (!S._napStarted) S._napStarted = now;
    if (now - S._napStarted > 25 * 60000) {
      S.sleep = false;
      S._dayNap = false;
      S._napStarted = 0;
      S.anim = 'wake';
      S.animTimer = now + 1000;
      toast('Nap over');
      save();
    }
  }
  if (!S.sleep && night && S.lights && !S.game && !S.battle) {
    // Pet wants to sleep — only nag if the player left the lights ON
    if (!S.lightsMissPending) {
      S.lightsMissPending = true;
      S.sleepStart = now;
      S.call = true; // attention icon for "turn lights off"
      careNotify('lights', 'Needs LIGHTS OUT — turn lights OFF for sleep!');
      S.anim = 'yawn';
      S.animTimer = now + 1600;
      toast('Getting sleepy... turn lights OFF');
      beep(300, 0.12);
    } else if (now - S.sleepStart > (S.difficulty === 'realtime' ? 12*60000 : 55*1000)) {
      // realtime keeps closer to classic 15 min grace; others use short web-friendly window
      S.careMiss += d.care; rustDisc(2);
      S.lightsMissPending = false;
      S.sleep = true; S.playResult = null; S.playResult = null; S.anim = null; // falls asleep anyway (but grumpy / lights still on)
      S.call = false;
      S.anim = 'sleep';
      S.animTimer = now + 999999;
      toast('Left lights on! Care mistake');
      beep(160, 0.15);
      save();
    }
  } else if (S.sleep && !night && !S._dayNap) {
    // Natural morning wake-up — classic Tamagotchi ages +1 day here
    // Lights stay as the player left them (no auto-on miss on the next night).
    S.sleep = false;
    S.lightsMissPending = false;
    S._dayNap = false;
    S._napStarted = 0;
    S.anim = 'wake';
    S.animTimer = now + 1400;
    S.call = false;
    // Age once per calendar morning after a night of sleep
    const dayKey = new Date(now).toDateString();
    if (S.lastAgeDay !== dayKey) S._discPracticed = false;
    if (S.lastAgeDay !== dayKey) {
      S.age++;
      S.lastAgeDay = dayKey;
      S.lastAge = now;
      S._growCut = { t0: now, age: S.age, name: displayName(S) };
      S.anim = 'grow';
      S.animTimer = now + 2600; // short morning age-up drama
      checkEvo(); // may replace with longer evo cutscene — fine
      earnCoins(1); // morning age-up
      toast('Good morning! Age ' + S.age);
      melWake();
    } else {

      toast('Good morning!');
      melWake();
    }
    const nh = nightHours();
    if (S.sleptProperly) {
      if (nh < 6) {
        S.shortNights = (S.shortNights || 0) + 1;
        S.careMiss = (S.careMiss || 0) + 1;
      } else {
        S.goodNights = (S.goodNights || 0) + 1;
        if (nh >= 10 && S.happy < 4) S.happy = Math.min(4, (S.happy || 0) + 1);
      }
    } else {
      S.shortNights = (S.shortNights || 0) + 1;
      S.careMiss = (S.careMiss || 0) + 1;
    }
    S.sleptProperly = false;
    // Authentic: if poop timer was due overnight, go shortly after wake
    const d2 = DIFF[S.difficulty] || DIFF.realtime;
    const sp2 = d2.timeScale || 0.15;
    if (!S.poop && S.lastP && (now - S.lastP > 5.5 * 60000 / sp2)) {
      S._wakePoopAt = now + 4000 + Math.floor(Math.random() * 4000);
    }
    save();
  }

  // Night + lights already off → bed, no miss. Day nap that runs into night becomes night sleep.
  if (night && !S.lights && !S.game && !S.battle) {
    if (!S.sleep) {
      S.sleep = true; S.playResult = null;
      S._dayNap = false;
      S._napStarted = 0;
      S.lightsMissPending = false;
      S.sleptProperly = true;
      S.anim = 'sleep';
      S.animTimer = now + 999999;
    } else if (S._dayNap) {
      S._dayNap = false;
      S._napStarted = 0;
      S.sleptProperly = true;
      S.lightsMissPending = false;
    }
  }

  // While asleep — care timers freeze (no poop / hunger / false calls mid-sleep)
  // Matches classic: pet rests at night; needs resume after wake
  if (S.sleep) {
    // Keep anim locked to sleep
    if (S.anim !== 'sleep' && S.anim !== 'wake') {
      S.anim = 'sleep';
      S.animTimer = now + 999999;
    }
    return; // skip hunger/happy/poop/discipline while sleeping
  }

  if (true) {
    // Hunger drain
    if (now - S.lastH > (S.age < 1 ? 3.2 : 2.5) * 60000 / sp * d.hunger) {
      if (S.hunger > 0) {
        S.hunger--;
        if (S.hunger <= 1) {
          S.call = true; S._falseCall = false;
          careNotify('hunger', 'Needs FOOD — open PocketPal and feed me!');
          S.anim = 'call'; S.animTimer = now + 1200;
        }
      } else {
        S.careMiss += d.care; rustDisc(2);
        S.call = true;
        S._falseCall = false;
        S.anim = 'call'; S.animTimer = now + 1200;
        if (Math.random() < 0.22) {
          S.sick = true; S.sickSince = now;
          careNotify('sick', 'Needs MEDICINE — open PocketPal and heal me!');
          S.anim = 'sick';
          S.animTimer = now + 2000;
          melSick();
        }
      }
      S.lastH = now;
      save();
    }

    // Happy drain
    if (now - S.lastY > (S.age < 1 ? 3.8 : 2.9) * 60000 / sp * d.happy) {
      if (S.happy > 0) {
        S.happy--;
        if (S.happy <= 1) {
          S.call = true; S._falseCall = false;
          careNotify('happy', 'Needs PLAY — open PocketPal and play with me!');
          S.anim = 'call'; S.animTimer = now + 1200;
        }
      } else {
        S.careMiss += d.care; rustDisc(2);
        S.call = true;
        S._falseCall = false;
        S.anim = 'call'; S.animTimer = now + 1200;
      }
      S.lastY = now;
      save();
    }

    // Soft injury recovery over time (slow natural heal if not critical)
    if (S.sick && S.sickSince && now - S.sickSince > 25 * 60000 / sp) {
      // ~25 min realtime-scaled without meds — chance to improve
      if (S.hunger >= 2 && S.happy >= 1 && !S.poop && Math.random() < 0.15) {
        S.sick = false;
        S.sickSince = 0;
        S.injured = false;
        S.anim = 'happy';
        S.animTimer = now + 1000;
        toast('Feeling better on its own');
        melHappy();
        save();
      }
    } else if (S.sick && !S.sickSince) {
      S.sickSince = now;
    }

    // Post-wake delayed poop (if due overnight)
    if (S._wakePoopAt && now >= S._wakePoopAt && (S.poopCount || 0) < 4 && S.anim !== 'poop') {
      S._wakePoopAt = 0;
      S.poopX = Math.round(S.petX || 120) + 16;
      S.poopY = 145;
      S.lastP = now;
      S.poopSince = now;
      if (S.game || S.battle) {
        S.poop = true;
        S.poopCount = Math.min(4, (S.poopCount || 0) + 1);
        if (!S.poopSpots) S.poopSpots = [];
        S.poopSpots.push(Math.round(S.petX || 120) + 16);
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
      } else {
        S.anim = 'poop';
        S.animTimer = now + 1100;
        S._pendingPoop = true;
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
        toast('Needs cleaning!');
        melPoop();
      }
      save();
    }

    // Poop — squat animation first, then pile appears
    if (now - S.lastP > 5.5 * 60000 / sp && (S.poopCount || 0) < 4 && S.anim !== 'poop') {
      S.poopX = Math.round(S.petX || 120) + 16;
      S.poopY = 145;
      S.lastP = now;
      S.poopSince = now;
      if (S.game || S.battle) {
        S.poop = true;
        S.poopCount = Math.min(4, (S.poopCount || 0) + 1);
        if (!S.poopSpots) S.poopSpots = [];
        S.poopSpots.push(Math.round(S.petX || 120) + 16);
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
      } else {
        S.anim = 'poop';
        S.animTimer = now + 1100;
        S._pendingPoop = true;
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
        toast('Needs cleaning!');
        melPoop();
        beep(200, 0.08);
      }
      save();
    }
    // Filth escalation (classic: piles fill screen → misery → sick → death risk)
    if (S.poop && S.poopSince && now - S.poopSince > 6 * 60000 / sp) {
      const stacks = Math.max(1, S.poopCount || 1);
      S.careMiss += d.care * stacks;
      if (S.happy > 0) S.happy = Math.max(0, S.happy - 1);
      // Screen full of poop (4) — pet trapped, gets sick
      if (stacks >= 4 && !S.sick && Math.random() < 0.35) {
        S.sick = true;
        S.sickSince = now;
        S.call = true;
        careNotify('sick', 'Needs MEDICINE — too filthy!');
        toast('Sick from the mess!');
        melSick();
      } else if (stacks >= 3) {
        toast('Filthy! (' + stacks + '/4 piles)');
      } else {
        toast(stacks > 1 ? 'Messy! (' + stacks + ' piles)' : 'Still dirty!');
      }
      S.poopSince = now;
      S.call = true;
      save();

function trainNextWait(now) {
  S.trainPhase = 'wait';
  S.trainBtn = null;

  S.playResult = null;

function trainPress(btn) {
  // btn: 'A' or 'B' — must match S.trainBtn during GO phase
  if (!S.game || S.gameType !== 'train') return;
  const now = Date.now();
  if (S.trainPhase === 'go') {
    const need = S.trainBtn || 'B';
    if (btn !== need) {
      S.playResult = 'sad';
      S._trainReact = 'stumble';
      S._trainReactUntil = now + 450;
      beep(160, 0.08);
      if ((S.trainOops || 0) > 0) {
        S.trainOops--;

        S.gRound++;
        if (S.gRound > 3) endTraining(S.gScore >= 2);
        else trainNextWait(now);
      } else {
        toast('Wrong button! Needed ' + need);
        endTraining(S.gScore >= 2);
      }
      return;
    }
    S.gScore++;
    S.playResult = 'happy';
    S._trainReact = 'pumped';
    S._trainReactUntil = now + 500;
    beep(700, 0.05);
    S.gRound++;
    if (S.gRound > 3) {
      endTraining(true);
    } else {
      trainNextWait(now);
      toast('Nice! Round ' + S.gRound + '/3');
    }
  } else {
    // Too early — first slip is forgiven
    S.playResult = 'sad';
    S._trainReact = 'stumble';

    beep(160, 0.08);
    if ((S.trainOops || 0) > 0) {
      S.trainOops--;

  S._trainWork = null;
  S._trainReact = null;

    S.battleXP = (S.battleXP || 0) + bonus;
    S.weight = Math.max(5, S.weight - 1);

function updateIconHighlight() {
  const n = ICONS.length;
  let sel = Number(S.sel);
  if (!Number.isFinite(sel) || sel < 0 || sel >= n) sel = 0;
  S.sel = sel | 0;
  const action = ICONS[S.sel];

  const needAct = needIconAction(careNeedKind());
  icons.forEach(el => {

    el.classList.toggle('on', on);

function activeMinutesBetween(start, end) {
  // Closed-PWA simulation follows the same local sleep schedule as live play.
  // Minute stepping keeps midnight/stage schedule handling predictable.
  if (end <= start) return 0;
  const maxMs = 7 * 24 * 60 * 60000;
  start = Math.max(start, end - maxMs);
  let active = 0;
  for (let t = Math.floor(start / 60000) * 60000; t < end; t += 60000) {
    const d = new Date(t + 30000);
    const h = d.getHours();
    const bw = getBedWake();
    const night = bw.bed > bw.wake ? (h >= bw.bed || h < bw.wake) : (h >= bw.bed && h < bw.wake);
    if (!night) active++;
  }
  return active;
}

function updateCareStreak() {
  const day = new Date().toDateString();
  if (S.lastCareDay === day) return false;
  const yest = new Date();
  yest.setDate(yest.getDate() - 1);
  if (S.lastCareDay === yest.toDateString()) {
    S.careStreak = (S.careStreak || 0) + 1;
  } else if (!S.lastCareDay) {
    S.careStreak = 1;
  } else {
    S.careStreak = 1; // broken streak resets to 1 for today
  }
  S.lastCareDay = day;
  // v5.22: once/day streak tick → +2 coins (living, not frozen)
  earnCoins(2);
  return true;
}

function applyOfflineCatchup(now) {
  if (S.stage === 'egg' || S.stage === 'dead' || S.paused || S._away) return 0;
  const last = Number(S.lastSave);
  if (!Number.isFinite(last) || last < 1e12 || last > now) { S.lastSave = now; return 0; }
  const elapsed = Math.max(0, now - last);
  if (elapsed < 2 * 60000) return 0;
  const activeMin = activeMinutesBetween(last, now);
  const d = DIFF[S.difficulty] || DIFF.realtime;
  const sp = d.timeScale || 0.15;
  const hungerStep = (S.age < 1 ? 3.2 : 2.5) / sp * d.hunger;
  const happyStep = (S.age < 1 ? 3.8 : 2.9) / sp * d.happy;
  const poopStep = 6.8 / sp;
  const ageStep = (12 * 60) / sp;
  // v5.30: live sleep freezes meters — offline catchup must match (audit A H3)
  const sleepFreeze = !!S.sleep;
  const hLoss = sleepFreeze ? 0 : Math.floor(activeMin / hungerStep);
  const yLoss = sleepFreeze ? 0 : Math.floor(activeMin / happyStep);
  if (hLoss > 0) {
    S.hunger = Math.max(0, S.hunger - Math.min(hLoss, 4)); // cap offline drain
    // Care miss grows slowly offline — player gets a chance to recover on return
    S.careMiss += Math.min(3, Math.max(0, hLoss - 1)) * d.care;
    if (S.hunger <= 0) {
      rustDisc(Math.min(8, 2 + hLoss));
      S.call = true; careNotify('hunger', 'Needs FOOD — open PocketPal and feed me!');
    }
  }
  if (yLoss > 0) {
    S.happy = Math.max(0, S.happy - Math.min(yLoss, 4));
    S.careMiss += Math.min(3, Math.max(0, yLoss - 1)) * d.care;
    if (S.happy === 0) { S.call = true; careNotify('happy', 'Needs PLAY — open PocketPal and play with me!'); }
  }
  if (!sleepFreeze && !S.poop && activeMin >= poopStep) {
    S.poop = true; S.call = true;
    S.poopX = Math.round(S.petX || 120) + 16; S.poopY = 145; S.poopSince = now;
    S.poopCount = Math.max(1, S.poopCount | 0);
    if (!S.poopSpots) S.poopSpots = [];
    if (!S.poopSpots.length) S.poopSpots.push(S.poopX);
    careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
  }
  // Classic aging: +1 age per night/morning crossed while away
  // (plus a very slow awake-time fallback so long daytime absences still progress)
  let nights = 0;
  try {
    const startDay = new Date(last);
    const endDay = new Date(now);
    // Count midnights crossed while the pet had a chance to complete a night
    const cursor = new Date(startDay);
    cursor.setHours(0,0,0,0);
    cursor.setDate(cursor.getDate() + 1); // first midnight after last save
    while (cursor.getTime() <= endDay.getTime()) {
      nights++;
      cursor.setDate(cursor.getDate() + 1);
    }
  } catch(e) { nights = 0; }
  // Cap: allow at least midnight-based nights (floor of hours/24 was wrongly zeroing overnight)
  const maxDays = Math.max(0, Math.ceil(elapsed / (24 * 3600000)));
  if (maxDays > 0) nights = Math.min(nights, maxDays);
  // If we crossed a midnight and were away > 3 hours, keep at least 1 night
  if (nights === 0 && elapsed > 3 * 3600000) {
    const a = new Date(last), b = new Date(now);
    if (a.getDate() !== b.getDate() || a.getMonth() !== b.getMonth() || a.getFullYear() !== b.getFullYear()) {
      nights = 1;
    }
  }
  if (nights > 0) {
    S._discPracticed = false;
  }
  // v5.30: offline overnight lights-left-ON care miss (audit A H4)
  // Skip if already in proper lights-off sleep at save time.
  if (nights > 0 && S.lights && !(S.sleep && S.sleptProperly && !S.lights)) {
    if (!S.sleptProperly) {
      S.careMiss += Math.min(nights, 2) * d.care;
      rustDisc(Math.min(4, nights));
      try { toast('Left lights on overnight — care miss', { pri: 2 }); } catch (e) {}
      if (typeof isNightTime === 'function' && isNightTime()) {
        S.sleep = true; S.playResult = null;
        S._dayNap = false;
        S.lightsMissPending = false;
        S.sleptProperly = false;
        S.anim = 'sleep';
        S.animTimer = now + 999999;
      } else if (S.sleep && !S._dayNap) {
        // Returned in daytime after lights-on night — wake like morning path
        S.sleep = false;
        S.lightsMissPending = false;
      }
    }
  }
  // Fallback slow age from daytime activity (very slow in realtime)
  const awakeAgeGain = Math.floor(activeMin / ageStep);
  let ageGain = Math.min(1, Math.max(nights, awakeAgeGain));
  if (S.lastAgeDay === new Date(now).toDateString()) ageGain = 0;
  const stageBefore = S.stage;
  const formBefore = S.form;
  const growthBefore = S.growthPhase || 0;
  // Catch up within-stage growth (hours awake-equivalent while away)
  // Well-cared offline catch-up slightly faster (v5.18)
  const growthHours = Math.floor(activeMin / 60);
  let growthGain = growthHours;
  if (growthHours > 0) {
    const wellOff = (S.hunger || 0) >= 3 && (S.happy || 0) >= 3 && (S.careMiss || 0) < 4;
    if (wellOff && activeMin >= 50) growthGain = Math.max(growthGain, growthHours + 1);
  }
  if (growthGain > 0 && S.stage !== 'egg' && S.stage !== 'dead') {
    S.growthPhase = Math.min(3, growthBefore + growthGain);
    S.lastGrowthAt = now;
  }
  if (ageGain > 0) {
    S.age += ageGain;
    S.lastAge = now;
    S.lastAgeDay = new Date(now).toDateString();
    for (let i = 0; i < 6; i++) {
      const beforeStage = S.stage;
      checkEvo();
      if (S.stage === beforeStage) break;
    }
  }
  // If we returned during daytime after being away overnight, wake night sleep only
  if (S.sleep && !isNightTime() && !S._dayNap) {
    S.sleep = false;
    S.lightsMissPending = false;
  }
  S.lastH = now;
  S.lastY = now;
  S.lastP = now;
  S.lastVirtTick = now;
  // Show evo anim if stage/form changed while away; else grow cinema when phase jumped
  if (S.stage !== stageBefore || S.form !== formBefore) {
    S._evoCut = {
      t0: now,
      oldForm: formBefore,
      oldStage: stageBefore,
      newForm: S.form,
      newStage: S.stage,
      name: displayName(S),
      formName: NAMES[S.form] || S.form
    };
    S.anim = 'evo';
    S.animTimer = now + 2800;
    toast('While you were away → ' + (NAMES[S.form] || S.form) + '!');
    melEvolve();
  } else if ((S.growthPhase || 0) > growthBefore) {
    // v5.18: returning players *see* catch-up growth (not toast-only)
    S._growCut = {
      t0: now,
      age: S.age,
      name: displayName(S),
      phase: S.growthPhase,
      fromPhase: growthBefore,
      catchUp: true
    };
    S.anim = 'grow';
    S.animTimer = now + 2800;
    toast('Grew while away (' + growthBefore + '→' + S.growthPhase + ')');
  } else if (activeMin > 0) {
    S.anim = null;
  }
  if (elapsed >= 2 * 60000) toast('Welcome back · ' + Math.floor(elapsed / 60000) + ' min passed');
  // Grace: do not die immediately after offline catch-up / app update
  S.loadGraceUntil = now + 3 * 60000; // 3 minutes to care for pet
  S.lastSave = now;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) { noteSaveFail(); }
  return elapsed;
}
function careFrozenNow() {
  // Away Safeguard + Pause + hidden tab: live care is frozen — SW must not project drain
  return !!(S.paused || S._away || (typeof document !== 'undefined' && document.visibilityState === 'hidden'));
}
function pushCareSnapshotToSW(clear) {
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) return;
  try {
    if (clear || !S.notifications) {
      navigator.serviceWorker.controller.postMessage({ type: 'CARE_SNAPSHOT', enabled: false });
      return;
    }
    // SW local: freeze when hidden so periodicsync does not spam projected pings while tab is backgrounded;
    // Worker /care uses careSnapshotBody (no frozen-from-hidden) and always projects for closed-phone.
    const frozen = careFrozenNow();
    navigator.serviceWorker.controller.postMessage({
      type: 'CARE_SNAPSHOT',
      enabled: true,
      paused: frozen,
      frozen: frozen,
      backgrounded: typeof document !== 'undefined' && document.visibilityState === 'hidden',
      sleep: !!S.sleep,
      focused: typeof document !== 'undefined' && document.visibilityState === 'visible',
      stage: S.stage || '',
      eggReadyAt: S.eggReadyAt || 0,
      lightsMiss: !!S.lightsMissPending,
      naughty: !!(S.call && S._falseCall),
      hunger: S.hunger,
      happy: S.happy,
      poop: !!S.poop,
      poopCount: S.poopCount || 0,
      sick: !!(S.sick || S.injured),
      lastH: S.lastH || Date.now(),
      lastY: S.lastY || Date.now(),
      lastP: S.lastP || Date.now(),
      hungerMs: carePipMs('hunger'),
      happyMs: carePipMs('happy'),
      poopMs: 8 * 60000
    });
  } catch (e) {}
}
function noteSaveFail() {
  if (S._saveFailToast) return;
  S._saveFailToast = true;
  try { toast('Save failed — storage full', { pri: 3, hold: 3200 }); } catch (e) {}
}
function save() {
  S.lastSave = Date.now();
  try {
    if (S.stage !== 'dead' && typeof claimSlotForActive === 'function') claimSlotForActive();
  } catch (e) {}
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) { noteSaveFail(); }
  pushCareSnapshotToSW();
  clearResolvedCareAlerts();
  if (!S._lastCarePub || Date.now() - S._lastCarePub > 15 * 60000) {
    S._lastCarePub = Date.now();
    publishCareCard();
  }
  if (workerBaseUrl() && S.stage !== 'egg' && S.stage !== 'dead') {
    if (!S._lastPublish || Date.now() - S._lastPublish > 60000) {
      S._lastPublish = Date.now();
      publishBattleCard();
    }
  }
}
function load() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
      const oldKeys = ['pocketpal_v24','pocketpal_v23','pocketpal_v21','pocketpal_v20','tama_v19'];
      for (const k of oldKeys) {
        raw = localStorage.getItem(k);
        if (raw) { localStorage.setItem(SAVE_KEY, raw); break; }
      }
    }
    if (!raw) return false;
    Object.assign(S, JSON.parse(raw));
    // migrate missing v2.16 fields
    if (S.poopX === undefined) S.poopX = 180;
    if (S.poopY === undefined) S.poopY = 145;
    if (S.paused === undefined) S.paused = false;
    if (S.pauseStarted === undefined) S.pauseStarted = 0;
    // v5.11: Away / critical grace are session runtime — reset on load (loadGrace covers return)
    S._away = false;
    S._awayStarted = 0;
    S._lastInputAt = Date.now();
    S._critWarned = false;
    S._critGraceUntil = 0;
    if (S.virtualHour === undefined) S.virtualHour = new Date().getHours();
    if (S.bedHour == null) S.bedHour = 20;
    if (S.wakeHour == null) S.wakeHour = 8;
    if (S.goodNights == null) S.goodNights = 0;
    if (S.shortNights == null) S.shortNights = 0;
    if (S.virtualMin === undefined) S.virtualMin = new Date().getMinutes();
    if (S.lastVirtTick === undefined) S.lastVirtTick = Date.now();
    if (S.lightsMissPending === undefined) S.lightsMissPending = false;
    if (S.sleepStart === undefined) S.sleepStart = 0;
    if (S.notifications === undefined) S.notifications = false;
    if (S.lastNotifyAt === undefined) S.lastNotifyAt = 0;
    if (S.lastNotifyType === undefined) S.lastNotifyType = '';
    if (S.lastAgeDay === undefined) S.lastAgeDay = '';
    if (S.battleWins === undefined) S.battleWins = 0;
    if (S.battleLosses === undefined) S.battleLosses = 0;
    if (S.battleXP === undefined) S.battleXP = 0;
    if (S.battle === undefined) S.battle = false;
    // Clear any mid-frame draw flags / stray arena pose after a hard reload.
    resetHomePose();
    S._postArena = null;
    S._trainWork = null;
    S._trainReact = null;
    if (S.bat === undefined) S.bat = null;
    if (!Array.isArray(S.petMemory)) S.petMemory = [];
    S.petMemory = Array.from({length: MEMORY_SLOTS}, (_, i) => {
      const e = S.petMemory[i];
      if (e && e.pet && typeof e.pet === 'object') {
        if (e.pet.petMemory) delete e.pet.petMemory;
        if (e.pet.activeSlot != null) delete e.pet.activeSlot;
        if (e.pet.speciesSeen) delete e.pet.speciesSeen;
        return e;
      }
      return null;
    });
    if (!S.speciesSeen || typeof S.speciesSeen !== 'object') S.speciesSeen = {};
    if (!S.petId) S.petId = newPetId();
    ensurePetIds();
    // v5.09/v5.12: migrate missing eggChoice — default from petId hash (no wipe)
    if (S.stage === 'egg') {
      if (S.eggSelect) {
        // Mid-pick: keep LCD select; do not force a hashed egg yet
        S.eggId = null;
        S.eggChoice = null;
        S.eggReadyAt = null;
        delete S.eggLeft;
        if (S.eggPick == null) S.eggPick = 0;
        S.eggPick = normalizeEggId(S.eggPick | 0);
      } else if (S.eggId == null && S.eggChoice == null) {
        // Mid-warm legacy egg (pre-select era): assign default look, skip select UI
        ensureEggChoice(S);
        S.eggSelect = false;
        if (!S.eggReadyAt) S.eggReadyAt = Date.now() + 5 * 60000;
      } else {
        ensureEggChoice(S);
        if (S.eggSelect == null) S.eggSelect = false;
      }
    } else {
      if (S.eggId != null || S.eggChoice != null) ensureEggChoice(S);
      S.eggSelect = false;
    }
    if (S.eggPick == null) S.eggPick = 0;
    if (S.hatchPhase == null) S.hatchPhase = 0;
    S._hatchCut = null;
    S._hatchBits = null;
    if (S._eggBiasTrait == null && S.eggId != null) S._eggBiasTrait = eggTraits(S.eggId).trait;
    if (S.battleLocked === undefined) S.battleLocked = false;
    if (S.lastFalseCall === undefined) S.lastFalseCall = 0;
    if (S.lastNaughtyDay === undefined) S.lastNaughtyDay = '';
    if (S.lastNaughtyCount === undefined) S.lastNaughtyCount = 0;
    if (S.sleptProperly === undefined) S.sleptProperly = false;
    // Keep preference; if permission was revoked, force alerts off
    if (typeof Notification !== 'undefined' && Notification.permission !== 'granted') {
      S.notifications = false;
    }
    // v2.17: authentic 8pm-8am sleep + morning age-up
    S.difficulty = 'realtime'; // locked to original pace
    // Growth catch-up: count calendar midnights since birth vs current age.
    // Re-runs if age is still behind (so a failed prior catch-up can recover).
    if (S.stage !== 'egg' && S.stage !== 'dead' && S.born) {
      const bornDate = new Date(Number(S.born));
      const nowDate = new Date();
      bornDate.setHours(0,0,0,0);
      nowDate.setHours(0,0,0,0);
      const calendarDays = Math.max(0, Math.round((nowDate - bornDate) / (24 * 3600000)));
      // At least 1 age if the pet has lived past one 8am wake after birth day
      let expected = calendarDays;
      // If born yesterday and it's already past 8am today, expect age >= 1
      if (expected === 0 && (Date.now() - Number(S.born)) > 12 * 3600000) expected = 1;
      if (expected > S.age) {
        // Never jump more than one year of age on a single load — a big
        // catch-up was aging adults into the "return home" window after updates.
        const missed = Math.min(expected - S.age, 1);
        S.age += missed;
        S.lastAge = Date.now();
        S.lastAgeDay = new Date().toDateString();
        S._skipOldAgeDeath = Date.now() + 24 * 3600000;
        checkEvo();
        setTimeout(() => toast('Grew a bit while away · Age ' + S.age), 600);
      }
      S._ageCatchupDone = true;
    }
    // Re-issue device id if old format without checksum
    if (S.myCode && typeof isValidFriendCode === 'function' && !isValidFriendCode(S.myCode)) {
      S.myCode = null;
    }
    // Keep real packed snapshots. Drop empty rows and old checksum-only fakes with no form.
    if (Array.isArray(S.friends)) {
      S.friends = S.friends.filter(f => f && (f.real || f.form) && (f.petId || f.code || f.morph != null));
    }
    // Always display the phone's actual local clock; it is not a simulated clock.
    syncDeviceClock(Date.now());
    // Recover leaked night-sleep into daytime. Keep a player-started day nap.
    if (S.sleep && !isNightTime() && !S._dayNap) {
      S.sleep = false;
      S.lightsMissPending = false;
      S.anim = null;
    }
    if (!isNightTime()) S.lightsMissPending = false;
    // Never kill the moment the app/update loads
    S.loadGraceUntil = Date.now() + 3 * 60000;
    if (S.shellTheme === undefined) S.shellTheme = 0;
    if (S.coins == null) S.coins = 0;
    if (S.invChip == null) S.invChip = 0;
    if (S.invTonic == null) S.invTonic = 0;
    if (S.invRevive == null) S.invRevive = 0;
    if (S.coinsPlayDay == null) S.coinsPlayDay = '';
    if (S.coinsPlayEarned == null) S.coinsPlayEarned = 0;
    applyShellTheme(S.shellTheme || 0);
    try { if (S.stage !== 'egg' && S.stage !== 'dead') ensureMorph(S); } catch(e) {}

    // If was paused, stay paused (true freeze). Otherwise simulate care while
    // the PWA was closed/backgrounded, including the night sleep window.
    if (S.paused) toast('Still paused · Hold B to resume');
    else applyOfflineCatchup(Date.now());
    normalizePetMemory();
    if (S.stage !== 'dead' && S.petId) claimSlotForActive();
    updateCareStreak();
    tryAcceptFriendFromUrl();
    tryOpenCareFromUrl();
    {
      const n = ICONS.length;
      let sel = Number(S.sel);
      if (!Number.isFinite(sel) || sel < 0 || sel >= n) S.sel = 0;
      else S.sel = sel | 0;
