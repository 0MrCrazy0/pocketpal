<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#e85a71" id="themeColorMeta">

<style>
  :root {
    --shell: #e85a71;
    --shell-dark: #c43c55;
    --lcd: #9bbc0f;
    --ink: #0f380f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 4px;
    overflow: hidden;
  }
  /* Banner stats moved onto LCD — keep panel out of the way */
  .info-panel { display: none; }

  .device {
    width: min(400px, 96vw);
    background: linear-gradient(165deg, #f2788c 0%, var(--shell) 45%, var(--shell-dark) 100%);
    border-radius: 24px;
    padding: 14px 14px 12px;
    box-shadow:
      0 0 0 3px #f9b4c0,
      0 0 0 6px #b83550,
      0 10px 24px rgba(0,0,0,0.45),
      inset 0 3px 10px rgba(255,255,255,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  /* Bell + sound on shell, top-right above LCD */
  .shell-controls {
    position: absolute;
    top: 4px;
    right: 10px;
    display: flex;
    gap: 3px;
    z-index: 30;
    pointer-events: auto;
  }
  .shell-controls .sound-btn {
    font-size: 13px;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.28);
    color: #fff;
    cursor: pointer;
    padding: 1px 5px;
    border-radius: 7px;
    line-height: 1.15;
  }
  .device::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 4px;
    background: #222;
    border-radius: 3px;
  }
  .lcd-bezel {
    width: 100%;
    background: #1a1a1a;
    border-radius: 10px;
    padding: 6px;
    margin-top: 28px; /* room for shell controls above LCD */
    box-shadow: inset 0 0 0 2px #333, inset 0 0 12px #000;
  }
  .lcd {
    width: 100%;
    aspect-ratio: 1.35 / 1;
    background: var(--lcd);
    border-radius: 5px;
    position: relative;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* Menu icons sit directly under the pet LCD */
  .icons {
    display: flex;
    width: 100%;
    gap: 3px;
    margin: 8px 0 6px;
    pointer-events: none; /* A/B/C only control */
    position: relative;
    z-index: 5;
  }
  .icon {
    flex: 1;
    height: 36px;
    background: #222;
    border: 2px solid #3a3a3a;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #888;
  }
  .icon.on {
    background: #333;
    border-color: #fff;
    color: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.3);
  }
  .btns {
    display: flex;
    justify-content: center;
    gap: 24px;
  }
  .btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(145deg, #4a4a4a, #222);
    border: 3px solid #111;
    box-shadow: 0 4px 0 #0a0a0a, inset 0 2px 3px rgba(255,255,255,0.1);
    color: #ccc;
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn:active, .btn.pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #0a0a0a, inset 0 2px 5px rgba(0,0,0,0.4);
  }
  .btn.a { border-color: #4a9; }
  .btn.b { border-color: #49a; }
  .btn.c { border-color: #a54; }
  /* Menus stay inside the pet LCD only — A/B/C and icons stay visible */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 56, 15, 0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    z-index: 20;
    color: var(--lcd);
    text-align: center;
    padding: 8px 8px 10px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    overflow-y: auto;
    border-radius: 5px;
  }
  .overlay h2 { font-size: 14px; margin: 4px 0 8px; color: #c4d84a; }
  .overlay p { margin: 3px 0; line-height: 1.35; }
  .overlay button {
    margin-top: 8px;
    padding: 8px 16px;
    background: transparent;
    border: 2px solid var(--lcd);
    border-radius: 5px;
    color: var(--lcd);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    min-height: 36px;
  }
  .overlay input {
    margin-top: 6px;
    padding: 8px 10px;
    font-size: 13px;
    width: 85%;
    background: #0a2a0a;
    border: 1px solid var(--lcd);
    color: var(--lcd);
    text-align: center;
    border-radius: 5px;
  }
  .overlay .btn-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .overlay .friend-list {
    width: 100%;
    max-height: 48px;
    overflow-y: auto;
    margin: 6px 0;
    text-align: left;
  }
  .overlay .friend-item {
    padding: 5px 8px;
    margin: 3px 0;
    border: 1px solid #3a5a3a;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .overlay .friend-item.selected {
    border-color: var(--lcd);
    background: #0a2a0a;
  }
  /* LCD-green scrollbars — never the OS default chrome */
  .overlay,
  .overlay .friend-list,
  #overlay-extra {
    scrollbar-width: thin;
    scrollbar-color: #8bac0f #0a280a;
  }
  .overlay::-webkit-scrollbar,
  .overlay .friend-list::-webkit-scrollbar,
  #overlay-extra::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .overlay::-webkit-scrollbar-track,
  .overlay .friend-list::-webkit-scrollbar-track,
  #overlay-extra::-webkit-scrollbar-track {
    background: #0a280a;
  }
  .overlay::-webkit-scrollbar-thumb,
  .overlay .friend-list::-webkit-scrollbar-thumb,
  #overlay-extra::-webkit-scrollbar-thumb {
    background: #8bac0f;
    border-radius: 6px;
    border: 1px solid #0f380f;
  }
  .hidden { display: none !important; }
  /* Toast on the pink shell, centered just above the LCD — never covers game prompts */
  .toast {
    position: absolute;
    left: 50%;
    top: 18px; /* under speaker hole, just above LCD bezel */
    transform: translateX(-50%);
    background: rgba(15, 56, 15, 0.95);
    color: #9bbc0f;
    border: 1px solid #0f380f;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    z-index: 40;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    max-width: 78%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .toast.show { opacity: 1; }
</style>

<script>


/* ============================================================
   POCKETPAL — GAME RULES & MECHANICS (dev notes)
   ------------------------------------------------------------
   CARE (Tamagotchi-style)
   - Hunger 0-4: drains while awake; meal fills more than snack
   - Happy 0-4: drains while awake; play/snack/train/win/clean raise
     Unhappy stages: 4 joy · 3 content · 2 ok · 1 low · 0 miserable
   - Discipline 0-100%: UP on correct false-call scold; DOWN on mistakes / neglect / nights unused
   - Weight: +meal/snack, -play/train/battle; evo path + battle power
   - Care miss: empty meters, ignored lights, piled poop, long sick, wrong medicine
   - Poop: stacks up to 4 piles; pet avoids piles; full screen → unhappy/sick/death risk
   - Sick: neglect, max filth, battle injury; medicine or slow heal
   - Injury: battle loss flag → sick + needs medicine
   - Call: real need or false call (discipline only if false)

   CLOCK / SLEEP
   - Uses device local time
   - Night window 8:00 PM – 8:00 AM
   - Lights OFF at night → sleep; ignore lights → care miss + sleep
   - Lights OFF in day → dark room; babies/children may nap
   - Morning wake → +1 age (once per calendar day) + evo checks
   - Pause (hold B) freezes care timers

   GROWTH
   - Stages: egg → baby → child → teen → adult (+ secret Elder)
   - 256 Pal species (8 ears × 8 tails × 4 patterns) on 12 body lines
   - Forms: Pip→Nib→Lumi/Grub→Momo/Kiko/Taro/Poko/Nori/Zuzu/Nova/Bibi/Rin/Bolt + unique morph #
   - growthPhase 0-3: body visibly fills out each ~1h awake (and offline catch-up)
   - Morning/age evo changes stage form; growthPhase resets on evo
   - Offline: growth + age applied; evo animation plays on return if form changed
   - Discipline UP: correct false-call scold (+12)
   - Discipline DOWN: wrong scold (−8), scold-for-nothing (−5), ignored false-call (−6),
     wrong medicine (−3), woken at night (−4), neglect/filth (−1..4), unused overnight (−4),
     breed (halved)

   PLAY
   - Look: watch pupils lock left/right (body may fake-lean the other way)
   - Memory: watch sequence then repeat; grows longer
   - Train XP: timing GO → Battle XP

   BATTLE (Teen+)
   - Training: rotating roster of weak/mid/hard pals (never the same twice)
   - Friend: code snapshot opponent
   - Fresh foes ~3 HP; mid ~6; hard ~8. Mash B to charge; Guard recovers STA
   - Uncharged hits still tap for 1 if you have stamina (pets fight with autonomy)
   - Level = 1 + floor(XP/5) — shown on LCD + Status + battle

   LIFE
   - Death: long neglect or adult old-age after age ~12+
   - Restart after death → Gen+1; friends/XP preferences kept where saved
   ============================================================ */
// ============================================================
//  POCKETPAL v2.90
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 240, H = 178;

const S = {
  stage: 'egg', form: 'egg',
  age: 0, weight: 5,
  hunger: 4, happy: 4, disc: 0,
  careMiss: 0, discMiss: 0,
  sick: false, sleep: false, lights: true,
  poop: false, poopX: 180,
  poopCount: 0, poopY: 145,
  call: false,
  lastFalseCall: 0,
  loadGraceUntil: 0,
  injured: false,
  shellTheme: 0,
  petId: '',
  morphId: null,
  petName: '',
  lastDiscTick: 0,
  _discPracticed: false,
  speciesSeen: {},
  growthPhase: 0,
  careStreak: 0,
  petFamily: [],
  petMemory: [],
  activeSlot: null,
  lastCareDay: '',
  lastGrowthAt: 0,
  sickSince: 0,
  _wakePoopAt: 0,
  born: null,
  lastH: Date.now(), lastY: Date.now(),
  lastP: Date.now(), lastAge: Date.now(), lastSave: Date.now(),
  game: false, gScore: 0, gRound: 0, gameDir: 0,
  gameType: 'look', // 'look' | 'memory'
  memSeq: [], memIdx: 0, memPhase: 'show', // show | input
  memTimer: 0,
  // Battle
  battle: false,
  battleWins: 0,
  battleLosses: 0,
  battleXP: 0,
  bat: null, // active battle state object
  battleLocked: false,
  menu: null, sel: 0,
  sound: true,
  notifications: false,
  lastNotifyAt: 0,
  lastNotifyType: '',
  musicStep: 0,
  musicTimer: 0,
  musicPlaying: false,
  difficulty: 'realtime',  // classic hardware speed is the default
  generation: 1,
  deaths: 0, frame: 0,
  myCode: null,
  friends: [],
  selectedFriend: 0,
  married: false,
  anim: null,
  animTimer: 0,
  inheritedBonus: 0,
  petX: 120,
  petTargetX: 120,
  lastBeep: 0,
  playResult: null, // 'happy' | 'sad' | null for play feedback face
  // v2.17 sleep + pause + finished-game fx
  paused: false,
  pauseStarted: 0,
  sleepStart: 0,
  lightsMissPending: false,
  lastSleepCheck: Date.now(),
  virtualHour: new Date().getHours(),
  virtualMin: new Date().getMinutes(),
  lastVirtTick: Date.now(),
  lastAgeDay: '',   // YYYY-MM-DD of last morning age-up
  sleptProperly: false, // lights were off during night sleep
  fx: [],           // floating hearts / bubbles {type,x,y,life,vy}
  hatchPhase: 0,    // 0 idle egg, 1 shaking, 2 cracking, 3 done
  deathPhase: 0,    // 0 rising, 1 spirit
  tiltTimer: 0
};


// v2.79 real-time P2P battle runtime (socket is intentionally not saved to localStorage)
const P2P = { socket:null, room:'', slot:0, connected:false, peer:null, ready:false, peerReady:false, peerLocked:false, locked:false, peerAction:null, sentAction:false };
function p2pWorkerBase(){ return workerBaseUrl(); }
function p2pWsUrl(room){ const base=p2pWorkerBase(); if(!base) return ''; return base.replace(/^https:/,'wss:').replace(/^http:/,'ws:') + '/room?code=' + encodeURIComponent(room); }
function randomRoomCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let out=''; for(let i=0;i<6;i++) out+=chars[Math.floor(Math.random()*chars.length)]; return out; }
function closeP2P(){ try{ if(P2P.socket) P2P.socket.close(); }catch(e){} P2P.socket=null; P2P.connected=false; P2P.peer=null; P2P.room=''; P2P.slot=0; P2P.ready=false; P2P.peerReady=false; P2P.locked=false; P2P.peerLocked=false; P2P.peerAction=null; P2P.sentAction=false; }
function p2pSend(obj){ try{ if(P2P.socket && P2P.socket.readyState===1) P2P.socket.send(JSON.stringify(obj)); else return false; return true; }catch(e){return false;} }
function p2pPetCard(){ ensureMorph(S); return {name:displayName(S),form:S.form,stage:S.stage,age:S.age||0,xp:S.battleXP||0,wins:S.battleWins||0,losses:S.battleLosses||0,wt:S.weight||10,disc:S.disc||0,power:battlePower(),maxHP:battleMaxHP(S.stage==='adult'&&S.form==='secret'?'secret':S.stage,S.battleXP),level:battleLevel(S.battleXP),morph:S.morphId||0,petName:S.petName||displayName(S)}; }
function openP2PRoom(room, create){
  const block=canBattle();
  if(block){toast(block);return false;}
  const code=(room||randomRoomCode()).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  const url=p2pWsUrl(code); if(!url){toast('Cloudflare Worker not configured');return false;}
  closeP2P(); P2P.room=code; P2P.socket=new WebSocket(url);
  P2P.socket.onopen=()=>{P2P.connected=true; p2pSend({type:'hello',pet:p2pPetCard()}); showP2PRoom();};
  P2P.socket.onmessage=(ev)=>{ let m; try{m=JSON.parse(ev.data)}catch(e){return;}
    if(m.type==='joined'){P2P.slot=m.slot||1; showP2PRoom();}
    else if(m.type==='players'){showP2PRoom();}
    else if(m.type==='peer'){P2P.peer=m.pet||null; if(S.battle&&S.bat&&S.bat.kind==='p2p'){S.bat.enemyName=P2P.peer.name||'Rival';S.bat.enemyForm=P2P.peer.form;S.bat.enemyStage=P2P.peer.stage;S.bat.enemyXP=P2P.peer.xp||0;S.bat.enemyWins=P2P.peer.wins||0;S.bat.enemyLosses=P2P.peer.losses||0;S.bat.enemyDisc=P2P.peer.disc||0;S.bat.enemyLevel=P2P.peer.level||1;S.bat.enPower=P2P.peer.power||1;S.bat.enMax=P2P.peer.maxHP||6;S.bat.enHP=S.bat.enMax;} showP2PRoom();}
    else if(m.type==='ready'){P2P.peerReady=true; if(!S.battle) { toast('Opponent ready'); }}
    else if(m.type==='lock'){P2P.peerLocked=true; if(S.battle&&S.bat&&S.bat.kind==='p2p'){S.bat.peerLocked=true; S.bat.log='OPPONENT LOCKED';}}
    else if(m.type==='start'){if(!S.battle) startP2PBattle(); if(S.battle&&S.bat&&S.bat.kind==='p2p'){S.bat.phase='inspect';S.bat.phaseUntil=Date.now()+2800;S.bat.order=null;S.bat.charge=0;S.bat.peerAction=null;S.bat.sentAction=false;S.bat.log='ROUND 1 — ORDER!';}}
    else if(m.type==='action'){if(S.battle&&S.bat&&S.bat.kind==='p2p'){S.bat.peerAction=m.action||{order:'attack',charge:0}; S.bat.log='OPPONENT READY';}}
    else if(m.type==='forfeit'){if(S.battle&&S.bat&&S.bat.kind==='p2p'){S.bat.won=true; S.bat.phase='end'; S.bat.phaseUntil=Date.now()+900; S.bat.log='OPPONENT FORFEIT!';}}
    else if(m.type==='room_full'){toast('Room is full');closeP2P();}
    else if(m.type==='opponent_left'){toast('Opponent left the room'); if(S.battle&&S.bat&&S.bat.kind==='p2p'){closeP2PBattle(true);} else closeP2P();}
  };
  P2P.socket.onerror=()=>{toast('P2P connection failed');closeP2P();};
  P2P.socket.onclose=()=>{P2P.connected=false;};
  return true;
}
function showP2PRoom(){
  const extra=document.getElementById('overlay-extra'); if(!extra)return;
  const waiting=!P2P.peer;
  extra.innerHTML='<p><strong>ROOM '+P2P.room+'</strong></p>' + (waiting?'<p style="font-size:12px">Share this 6-character room code. Waiting for your opponent...</p>':'<p style="font-size:12px">Opponent connected: <strong>'+String(P2P.peer.name||'Rival')+'</strong></p>') + '<div class="btn-row"><button onclick="window.startP2PMatch()">'+(waiting?'WAITING...':'START P2P BATTLE')+'</button><button onclick="window.leaveP2PRoom()">LEAVE</button></div>';
  show('P2P BATTLE','Real-time friend room'); document.getElementById('obtn').style.display='none';
}
function createP2PRoom(){ toast('P2P rooms are off — use Battle Friend with a code'); }
function joinP2PRoom(){ toast('P2P rooms are off — use Battle Friend with a code'); }
function leaveP2PRoom(){ closeP2P(); if(S.battle&&S.bat&&S.bat.kind==='p2p'){S.battle=false;S.bat=null;S.battleLocked=false;} showConnectMenu(); }
function startP2PMatch(){ if(!P2P.peer){toast('Waiting for opponent');return;} const block=canBattle(); if(block){toast(block);beep(160,0.08);return;} P2P.ready=true; p2pSend({type:'ready'}); showP2PRoom(); toast('Ready — waiting for your opponent'); }
function startP2PBattle(){
  hide(); const me=p2pPetCard(), en=P2P.peer; if(!en){toast('Waiting for opponent');return;}

const actx = new (window.AudioContext || window.webkitAudioContext)();
function wakeAudio() {

function beep(f=440, d=0.07, t='square', v=0.07) {
  if (!S.sound) return;

  if (now - S.lastBeep < 50) return;
  S.lastBeep = now;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = t; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
    o.stop(actx.currentTime + d);
  } catch(e){}
}

function melody(notes) {

    for (const [f, d] of notes) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + d + 0.02);
      t += d + 0.02;
    }
  } catch(e) {}
}

async function subscribeWebPush() {

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

        bob = (Math.sin(f * 0.05) > 0) ? 0 : 1; // calm elder
      } else {
        if (f % 100 < 45) shift = (Math.floor(f / 25) % 2 === 0) ? 1 : 0;
        if (f % 200 < 10) bob = 2;
      }
    }
    if (S.happy >= 3 && S.hunger >= 3 && f % 160 < 5) bob = 2;
    }
  } else if (S.battle && !S.sleep && S.stage !== 'egg' && S.stage !== 'dead') {
    // Fighting stance — hop + sidestep so neither pal looks frozen
    bob = (Math.sin(f * 0.2) > 0) ? 1 : 0;
    if (f % 28 < 4) bob = 2;
    shift = (Math.floor(f / 16) % 2 === 0) ? 2 : -2;
  }

  // Low energy slump when hearts low
  const lowEnergy = !S.sleep && !S.game && !a && (S.hunger <= 1 || S.happy <= 1);
  if (lowEnergy) {
    bob = 2; // sit lower — no fractional scale (keeps pixels crisp)
  }

  // Occasional head tilt when idle and content
  if (!S.game && !a && !S.sleep && S.stage !== 'egg' && S.stage !== 'dead' && S.happy >= 3 && S.hunger >= 2) {
    if (!S.tiltTimer && Math.random() < 0.002) S.tiltTimer = f + 40;
    if (S.tiltTimer && f < S.tiltTimer) shift = (S.tiltTimer - f) > 20 ? 2 : -2;
    else S.tiltTimer = 0;
  }

  if (S.game && S.gameType === 'look') {
    // Wander, then lock. Body may lean the WRONG way — trust the pupils.
    const settled = !S._lookSettleAt || Date.now() >= S._lookSettleAt;
    if (!settled) {
      shift = (Math.sin(f * 0.28) > 0) ? 6 : -6;
      bob = (f % 8 < 4) ? 1 : 0;
    } else {
      const bd = (S._lookBodyDir != null) ? S._lookBodyDir : S.gameDir;
      shift = bd === 0 ? -10 : 10;
      bob = (Math.sin(f * 0.16) > 0) ? 1 : 0;
    }
  } else if (S.game && S.gameType === 'memory') {
    // Memory: pet stays mostly center; side labels teach the sequence
    bob = (Math.sin(f * 0.15) > 0) ? 1 : 0;
    if (S.memPhase === 'show') shift = S.gameDir === 0 ? -6 : 6;
  } else if (S.game && S.gameType === 'train') {
    bob = S.trainPhase === 'go' ? ((f % 6 < 3) ? 2 : 0) : ((Math.sin(f * 0.12) > 0) ? 1 : 0);
  }

  // ---- Animation poses ----
  if (a === 'eat') {
    // Gentle chew hop — no squash (squash looked like bending over)
    bob = (f % 10 < 5) ? 1 : 0;
    scaleY = 1;
    scaleX = 1;
  } else if (a === 'clean') {
    shift = Math.sin(f * 0.25) * 3;
    if (f % 6 === 0) spawnFx('bubble', cx, cy - 10, 1);
  } else if (a === 'happy' || a === 'joy') {
    bob = (f % 12 < 6) ? 2 : 0; // small hop, not a bounce-squash
    if (f % 10 === 0) spawnFx('heart', cx, cy - 18, 1);
    if (a === 'joy' && f % 8 === 0) spawnFx('star', cx, cy - 20, 1);
  } else if (a === 'dance') {
    shift = Math.sin(f * 0.3) * 5;
    bob = (f % 10 < 5) ? 2 : 0;
    if (f % 10 === 0) spawnFx('heart', cx, cy - 18, 1);
  } else if (a === 'sulk') {
    bob = 2; // slight sit
    scaleY = 1;
    shift = Math.sin(f * 0.05) * 1;
  } else if (a === 'evo') {
    bob = (f % 8 < 4) ? 2 : 0;
    scaleY = 1;
    scaleX = 1;
    shift = Math.sin(f * 0.4) * 3;
    if (f % 5 === 0) spawnFx('star', cx, cy - 12, 2);
  } else if (a === 'grow') {
    bob = (f % 10 < 5) ? 1 : 0;
    scaleY = 1;
    scaleX = 1;
  } else if (a === 'disc') {
    shift = (f % 10 < 5) ? -3 : 3; // head shake
  } else if (a === 'refuse') {
    shift = (f % 8 < 4) ? -4 : 4;
  } else if (a === 'sick' || (S.sick && !a && !S.sleep)) {
    shift = Math.sin(f * 0.45) * 2; // shiver
    bob = 0;
  } else if (a === 'poop') {
    bob = 3; // mild squat
    scaleY = 1;
    scaleX = 1.05;
  } else if (a === 'yawn') {
    bob = 0;
    scaleY = 1;
  } else if (a === 'wake') {
    bob = (f % 12 < 6) ? 1 : 0;
    scaleY = 1;
  } else if (a === 'call') {
    // Attention hop — vertical only, no squash
    bob = (f % 14 < 7) ? 3 : 0;
    shift = 0;
    scaleY = 1;
  } else if (a === 'wave') {
    shift = Math.sin(f * 0.3) * 4;
    bob = (f % 12 < 6) ? 1 : 0;
  } else if (a === 'marry') {
    bob = Math.abs(Math.sin(f * 0.25)) * 3;
    if (f % 6 === 0) spawnFx('heart', cx, cy - 16, 2);
  } else if (a === 'death') {
    bob = -Math.min(40, (Date.now() - (S.animTimer - 2500)) / 50); // rise up
  } else if (a === 'hatch') {
    shift = Math.sin(f * 0.6) * 4; // egg shake
    bob = (f % 10 < 5) ? 1 : 0;
  } else if (eyesClosed && S.sleep) {
    bob = (Math.sin(f * 0.02) > 0) ? 0 : 1;
  }

  // Idle wander — main screen only; avoid poop piles (classic)
  if (!S.battle && !S.game && !a && S.stage !== 'egg' && S.stage !== 'dead' && !S.sleep) {
    const spots = S.poopSpots || (S.poop ? [S.poopX || 180] : []);
    const blocked = (x) => spots.some(p => Math.abs(x - p) < 18);
    if (Math.abs(S.petX - S.petTargetX) < 2) {
      if (Math.random() < 0.006) {
        let tries = 0, tx = 50 + Math.random() * 140;
        while (blocked(tx) && tries++ < 8) tx = 50 + Math.random() * 140;
        // If floor is full of poop, pet is trapped → stay put (miserable)
        if (blocked(tx) && (S.poopCount || 0) >= 4) {
          S.petTargetX = S.petX;
        } else {
          S.petTargetX = blocked(tx) ? S.petX : tx;
        }
      }
    } else {
      const step = (lowEnergy || (S.poopCount || 0) >= 3) ? 0.12 : 0.3;
      const next = S.petX + Math.sign(S.petTargetX - S.petX) * step;
      if (!blocked(next)) S.petX = next;
      else S.petTargetX = S.petX; // stop at pile edge
    }
    cx = S.petX;
  }

  ctx.save();
  ctx.translate(Math.round(cx + shift), Math.round(cy + bob));
  // NEVER use fractional ctx.scale — it blurs/ghosts pixel art on mobile.
  // Size differences come from sprite shapes (baby vs adult fillCirc), not canvas scale.
  scaleX = 1;
  scaleY = 1;

  // Mouth style: care state faces (hungry / dirty / sick / happy)
  // Care faces suppressed during minigames/battles so poop doesn't force a sad face mid-game
  const busyPlay = S.game || S.battle;
  const faceHungry = !busyPlay && !S.playResult && S.hunger <= 1 && !S.sick && !S.sleep;
  const faceDirty = !busyPlay && !S.playResult && S.poop && !S.sick && !S.sleep;
  const faceSick = !busyPlay && (S.sick || S.anim === 'sick');
  const happyMouth = S.playResult === 'happy' || S.anim === 'happy' || S.anim === 'joy' || S.anim === 'dance' ||
    (!S.playResult && !faceHungry && !faceDirty && !faceSick && S.happy >= 3 && !S.sleep);
  const sadMouth = S.playResult === 'sad' || S.anim === 'sad' || S.anim === 'sulk' || faceHungry || faceDirty ||
    (!busyPlay && !S.playResult && S.happy <= 1 && !S.sleep && !faceSick);

  // ========== DISTINCT SPRITES PER FORM ==========
  if (form === 'egg') {
    // Classic spotted egg
    for (let y = -16; y <= 14; y++) {
      const w = Math.floor(8 + (16 - Math.abs(y)) * 0.42);
      for (let x = -w; x <= w; x++) {
        if ((x*x)/(w*w) + (y*y)/256 < 1.0) px(x, y, INK);
      }
    }
    // spots
    px(-4, -6, BG); px(5, -2, BG); px(-2, 4, BG); px(3, 8, BG);
    // Hatch cracks
    if (S.anim === 'hatch') {
      px(-2, -8, BG); px(-1, -7, BG); px(0, -6, BG); px(1, -5, BG);
      px(2, -4, BG); px(1, -3, BG); px(0, -2, BG);
      px(-6, 0, BG); px(-5, 1, BG); px(-4, 2, BG);
      px(5, 2, BG); px(6, 3, BG); px(7, 4, BG);
      // little star burst
      if (f % 8 < 4) {
        px(0, -20, BG); px(-12, -10, BG); px(12, -10, BG);
      }
    }
  }
  else if (form === 'dead') {
    // Angel spirit with halo
    fillCirc(0, 4, 13, INK);
    // wings grow from the shoulders
    for (let i = 0; i < 6; i++) {
      px(-13 - i, 2 - i, INK); px(-12 - i, 3 - i, INK);
      px(13 + i, 2 - i, INK); px(12 + i, 3 - i, INK);
    }
    // halo
    for (let a = 0; a < 12; a++) {
      const ang = a / 12 * Math.PI * 2;
      px(Math.round(Math.cos(ang)*10), -16 + Math.round(Math.sin(ang)*2), INK);
    }
  }
  else {
    // --- BODY shapes (unique per form) ---
    // growthPhase 0..3 = fills out + gains detail within stage
    // Keep YOUR pet's growth in battles; rivals use their stored growth
    let g = 0;
    if (form !== 'egg' && form !== 'dead') {
      if (S._rivalDraw && S.bat) {
        g = Math.min(3, S.bat.enemyGrowth || 0);
      } else {
        g = Math.min(3, S.growthPhase || 0);
      }
    }
    let mid = S.morphId || 0;
    if (S._morphDraw != null) mid = S._morphDraw;
    else if (S.battle && S.bat && form === S.bat.enemyForm && form !== S.form && S.bat.enemyMorph != null) mid = S.bat.enemyMorph;
    if (form === 'baby') {
      // Nugget → chubby baby with feet/arms as it grows
      const r = 10 + g;
      fillCirc(0, 2, r, INK);
      if (g >= 2) { fillRect(-5, r + 1, 3, 3, INK); fillRect(3, r + 1, 3, 3, INK); }
      if (g >= 3) { px(-2, -r + 2, BG); px(2, -r + 2, BG); } // tiny brow nubs
    } else if (form === 'child') {
      const r = 13 + g;
      fillCirc(0, 1, r, INK);
      fillCirc(-r + 5, -r + 2, 3 + (g > 1 ? 1 : 0), INK);
      fillCirc(r - 5, -r + 2, 3 + (g > 1 ? 1 : 0), INK);
      if (g >= 1) { fillRect(-6, r, 4, 3, INK); fillRect(3, r, 4, 3, INK); }
      if (g >= 3) { px(0, -r - 1, INK); px(-1, -r, INK); px(1, -r, INK); } // little tuft
    } else if (form === 'teenGood') {
      const r = 14 + g;
      fillCirc(0, 0, r, INK);
      // Hair tuft grows from the crown (not floating above)
      const crown = -r + 1;
      for (let i = -6; i <= 6; i += 2) px(i, crown, INK);
      px(0, crown - 2, INK); px(-2, crown - 1, INK); px(2, crown - 1, INK);
      if (g >= 1) { fillRect(-7, r - 1, 4, 3, INK); fillRect(4, r - 1, 4, 3, INK); }
      if (g >= 3) { px(-3, -r + 4, BG); px(3, -r + 4, BG); } // cheek shine
    } else if (form === 'teenBad') {
      const r1 = 12 + g, r2 = 10 + g;
      fillCirc(-3, 1, r1, INK);
      fillCirc(5, 3, r2, INK);
      // Horns grow from the head, not floating above
      px(-3 - r1 + 2, 1 - r1 + 1, INK); px(-3 - r1 + 1, 1 - r1, INK); px(-3 - r1, 1 - r1 - 1, INK);
      px(5 + r2 - 2, 3 - r2 + 1, INK); px(5 + r2 - 1, 3 - r2, INK); px(5 + r2, 3 - r2 - 1, INK);
      if (g >= 1) { fillRect(-8, r1 + 2, 4, 3, INK); fillRect(5, r1 + 2, 4, 3, INK); }
      if (g >= 3) { px(-5, -2, BG); px(6, 0, BG); }
      fillRect(-5, 8, 10, 3, BG);
    } else if (form === 'adult1') {
      // Momo — best care, round with side fins/ears
      fillCirc(0, 1, 16, INK);
      fillRect(-22, -10, 6, 12, INK); fillRect(16, -10, 6, 12, INK);
      // little feet
      fillRect(-8, 16, 5, 3, INK); fillRect(4, 16, 5, 3, INK);
    } else if (form === 'adult2') {
      // Kiko — pointed ears, leaner
      fillCirc(0, 1, 15, INK);
      // triangle ears rooted on the crown (integer pixels)
      for (let i = 0; i < 8; i++) {
        px(-11 + Math.floor(i / 2), -13 - i, INK); px(-10 + Math.floor(i / 2), -13 - i, INK);
        px(11 - Math.floor(i / 2), -13 - i, INK); px(10 - Math.floor(i / 2), -13 - i, INK);
      }
      fillRect(-7, 15, 4, 3, INK); fillRect(4, 15, 4, 3, INK);
    } else if (form === 'adult3') {
      // Taro — wide hat/head band
      fillCirc(0, 2, 16, INK);
      fillRect(-14, -12, 28, 8, INK);
      px(-14, -13, INK); px(13, -13, INK);
      fillRect(-8, 16, 5, 3, INK); fillRect(4, 16, 5, 3, INK);
    } else if (form === 'adult4') {
      // Poko — chubby with belly mark
      fillCirc(0, 2, 18, INK);
      fillCirc(0, 6, 10, BG);
      px(-6, 5, INK); px(6, 5, INK);
      fillRect(-9, 18, 6, 3, INK); fillRect(4, 18, 6, 3, INK);
    } else if (form === 'adult5') {
      // Nori — tall stacked / caterpillar-ish
      fillCirc(0, -10, 10, INK);
      fillCirc(0, 0, 12, INK);
      fillCirc(0, 10, 11, INK);
      fillRect(-6, 20, 4, 3, INK); fillRect(3, 20, 4, 3, INK);
    } else if (form === 'adult6') {
      // Zuzu — neglected, flat wide + heavy brow
      fillCirc(0, 4, 17, INK);
      fillRect(-12, -6, 24, 5, INK);
      fillRect(-10, 18, 7, 3, INK); fillRect(4, 18, 7, 3, INK);
    } else if (form === 'adult7') {
      // Nova — rare perfect-care star form
      fillCirc(0, 2, 15, INK);
      // Short spikes grow from the body surface (not floating points)
      for (let i = 0; i < 8; i++) {
        const ang = i * Math.PI / 4;
        const x0 = Math.round(Math.cos(ang) * 15);
        const y0 = Math.round(2 + Math.sin(ang) * 15);
        const x1 = Math.round(Math.cos(ang) * 18);
        const y1 = Math.round(2 + Math.sin(ang) * 18);
        px(x0, y0, INK); px(x1, y1, INK);
      }
      fillRect(-7, 16, 4, 3, INK); fillRect(4, 16, 4, 3, INK);
    } else if (form === 'adult8') {
      // Bibi — disciplined little horned form
      fillCirc(0, 2, 14, INK);
      for (let i = 0; i < 7; i++) {
        px(-10+i, -12-i, INK); px(10-i, -12-i, INK);
      }
      fillRect(-9, 15, 5, 3, INK); fillRect(4, 15, 5, 3, INK);
    } else if (form === 'adult9') {
      // Rin — sleek athletic (good care + play/train heavy)
      fillCirc(0, 0, 14, INK);
      fillRect(-18, 0, 6, 3, INK); px(-19, 3, INK);
      fillRect(12, 0, 6, 3, INK); px(18, 3, INK);
      px(-8, -14, INK); px(8, -14, INK);
      fillRect(-6, 14, 4, 3, INK); fillRect(3, 14, 4, 3, INK);
    } else if (form === 'adult10') {
      // Bolt — battle-hardened spiky adult
      fillCirc(0, 1, 15, INK);
      px(0, -15, INK); px(0, -17, INK); px(-1, -16, INK); px(1, -16, INK);
      fillRect(-8, 15, 5, 3, INK); fillRect(4, 15, 5, 3, INK);
    } else if (form === 'secret') {
      // Elder — dignified with staff-like marks and beard
      fillCirc(0, 0, 16, INK);
      fillRect(-6, 8, 12, 6, INK); // beard
      px(-12, -12, INK); px(12, -12, INK);
      px(-14, -8, INK); px(14, -8, INK);
      // tiny crown sitting on the head
      fillRect(-5, -16, 11, 2, INK);
      px(-4, -17, INK); px(0, -18, INK); px(4, -17, INK);
    } else {
      fillCirc(0, 0, 16, INK);
    }

    drawMorphTail(form, mid, g, INK);
    drawMorphHead(form, mid, g, INK, BG);
    drawPetArms(form, g, f, INK);

    // Face — sockets + pupils + a thick readable mouth, placed on THIS body
    if (form !== 'dead') {
      const metF = formMetrics(form, g);
      const ey = metF.faceY;
      const sockW = form === 'baby' ? 6 : 7;
      const sockH = form === 'baby' ? 5 : 6;
      const eyeL = -sockW - 1;
      const eyeR = 2;
      if (eyesClosed) {
        fillRect(eyeL, ey + 2, sockW, 2, BG);
        fillRect(eyeR, ey + 2, sockW, 2, BG);
      } else if (!blink) {
        fillRect(eyeL, ey, sockW, sockH, BG);
        fillRect(eyeR, ey, sockW, sockH, BG);

        let lookX = 0, lookY = 0;
        const glanceSeed = ((form || '').length * 5 + (S._morphDraw || 0) * 3) | 0;
        const lookCycle = Math.floor((f + glanceSeed) / 16) % 16;

        if (S.game && S.gameType === 'look') {
          const settled = !S._lookSettleAt || Date.now() >= S._lookSettleAt;
          if (!settled) {
            const t = Math.floor(f / 7) % 6;
            if (t === 0) lookX = -2;
            else if (t === 1) lookX = 2;
            else if (t === 2) { lookX = 0; lookY = -1; }
            else if (t === 3) lookX = -2;
            else if (t === 4) lookX = 1;
            else { lookX = 0; lookY = 1; }
          } else {
            lookX = (S.gameDir === 0) ? -2 : 2;
            lookY = 0;
          }
        } else if (S.game && S.gameType === 'memory' && S.memPhase === 'show') {
          lookX = (S.gameDir === 0) ? -2 : 2;
        } else if (S.game || S.battle) {
          if (lookCycle <= 2) lookX = -2;
          else if (lookCycle <= 4) lookX = -1;
          else if (lookCycle <= 6) lookX = 0;
          else if (lookCycle <= 8) lookX = 2;
          else if (lookCycle <= 10) lookX = 1;
          else if (lookCycle === 11) { lookX = 0; lookY = -1; }
          else if (lookCycle === 12) { lookX = -1; lookY = 1; }
          else if (lookCycle === 13) lookX = 2;
          else lookX = 0;
        } else if (S.poop) {
          lookX = (S.poopX > (S.petX || 120)) ? 2 : -2;
          lookY = 1;
        } else if (S.call || S.lightsMissPending) {
          lookX = 2; lookY = -1;
        } else if (S.hunger <= 1 || S.happy <= 1) {
          lookY = 1;
          lookX = (lookCycle < 8) ? -2 : 2;
        } else {
          if (lookCycle <= 3) lookX = -2;
          else if (lookCycle <= 5) lookX = 0;
          else if (lookCycle <= 9) lookX = 2;
          else if (lookCycle === 10) lookY = -1;
          else if (lookCycle === 11) { lookX = 1; lookY = 1; }
          else lookX = 0;
        }

        const maxLX = sockW - 4;
        const lx = Math.max(-2, Math.min(maxLX, lookX));
        const ly = Math.max(0, Math.min(sockH - 3, lookY + 1));
        fillRect(eyeL + 2 + lx, ey + ly, 2, 2, INK);
        fillRect(eyeR + 2 + lx, ey + ly, 2, 2, INK);
      }

      // Tiny nose cut-out between the eyes
      px(0, ey + sockH, BG);

      const my = metF.mouthY;
      if (S.anim === 'yawn' || S.anim === 'eat') {
        fillRect(-3, my, 7, 5, BG);
        px(-2, my + 1, INK); px(0, my + 2, INK); px(2, my + 1, INK);
      } else if (eyesClosed && S.sleep) {
        fillRect(-3, my + 1, 7, 2, BG);
      } else if (!eyesClosed) {
        if (faceSick) {
          fillRect(-4, my + 1, 3, 2, BG);
          fillRect(-1, my + 3, 3, 2, BG);
          fillRect(2, my + 1, 3, 2, BG);
        } else if (happyMouth) {
          fillRect(-4, my, 2, 2, BG);
          fillRect(-2, my + 2, 5, 2, BG);
          fillRect(3, my, 2, 2, BG);
        } else if (faceHungry) {
          // Hungry = small pleading frown, not a giant open hole
          fillRect(-4, my + 2, 2, 2, BG);
          fillRect(-2, my, 5, 2, BG);
          fillRect(3, my + 2, 2, 2, BG);
          fillRect(-1, my + 3, 3, 2, BG);
        } else if (sadMouth || faceDirty || S.anim === 'sulk') {
          fillRect(-4, my + 2, 2, 2, BG);
          fillRect(-2, my, 5, 2, BG);
          fillRect(3, my + 2, 2, 2, BG);
        } else {
          fillRect(-3, my + 1, 7, 2, BG);
        }
      }
    }
  }

  // Action props — richer classic-style feedback
  if (S.anim === 'eat') {
    // Food morsel near mouth (side), not above head
    const chew = (f % 10 < 5);
    px(12, 2, INK); px(13, 2, INK); px(14, 3, INK); // food bit by mouth
    if (chew) {
      px(-2, 4, BG); px(-1, 5, BG); px(0, 5, BG); px(1, 5, BG); px(2, 4, BG); // open mouth
    }
  }
  if (S.sick || S.anim === 'sick') {
    // Small skull / cross mark
    fillCirc(20, -14, 3, INK);
    px(20, -14, BG);
    px(18, -11, INK); px(22, -11, INK);
  }
  // Wave is drawn as a raised right arm in drawPetArms — no extra floating pixels
  // Call ! beside head (not a long streak)
  if (S.anim === 'call' || (S.call && !S.sleep && !S.anim)) {
    px(15, -16, INK); px(15, -14, INK); px(15, -12, INK);
    px(15, -9, INK);
  }
  // Zzz only when actually sleeping or yawning — never during poop
  if ((S.sleep || S.anim === 'yawn') && S.anim !== 'poop') {
    const z = Math.floor((f % 48) / 16);
    for (let k = 0; k <= z; k++) {
      const zx = 12 + k * 5;
      const zy = -14 - k * 5;
      px(zx, zy, INK); px(zx+1, zy, INK); px(zx+2, zy, INK); px(zx+3, zy, INK);
      px(zx+3, zy+1, INK);
      px(zx+2, zy+2, INK);
      px(zx+1, zy+3, INK);
      px(zx, zy+4, INK); px(zx+1, zy+4, INK); px(zx+2, zy+4, INK); px(zx+3, zy+4, INK);
    }
  }

  ctx.restore();

  // Poop piles only on main home — fill the floor as stacks grow (classic)
  if (S.poop && !S.game && !S.battle && form !== 'egg' && form !== 'dead' && S.anim !== 'poop') {
    const BG2 = '#9bbc0f';
    const py0 = S.poopY || 145;
    const spots = (S.poopSpots && S.poopSpots.length) ? S.poopSpots : [S.poopX || 180];
    const n = Math.max(spots.length, Math.min(4, S.poopCount || 1));
    for (let s = 0; s < n; s++) {
      const ox = spots[s] !== undefined ? spots[s] : (50 + s * 45);
      fillCirc(ox, py0 + 1, 5, INK);
      fillCirc(ox - 4, py0 + 2, 3, INK);
      fillCirc(ox + 4, py0 + 2, 3, INK);
      fillCirc(ox - 1, py0 - 3, 4, INK);
      fillCirc(ox, py0 - 7, 3, INK);
      px(ox - 2, py0 - 4, BG2);
      px(ox + 1, py0 - 8, BG2);
    }
  }
}

function drawModeStrip() {
  // Small selected-mode icon strip at bottom of LCD (classic feel)
  const INK = '#0f380f';
  const labels = ['ST','FD','PL','CL','MD','LT','CN','DS'];
  const x0 = 8;
  const y = H - 12;
  for (let i = 0; i < labels.length; i++) {
    const x = x0 + i * 29;
    if (i === S.sel) {
      fillRect(x - 2, y - 2, 26, 11, INK);
      drawText(labels[i], x + 2, y, '#9bbc0f');
    } else {
      drawText(labels[i], x + 2, y, INK);
    }
  }
}

function drawMain() {
  const night = isNightTime();
  const lcdBg = night ? '#8fad0e' : '#9bbc0f';
  ctx.fillStyle = lcdBg;
  ctx.fillRect(0, 0, W, H);
  if (!S.paused) S.frame++;

  const INK = '#0f380f';

  // --- TOP LEFT: Hunger + Happy ---
  drawText('HUNGER', 4, 3, INK);
  drawHeartsRow(48, 2, S.hunger);
  drawText('HAPPY', 4, 14, INK);
  drawHeartsRow(48, 13, S.happy);

  // Under Happy: evolution stage + name + mood
  const stageLabel = (S.stage || '').toUpperCase();
  const nm = displayName(S).toUpperCase().slice(0, 6);
  drawText(stageLabel + ' ' + nm, 4, 26, INK);
  // One-line mood
  let mood = 'OK';
  if (S.stage === 'dead') mood = 'GONE';
  else if (S.sleep) mood = 'ASLEEP';
  else if (S.injured && S.sick) mood = 'INJURED';
  else if (S.sick) mood = 'SICK';
  else if ((S.poopCount || 0) >= 4) mood = 'TRAPPED';
  else if ((S.poopCount || 0) >= 2 || S.poop) mood = 'DIRTY';
  else if (S.hunger <= 0) mood = 'STARVING';
  else if (S.hunger <= 1) mood = 'HUNGRY';
  else if (S.happy <= 0) mood = 'MISERY';
  else if (S.happy <= 1) mood = 'SAD';
  else if (S.happy >= 4 && S.hunger >= 3) mood = 'JOY';
  else if (S.happy >= 3 && S.hunger >= 2) mood = 'HAPPY';
  else if (S.call) mood = 'CALLING';
  drawText(mood, 4, 37, INK);

  // --- TOP MIDDLE: weight / discipline / age / battle XP ---
  drawText('WT ' + (S.weight || 0) + 'G', 100, 3, INK);
  drawText('DISC ' + (S.disc || 0) + '%', 100, 14, INK);
  drawText('AGE ' + S.age, 100, 26, INK);
  drawText('LV ' + battleLevel(S.battleXP) + '  PWR ' + battlePower(), 100, 37, INK);

  // --- TOP RIGHT: Gen above Friends, then clock, sun/moon ---
  let h12 = S.virtualHour % 12;
  if (h12 === 0) h12 = 12;
  const ampm = S.virtualHour < 12 ? 'AM' : 'PM';
  const clock = h12 + ':' + S.virtualMin.toString().padStart(2,'0') + ampm;
  const genStr = 'GEN ' + (S.generation || 1);
  const frStr = 'FR ' + ((S.friends && S.friends.length) || 0);
  const CW = 6; // must match drawText advance
  const rightPad = 4;
  drawText(genStr, W - rightPad - genStr.length * CW, 3, INK);
  drawText(frStr, W - rightPad - frStr.length * CW, 14, INK);
  drawText(clock, W - rightPad - clock.length * CW, 25, INK);
  // Sun / Moon under clock
  const sunX = W - 14;
  if (night) {
    fillCirc(sunX, 42, 5, INK);
    fillCirc(sunX + 3, 40, 4, lcdBg);
  } else {
    fillCirc(sunX, 42, 3, INK);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      px(sunX + Math.round(Math.cos(a) * 6), 42 + Math.round(Math.sin(a) * 6), INK);
    }
  }

  // Attention / call icon — bottom-left of pet area
  if ((S.call || S.lightsMissPending || S.poop) && !S.sleep) {
    fillRect(6, 128, 16, 16, INK);
    fillRect(8, 130, 12, 12, lcdBg);
    px(13, 132, INK); px(13, 133, INK); px(13, 134, INK); px(13, 135, INK);
    px(13, 138, INK);
  }

  drawPet(S.petX || 120, 100, S.form, S.frame);
  drawFx();

  if (S.sleep) {
    const z = Math.floor(S.frame / 16) % 3;
    drawText('Z'.repeat(z + 1), 150, 58 - z * 3, INK);
  }

  drawModeStrip();

  if (S.paused) {
    fillRect(72, 72, 96, 24, INK);
    drawText('PAUSED', 102, 80, lcdBg);
  }
}

function nextEvoHint() {
  if (S.stage === 'egg') return 'WAIT TO HATCH';
  if (S.stage === 'baby') return 'CHILD (TIME)';
  if (S.stage === 'child') return S.age >= 2 ? 'READY FOR TEEN' : ('NEED AGE 2 NOW ' + S.age);
  if (S.stage === 'teen') return S.age >= 5 ? 'READY FOR ADULT' : ('NEED AGE 5 NOW ' + S.age);
  if (S.stage === 'adult') {
    if ((S.form === 'adult1' || S.form === 'adult3' || S.form === 'adult7' || S.form === 'adult10') && S.disc >= 75 && S.age >= 12) return 'SECRET READY';
    return 'FULLY GROWN';
  }
  if (S.stage === 'dead') return '---';
  return '';
}
function drawStatus() {
  ctx.fillStyle = '#9bbc0f';
  ctx.fillRect(0, 0, W, H);
  const timeStr = (() => { let h=S.virtualHour%12; if(h===0)h=12; return h+':'+S.virtualMin.toString().padStart(2,'0')+(S.virtualHour<12?'AM':'PM'); })();
  let state = 'AWAKE';
  if (S.paused) state = 'PAUSED';
  else if (S.stage === 'dead') state = 'RETURNED';
  else if (S.sleep) state = 'SLEEPING';
  else if (isNightTime()) state = 'NIGHT';
  const flags = [
    S.sick ? 'SICK' : null,
    S.poop ? 'DIRTY' : null,
    S.call ? 'CALLING' : null,
    !S.lights ? 'LIGHTS OFF' : null,
    S.married ? 'PARENT' : null,
    S.battle ? 'IN BATTLE' : null
  ].filter(Boolean).join(' ') || 'OK';
  const lines = [
    displayName(S) + ' ' + speciesTag(ensureMorph(S)) + ' · ' + formTrait(S.form),
    (S.stage||'').toUpperCase() + ' ' + (NAMES[S.form]||'') + ' GEN' + S.generation,
    'AGE ' + S.age + '  WT ' + S.weight + 'G  LV ' + battleLevel(S.battleXP),
    'HUN ' + S.hunger + '/4  HAP ' + S.happy + '/4  DISC ' + (S.disc || 0) + '%',
    'PALS ' + speciesSeenCount() + '/' + SPECIES_COUNT + '  FAMILY ' + ((S.petFamily&&S.petFamily.length)||0),
    'STREAK ' + (S.careStreak || 0) + 'D  BATTLE ' + (S.battleWins||0) + 'W-' + (S.battleLosses||0) + 'L',
    'NEXT ' + nextEvoHint(),
    'CODE ' + (S.myCode || '---') + '  FR ' + ((S.friends && S.friends.length)||0),
    'TIME ' + timeStr + '  8PM-8AM',
    'ALERTS ' + (S.notifications?'ON':'OFF') + '  LIGHTS ' + (S.lights?'ON':'OFF'),
    state + (flags && flags !== 'OK' ? ' ' + flags : '')
  ];
  lines.forEach((l, i) => drawText(String(l).slice(0, 38), 4, 3 + i * 16, '#0f380f'));
}

function drawGame() {
  ctx.fillStyle = '#9bbc0f';
  ctx.fillRect(0, 0, W, H);
  const INK = '#0f380f';

  // ========== TRAIN XP (timing skill — Digimon training vibe) ==========
  if (S.gameType === 'train') {
    drawTextCentered('TRAIN XP', 4, INK);
    drawTextCentered('WAIT THEN TAP', 16, INK);
    drawTextCentered(S.gScore + ' HIT  R' + S.gRound + '/3', 28, INK);
    drawPet(120, 100, S.form, S.frame);
    if (S.trainPhase === 'go') {
      if (S.trainBtn !== 'A' && S.trainBtn !== 'B') S.trainBtn = 'B';
      const letter = S.trainBtn;
      drawTextCentered('*** GO ***', 44, INK);
      drawTextCentered('PRESS ' + letter, 56, INK);
      drawTextCentered('A OR B', 150, INK);
    } else {
      drawTextCentered('WAIT FOR GO', 48, INK);
      drawTextCentered('GET READY', 150, INK);
    }
    drawTextCentered('C CANCEL', 166, INK);
    return;
  }

  // ========== MEMORY (Simon sequence — NOT the same as Look) ==========
  if (S.gameType === 'memory') {
    drawTextCentered('MEMORY', 4, INK);
    drawTextCentered('REPEAT THE ORDER', 16, INK);
    drawTextCentered('LEN ' + (S.memSeq ? S.memSeq.length : 0) + '  OK ' + S.gScore, 28, INK);
    if (S.memPhase === 'show') {
      const dir = S.memSeq[S.memIdx];
      S.gameDir = dir;
      // Big side flash only (sequence teach) — pet stays centered
      drawTextCentered('WATCH', 42, INK);
      drawTextCentered((S.memIdx + 1) + ' / ' + S.memSeq.length, 54, INK);
      if (dir === 0) {
        drawText('<<<', 16, 90, INK);
        drawText('LEFT', 16, 102, INK);
      } else {
        drawText('>>>', 190, 90, INK);
        drawText('RIGHT', 180, 102, INK);
      }
      drawPet(120, 115, S.form, S.frame);
    } else {
      // Input: no spoilers, centered pet, player must remember
      drawTextCentered('YOUR TURN', 42, INK);
      drawTextCentered('STEP ' + (S.memIdx + 1) + '/' + S.memSeq.length, 54, INK);
      drawPet(120, 110, S.form, S.frame);
      drawTextCentered('A LEFT   B RIGHT', 152, INK);
    }
    drawTextCentered('C CANCEL', 166, INK);
    return;
  }

  // ========== LOOK (classic Tamagotchi — guess facing, one shot per round) ==========
  // Completely different: no sequence, no GO timing — just read the pet once
  drawTextCentered('LOOK', 4, INK);
  drawTextCentered('WHICH WAY?', 16, INK);
  drawTextCentered('R' + S.gRound + '/5  SCORE ' + S.gScore, 28, INK);
  drawPet(120, 100, S.form, S.frame);
  if (S._lookSettleAt && Date.now() < S._lookSettleAt) {
    drawTextCentered('WATCH...', 48, INK);
  } else {
    drawTextCentered('A LEFT  OR  B RIGHT', 48, INK);
  }
  drawTextCentered('C CANCEL', 166, INK);
}

function render() {
  if (S.stage === 'dead') {
    ctx.fillStyle = '#9bbc0f';
    ctx.fillRect(0, 0, W, H);
    if (S.anim === 'death') {
      // rising body before spirit form
      drawPet(120, 85, S.form === 'dead' ? 'adult1' : S.form, S.frame);
      drawText('FAREWELL...', 80, 160, '#0f380f');
    } else {
      drawPet(120, 85, 'dead', S.frame);
      drawText('RETURNED HOME', 70, 150, '#0f380f');
    }
    drawFx();
  } else if (S.menu === 'status') {
    drawStatus();
  } else if (S.battle) {
    drawBattle();
  } else if (S.game) {
    drawGame();
  } else {
    drawMain();
  }
  // Darken when lights are off
  if (!S.lights) {
    ctx.fillStyle = S.sleep ? 'rgba(0,0,0,0.55)' : 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);
  }
  // Strong pause veil
  if (S.paused && S.stage !== 'dead') {
    ctx.fillStyle = 'rgba(15,56,15,0.25)';
    ctx.fillRect(0, 0, W, H);
  }
}

function update() {
  const now = Date.now();

  // The wall clock always follows the phone, including egg/dead/paused states.
  syncDeviceClock(now);

  // Battle state machine
  if (S.battle) advanceBattle(now);

  // Training timing game
  if (S.game && S.gameType === 'train') {
    if (S.trainPhase === 'wait' && now >= (S.trainUntil || 0)) {
      S.trainPhase = 'go';
      // First cue is always B (the confirm button). Later rounds mix A/B.
      S.trainBtn = (S.gRound <= 1) ? 'B' : ((Math.random() < 0.5) ? 'A' : 'B');
      S.trainUntil = now + 2000; // 2s window — readable on a phone
      toast('PRESS ' + S.trainBtn + '!');
      beep(880, 0.06);
    } else if (S.trainPhase === 'go' && now >= (S.trainUntil || 0)) {
      S.playResult = 'sad';
      if ((S.trainOops || 0) > 0) {
        S.trainOops--;
        toast('Missed it — 1 more chance');
        S.gRound++;
        if (S.gRound > 3) endTraining(S.gScore >= 2);
        else trainNextWait(now);
      } else {
        endTraining(S.gScore >= 2);
      }
    }
  }

  // Memory game: show each step, then switch to input
  if (S.game && S.gameType === 'memory' && S.memPhase === 'show' && now > (S.memTimer || 0)) {
    // Finished displaying current step — advance
    if (S.memIdx >= S.memSeq.length - 1) {
      // Whole sequence shown
      S.memIdx = 0;
      S.memPhase = 'input';
      toast('Your turn! A=Left B=Right');
      beep(600, 0.05);
    } else {
      S.memIdx++;
      S.memTimer = now + 750;
      beep(400, 0.03);
    }
  }

  // Egg/dead states do not run the care simulation.
  if (S.stage === 'dead' || S.stage === 'egg') return;

  // True pause: freeze gameplay timers and animation state. The wall clock
  // remains the real phone time, but pause never causes sleep/care catch-up.
  if (S.paused) return;

  // Clear temporary face / anim when timer expires (except permanent sleep)
  if (S.animTimer && now > S.animTimer) {
    if (S.anim !== 'sleep') {
      // Finish poop sequence → show pile + call
      if (S.anim === 'poop' || S._pendingPoop) {
        S.poop = true;
        S.call = true;
        S._falseCall = false;
        S._pendingPoop = false;
        S.poopSince = now;
        S.poopCount = Math.min(4, (S.poopCount || 0) + 1);
        if (!S.poopSpots) S.poopSpots = [];
        S.poopSpots.push(Math.round(S.poopX || S.petX || 180));
      }
      S.anim = null;
      S.playResult = null;
      S.animTimer = 0;
    }
  }

  const d = DIFF[S.difficulty] || DIFF.realtime;
  const sp = d.timeScale || 0.15;  // higher = faster; realtime default is classic speed

  // --- Automatic sleep / wake cycle ---
  const night = isNightTime();
  // Daytime safety: clear stale bedtime flags; never stay asleep at 2pm
  if (!night) {
    if (S.lightsMissPending) S.lightsMissPending = false;
    if (S.sleep) {
      // Force wake if somehow sleeping outside night window
      S.sleep = false;
      S.lights = true;
      S.anim = 'wake';
      S.animTimer = now + 1000;
      toast('Woke up (daytime)');
      save();
    }
  }
  if (!S.sleep && night && !S.game) {
    // Pet wants to sleep
    if (!S.lightsMissPending) {
      S.lightsMissPending = true;
      S.sleepStart = now;
      S.call = true; // attention icon for "turn lights off"
      careNotify('lights', 'Needs LIGHTS OUT — turn lights OFF for sleep!');
      S.anim = 'yawn';
      S.animTimer = now + 1600;
      toast('Getting sleepy... turn lights OFF');
      beep(300, 0.12);
    } else if (now - S.sleepStart > (S.difficulty === 'realtime' ? 12*60000 : 55*1000)) {
      // realtime keeps closer to classic 15 min grace; others use short web-friendly window
      S.careMiss += d.care; rustDisc(2);
      S.lightsMissPending = false;
      S.sleep = true; // falls asleep anyway (but grumpy / lights still on)
      S.call = false;
      S.anim = 'sleep';
      S.animTimer = now + 999999;
      toast('Left lights on! Care mistake');
      beep(160, 0.15);
      save();
    }
  } else if (S.sleep && !night) {
    // Natural morning wake-up — classic Tamagotchi ages +1 day here
    S.sleep = false;
    S.lights = true;
    S.lightsMissPending = false;
    S.anim = 'wake';
    S.animTimer = now + 1400;
    S.call = false;
    // Age once per calendar morning after a night of sleep
    const dayKey = new Date(now).toDateString();
    // Also age if last age-up was more than 10 hours ago (covers edge cases)
    const longEnough = !S.lastAge || (now - S.lastAge > 10 * 3600000);
    let faded = false;
    if (S.lastAgeDay !== dayKey && (S.disc || 0) >= 35 && !S._discPracticed) {
      faded = rustDisc(4);
    }
    if (S.lastAgeDay !== dayKey) S._discPracticed = false;
    if (S.lastAgeDay !== dayKey && longEnough) {
      S.age++;
      S.lastAgeDay = dayKey;
      S.lastAge = now;
      S.anim = 'grow';
      S.animTimer = now + 1200;
      checkEvo();
      toast(faded ? ('Good morning! Age ' + S.age + ' · disc faded') : ('Good morning! Age ' + S.age));
      melWake();
    } else if (S.lastAgeDay !== dayKey) {
      // Same morning re-wake: still mark the day, soft toast
      S.lastAgeDay = dayKey;
      toast(faded ? 'Good morning · disc faded' : 'Good morning!');
      melWake();
    } else {
      toast('Good morning!');
      melWake();
    }
    S.sleptProperly = false;
    // Authentic: if poop timer was due overnight, go shortly after wake
    const d2 = DIFF[S.difficulty] || DIFF.realtime;
    const sp2 = d2.timeScale || 0.15;
    if (!S.poop && S.lastP && (now - S.lastP > 5.5 * 60000 / sp2)) {
      S._wakePoopAt = now + 4000 + Math.floor(Math.random() * 4000);
    }
    save();
  }

  // If already night and lights are off, auto-sleep cleanly
  if (night && !S.sleep && !S.lights && !S.game) {
    S.sleep = true;
    S.lightsMissPending = false;
    S.sleptProperly = true;
    S.anim = 'sleep';
    S.animTimer = now + 999999;
  }

  // While asleep — care timers freeze (no poop / hunger / false calls mid-sleep)
  // Matches classic: pet rests at night; needs resume after wake
  if (S.sleep) {
    // Keep anim locked to sleep
    if (S.anim !== 'sleep' && S.anim !== 'wake') {
      S.anim = 'sleep';
      S.animTimer = now + 999999;
    }
    return; // skip hunger/happy/poop/discipline while sleeping
  }

  if (true) {
    // Hunger drain
    if (now - S.lastH > (S.age < 1 ? 3.2 : 2.5) * 60000 / sp * d.hunger) {
      if (S.hunger > 0) {
        S.hunger--;
        if (S.hunger === 0) {
          S.call = true; S._falseCall = false;
          careNotify('hunger', 'Needs FOOD — open PocketPal and feed me!');
          S.anim = 'call'; S.animTimer = now + 1200;
        }
      } else {
        S.careMiss += d.care; rustDisc(2);
        S.call = true;
        S._falseCall = false;
        S.anim = 'call'; S.animTimer = now + 1200;
        if (Math.random() < 0.22) {
          S.sick = true; S.sickSince = now;
          careNotify('sick', 'Needs MEDICINE — open PocketPal and heal me!');
          S.anim = 'sick';
          S.animTimer = now + 2000;
          melSick();
        }
      }
      S.lastH = now;
      save();
    }

    // Happy drain
    if (now - S.lastY > (S.age < 1 ? 3.8 : 2.9) * 60000 / sp * d.happy) {
      if (S.happy > 0) {
        S.happy--;
        if (S.happy === 0) {
          S.call = true; S._falseCall = false;
          careNotify('happy', 'Needs PLAY — open PocketPal and play with me!');
          S.anim = 'call'; S.animTimer = now + 1200;
        }
      } else {
        S.careMiss += d.care; rustDisc(2);
        S.call = true;
        S._falseCall = false;
        S.anim = 'call'; S.animTimer = now + 1200;
      }
      S.lastY = now;
      save();
    }

    // Soft injury recovery over time (slow natural heal if not critical)
    if (S.sick && S.sickSince && now - S.sickSince > 25 * 60000 / sp) {
      // ~25 min realtime-scaled without meds — chance to improve
      if (S.hunger >= 2 && S.happy >= 1 && !S.poop && Math.random() < 0.15) {
        S.sick = false;
        S.sickSince = 0;
        S.injured = false;
        S.anim = 'happy';
        S.animTimer = now + 1000;
        toast('Feeling better on its own');
        melHappy();
        save();
      }
    } else if (S.sick && !S.sickSince) {
      S.sickSince = now;
    }

    // Post-wake delayed poop (if due overnight)
    if (S._wakePoopAt && now >= S._wakePoopAt && (S.poopCount || 0) < 4 && S.anim !== 'poop') {
      S._wakePoopAt = 0;
      S.poopX = Math.round(S.petX || 120) + 16;
      S.poopY = 145;
      S.lastP = now;
      S.poopSince = now;
      if (S.game || S.battle) {
        S.poop = true;
        S.poopCount = Math.min(4, (S.poopCount || 0) + 1);
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
      } else {
        S.anim = 'poop';
        S.animTimer = now + 1100;
        S._pendingPoop = true;
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
        toast('Needs cleaning!');
        melPoop();
      }
      save();
    }

    // Poop — squat animation first, then pile appears
    if (now - S.lastP > 5.5 * 60000 / sp && (S.poopCount || 0) < 4 && S.anim !== 'poop') {
      S.poopX = Math.round(S.petX || 120) + 16;
      S.poopY = 145;
      S.lastP = now;
      S.poopSince = now;
      if (S.game || S.battle) {
        S.poop = true;
        S.poopCount = Math.min(4, (S.poopCount || 0) + 1);
        if (!S.poopSpots) S.poopSpots = [];
        S.poopSpots.push(Math.round(S.petX || 120) + 16);
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
      } else {
        S.anim = 'poop';
        S.animTimer = now + 1100;
        S._pendingPoop = true;
        careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
        toast('Needs cleaning!');
        melPoop();
        beep(200, 0.08);
      }
      save();
    }
    // Filth escalation (classic: piles fill screen → misery → sick → death risk)
    if (S.poop && S.poopSince && now - S.poopSince > 6 * 60000 / sp) {
      const stacks = Math.max(1, S.poopCount || 1);
      S.careMiss += d.care * stacks; rustDisc(1 + Math.min(3, stacks));
      if (S.happy > 0) S.happy = Math.max(0, S.happy - 1);

function trainNextWait(now) {
  S.trainPhase = 'wait';
  S.trainBtn = null;

  S.playResult = null;
}
function trainPress(btn) {
  // btn: 'A' or 'B' — must match S.trainBtn during GO phase
  if (!S.game || S.gameType !== 'train') return;
  const now = Date.now();
  if (S.trainPhase === 'go') {
    const need = S.trainBtn || 'B';
    if (btn !== need) {
      S.playResult = 'sad';
      beep(160, 0.08);
      if ((S.trainOops || 0) > 0) {
        S.trainOops--;
        toast('Wrong — needed ' + need + '. 1 more chance');
        S.gRound++;
        if (S.gRound > 3) endTraining(S.gScore >= 2);
        else trainNextWait(now);
      } else {
        toast('Wrong button! Needed ' + need);
        endTraining(S.gScore >= 2);
      }
      return;
    }
    S.gScore++;
    S.playResult = 'happy';
    beep(700, 0.05);
    S.gRound++;
    if (S.gRound > 3) {
      endTraining(true);
    } else {
      trainNextWait(now);
      toast('Nice! Round ' + S.gRound + '/3');
    }
  } else {
    // Too early — first slip is forgiven
    S.playResult = 'sad';
    beep(160, 0.08);
    if ((S.trainOops || 0) > 0) {
      S.trainOops--;
      toast('Wait for GO! 1 more chance');
    } else {
      toast('Too early!');
      endTraining(S.gScore >= 2);
    }
  }
}
function endTraining(ok) {
  S.game = false;
  S.gameType = null;
  S.trainPhase = null;
  const hits = S.gScore || 0;
  if (ok || hits >= 2) {
    const bonus = hits >= 3 ? 3 : 2;
    S.battleXP = (S.battleXP || 0) + bonus;
    S.weight = Math.max(5, S.weight - 1);
    S.happy = Math.min(4, S.happy + (hits >= 2 ? 1 : 0));
    S.anim = 'happy';
    S.animTimer = Date.now() + 1400;
    spawnFx('star', S.petX || 120, 70, 4);
    spawnFx('heart', S.petX || 120, 85, 2);

  } else {

    S.anim = 'sulk';
    S.animTimer = Date.now() + 900;

const SAVE_KEY = 'pocketpal_save';
function activeMinutesBetween(start, end) {
  // Closed-PWA simulation follows the same local sleep schedule as live play.
  // Minute stepping keeps midnight/stage schedule handling predictable.
  if (end <= start) return 0;
  const maxMs = 7 * 24 * 60 * 60000;
  start = Math.max(start, end - maxMs);
  let active = 0;
  for (let t = Math.floor(start / 60000) * 60000; t < end; t += 60000) {
    const d = new Date(t + 30000);
    const h = d.getHours();
    const bw = getBedWake();
    const night = bw.bed > bw.wake ? (h >= bw.bed || h < bw.wake) : (h >= bw.bed && h < bw.wake);
    if (!night) active++;
  }
  return active;
}

function updateCareStreak() {
  const day = new Date().toDateString();
  if (S.lastCareDay === day) return;
  const yest = new Date();
  yest.setDate(yest.getDate() - 1);
  if (S.lastCareDay === yest.toDateString()) {
    S.careStreak = (S.careStreak || 0) + 1;
  } else if (!S.lastCareDay) {
    S.careStreak = 1;
  } else {
    S.careStreak = 1; // broken streak resets to 1 for today
  }
  S.lastCareDay = day;
}

function applyOfflineCatchup(now) {
  if (S.stage === 'egg' || S.stage === 'dead' || S.paused) return 0;
  const last = Number(S.lastSave) || now;
  const elapsed = Math.max(0, now - last);
  if (elapsed < 2 * 60000) return 0;
  const activeMin = activeMinutesBetween(last, now);
  const d = DIFF[S.difficulty] || DIFF.realtime;
  const sp = d.timeScale || 0.15;
  const hungerStep = (S.age < 1 ? 3.2 : 2.5) / sp * d.hunger;
  const happyStep = (S.age < 1 ? 3.8 : 2.9) / sp * d.happy;
  const poopStep = 6.8 / sp;
  const ageStep = (12 * 60) / sp;
  const hLoss = Math.floor(activeMin / hungerStep);
  const yLoss = Math.floor(activeMin / happyStep);
  if (hLoss > 0) {
    S.hunger = Math.max(0, S.hunger - Math.min(hLoss, 4)); // cap offline drain
    // Care miss grows slowly offline — player gets a chance to recover on return
    S.careMiss += Math.min(3, Math.max(0, hLoss - 1)) * d.care;
    if (S.hunger === 0) {
      rustDisc(Math.min(8, 2 + hLoss));
      S.call = true; careNotify('hunger', 'Needs FOOD — open PocketPal and feed me!');
    }
  }
  if (yLoss > 0) {
    S.happy = Math.max(0, S.happy - Math.min(yLoss, 4));
    S.careMiss += Math.min(3, Math.max(0, yLoss - 1)) * d.care;
    if (S.happy === 0) { S.call = true; careNotify('happy', 'Needs PLAY — open PocketPal and play with me!'); }
  }
  if (!S.poop && activeMin >= poopStep) {
    S.poop = true; S.call = true; S.poopX = Math.round(S.petX || 120) + 16; S.poopY = 145; S.poopSince = now;
    careNotify('poop', 'Needs CLEAN — open PocketPal and clean up!');
  }
  // Classic aging: +1 age per night/morning crossed while away
  // (plus a very slow awake-time fallback so long daytime absences still progress)
  let nights = 0;
  try {
    const startDay = new Date(last);
    const endDay = new Date(now);
    // Count midnights crossed while the pet had a chance to complete a night
    const cursor = new Date(startDay);
    cursor.setHours(0,0,0,0);
    cursor.setDate(cursor.getDate() + 1); // first midnight after last save
    while (cursor.getTime() <= endDay.getTime()) {
      nights++;
      cursor.setDate(cursor.getDate() + 1);
    }
  } catch(e) { nights = 0; }
  // Cap: allow at least midnight-based nights (floor of hours/24 was wrongly zeroing overnight)
  const maxDays = Math.max(0, Math.ceil(elapsed / (24 * 3600000)));
  if (maxDays > 0) nights = Math.min(nights, maxDays);
  // If we crossed a midnight and were away > 3 hours, keep at least 1 night
  if (nights === 0 && elapsed > 3 * 3600000) {
    const a = new Date(last), b = new Date(now);
    if (a.getDate() !== b.getDate() || a.getMonth() !== b.getMonth() || a.getFullYear() !== b.getFullYear()) {
      nights = 1;
    }
  }
  if (nights > 0 && (S.disc || 0) >= 35 && !S._discPracticed) {
    rustDisc(Math.min(12, nights * 3));
    S._discPracticed = false;
  }
  // Fallback slow age from daytime activity (very slow in realtime)
  const awakeAgeGain = Math.floor(activeMin / ageStep);
  const ageGain = Math.max(nights, awakeAgeGain);
  const stageBefore = S.stage;
  const formBefore = S.form;
  // Catch up within-stage growth (hours awake-equivalent while away)
  const growthHours = Math.floor(activeMin / 60);
  if (growthHours > 0 && S.stage !== 'egg' && S.stage !== 'dead') {
    S.growthPhase = Math.min(3, (S.growthPhase || 0) + growthHours);
    S.lastGrowthAt = now;
  }
  if (ageGain > 0) {
    S.age += ageGain;
    S.lastAge = now;
    S.lastAgeDay = new Date(now).toDateString();
    for (let i = 0; i < 6; i++) {
      const beforeStage = S.stage;
      checkEvo();
      if (S.stage === beforeStage) break;
    }
  }
  // If we returned during daytime after being away overnight, wake the pet
  if (S.sleep && !isNightTime()) {
    S.sleep = false;
    S.lights = true;
    S.lightsMissPending = false;
  }
  S.lastH = now;
  S.lastY = now;
  S.lastP = now;
  S.lastVirtTick = now;
  // Show evo anim if stage/form changed while away; else soft grow if phase jumped
  if (S.stage !== stageBefore || S.form !== formBefore) {
    S.anim = 'evo';
    S.animTimer = now + 2200;
    toast('While you were away → ' + (NAMES[S.form] || S.form) + '!');
    melEvolve();
  } else if (growthHours > 0) {
    S.anim = 'grow';
    S.animTimer = now + 1000;
  } else if (activeMin > 0) {
    S.anim = null;
  }
  if (elapsed >= 2 * 60000) toast('Welcome back · ' + Math.floor(elapsed / 60000) + ' min passed');
  // Grace: do not die immediately after offline catch-up / app update
  S.loadGraceUntil = now + 3 * 60000; // 3 minutes to care for pet
  S.lastSave = now;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {}
  return elapsed;
}

    if (S.myCode && typeof isValidFriendCode === 'function' && !isValidFriendCode(S.myCode)) {

    if (Array.isArray(S.friends)) {

    }

    syncDeviceClock(Date.now());

    if (S.sleep && !isNightTime()) {
      S.sleep = false;
      S.lights = true;
      S.lightsMissPending = false;
      S.anim = null;
    }
    if (!isNightTime()) S.lightsMissPending = false;

      S.anim = 'hatch';
      S.animTimer = Date.now() + 3000;
      beep(300, 0.05); beep(340, 0.05);
      toast('Egg is shaking...');
    }
  }, 2500);
  setTimeout(() => {
    if (S.stage === 'egg') {
      S.stage = 'baby';
      S.form = 'baby';
      S.born = Date.now();
      S.hunger = 2;
      S.happy = 2;
      assignNewMorph(S);
      S.anim = 'joy';
      S.animTimer = Date.now() + 1500;
      spawnFx('star', 120, 90, 5);
      toast('It hatched! ' + displayName(S) + ' ' + speciesTag(S.morphId));
      beep(600, 0.1); beep(800, 0.15);
      save();
    }
  }, 5500);
  save();
}
function show(title, msg) {
  document.getElementById('otitle').textContent = title;
  document.getElementById('omsg').textContent = msg;
  document.getElementById('overlay').classList.remove('hidden');
}
function hide() {
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('overlay-extra').innerHTML = '';
  const btn = document.getElementById('obtn');
  btn.style.display = '';
  btn.textContent = 'Close';
}
document.getElementById('obtn').onclick = () => {
  if (S.stage === 'dead') restart({ fromDeath: true });
  else if (S.stage === 'egg') restart();
  else hide();
};

function loop() {
  update();
  render();
  updateUI();
  requestAnimationFrame(loop);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // A newly activated worker has the latest build. Reload so the
    // running page immediately uses the updated app shell.
    if (!window.__ppReloadingForUpdate) {
      window.__ppReloadingForUpdate = true;
      window.location.reload();
    }
  });

  try { applyShellTheme(S.shellTheme || 0);
    try { if (S.stage !== 'egg' && S.stage !== 'dead') ensureMorph(S); } catch(e) {} } catch(e) {}
navigator.serviceWorker.register('./service-worker.js?v=2.81', { updateViaCache: 'none' })
    .then(reg => reg.update())
    .catch(() => {});
}

function init() {
  if (!load() || S.stage === 'egg') {
    show('PocketPal v2.90', 'A = Select  B = Confirm  C = Cancel\\nHold B = Pause\\n\\n256 species · Real-time care');
    document.getElementById('obtn').textContent = 'Start New Life';
  } else {
    hide();
    toast('Save restored · Gen ' + S.generation);
  }
  updateIconHighlight();
  requestAnimationFrame(loop);
}
init();

</script>
</body>
