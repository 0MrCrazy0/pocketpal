    updateIconHighlight();
    return true;
  } catch(e) { return false; }
}

function tryOpenCareFromUrl() {
  try {
    const type = new URLSearchParams(window.location.search).get('care');
    if (type && CARE_ALERTS[type]) {
      setTimeout(() => hintOpenedCare(type), 600);
    }
  } catch (e) {}
}
if (navigator.serviceWorker) {
  navigator.serviceWorker.addEventListener('message', ev => {
    if (ev.data && ev.data.type === 'CARE_OPEN') hintOpenedCare(ev.data.care);
  });
}
window.addEventListener('beforeunload', () => { save(); forcePublishCareOnHide(); });
window.addEventListener('pagehide', () => { save(); forcePublishCareOnHide(); });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    hiddenAt = Date.now();
    save();
    forcePublishCareOnHide(); // always POST focused:false (bypass 20s throttle)
    pushCareSnapshotToSW(); // frozen=true — SW must not project drain while hidden
    stopMusic();
  } else {
    const now = Date.now();
    // Hidden path: no live care while backgrounded. On return use catchup (>=2 min)
    // or timer-shift (<2 min) so we never drip care in background AND punish again.
    if (hiddenAt && !S.paused && !S._away) {
      const elapsed = Math.max(0, now - hiddenAt);
      if (elapsed >= 2 * 60000) applyOfflineCatchup(now);
      else if (elapsed > 500) shiftCareTimers(elapsed);
    }
    hiddenAt = 0;
    if (S.sound && !S.paused && !S._away) startMusic();
    syncDeviceClock(now);
    updateUI();
    // After catchup needs may be due — focused → toast via careNotify; refresh SW snapshot
    pushCareSnapshotToSW();
    save();
  }
});

function restart(opts) {
  // v5.19: full per-pet wipe + PET_DEFAULTS. Account globals KEEP.
  // bedHour/wakeHour always reset to 20/8 — never inherit prior pal.
  const keep = captureAccountGlobals();
  const generation = S.generation;
  const fromDeath = (opts && opts.fromDeath) || S.stage === 'dead';
  const petId = newPetId();
  const now = Date.now();
  wipeNonAccountKeys();
  Object.assign(S, petDefaults(now), {
    petId,
    generation: (opts && opts.keepGeneration) ? (generation || 1)
      : (fromDeath ? ((generation || 1) + 1) : 1),
    activeSlot: null,
    bedHour: 20,
    wakeHour: 8,
    growthPhase: 0,
    lastGrowthAt: 0,
    lights: true,
    sleep: false
  });
  restoreAccountGlobals(keep, { keepActiveSlot: false });
  S.activeSlot = null;
  S.sel = 0;
  delete S.eggLeft;
  hide();
  try { applyShellTheme(S.shellTheme || 0);
    try { if (S.stage !== 'egg' && S.stage !== 'dead') ensureMorph(S); } catch(e) {} } catch(e) {}
  beginEggSelect({ silent: !!(opts && opts.silentEgg) });
  save();
  updateIconHighlight();
}
function show(title, msg) {
  document.getElementById('otitle').textContent = title;
  document.getElementById('omsg').textContent = msg;
  document.getElementById('overlay').classList.remove('hidden');
}
function hide() {
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('overlay-extra').innerHTML = '';
  const btn = document.getElementById('obtn');
  btn.style.display = '';
  btn.textContent = 'Close';
}
document.getElementById('obtn').onclick = () => {
  if (S.stage === 'dead') restart({ fromDeath: true });
  else {
    hide();
    if (S.stage === 'egg' || S.stage === 'baby') {
      try { claimSlotForActive(); } catch (e) {}
    }
  }
};

function loop() {
  try {
    update();
    render();
    updateUI();
  } catch (e) {
    // Do NOT resetHomePose here — that snapped petX to 120 (teleport) and wiped
    // anim/fx whenever drawPet threw (e.g. the roll TDZ bug). Only reset canvas state.
    try {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      S._battleDraw = false;
      S._rivalDraw = false;
    } catch (e2) {}
  }
  requestAnimationFrame(loop);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // A newly activated worker has the latest build. Reload so the
    // running page immediately uses the updated app shell.
    if (!window.__ppReloadingForUpdate) {
      window.__ppReloadingForUpdate = true;
      window.location.reload();
    }
  });

  try { applyShellTheme(S.shellTheme || 0);
    try { if (S.stage !== 'egg' && S.stage !== 'dead') ensureMorph(S); } catch(e) {} } catch(e) {}
navigator.serviceWorker.register('./service-worker.js?v=5.71', { updateViaCache: 'none' })
    .then(reg => reg.update())
    .catch(() => {});
}

function init() {
  const hadSave = load();
  if (!hadSave) {
    show('PocketPal v5.71', 'A = Select  B = Confirm  C = Cancel\nHold B = Pause\nAway = 20 min idle\n\n256 looks · 15-day life\n6 eggs · Pick yours to begin.');
    document.getElementById('obtn').textContent = 'Start New Life';
    beginEggSelect({ silent: true });
  } else if (S.stage === 'egg') {
    hide();
    toast(eggWaitMessage(), { pri: 3, hold: 2800 });
  } else {
    hide();
    toast('Save restored · Gen ' + S.generation);
  }
  updateIconHighlight();
  requestAnimationFrame(loop);
}
init();
