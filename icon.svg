<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded shell background -->
  <rect width="512" height="512" rx="108" fill="#e85a71"/>
  <!-- Soft inner highlight -->
  <rect x="28" y="28" width="456" height="456" rx="90" fill="#f2788c"/>
  <!-- Device bezel -->
  <rect x="72" y="64" width="368" height="300" rx="36" fill="#1a1a1a"/>
  <!-- LCD screen -->
  <rect x="96" y="88" width="320" height="252" rx="20" fill="#9bbc0f"/>
  <!-- LCD inset shade -->
  <rect x="104" y="96" width="304" height="236" rx="14" fill="#8bac0f"/>
  
  <!-- Pet body -->
  <circle cx="256" cy="200" r="72" fill="#0f380f"/>
  <!-- Side fins -->
  <rect x="168" y="175" width="22" height="48" rx="8" fill="#0f380f"/>
  <rect x="322" y="175" width="22" height="48" rx="8" fill="#0f380f"/>
  <!-- Feet -->
  <rect x="220" y="265" width="24" height="14" rx="5" fill="#0f380f"/>
  <rect x="268" y="265" width="24" height="14" rx="5" fill="#0f380f"/>
  
  <!-- Eye sockets -->
  <rect x="218" y="178" width="28" height="28" rx="4" fill="#9bbc0f"/>
  <rect x="266" y="178" width="28" height="28" rx="4" fill="#9bbc0f"/>
  <!-- Pupils looking slightly right -->
  <rect x="230" y="188" width="12" height="14" rx="2" fill="#0f380f"/>
  <rect x="278" y="188" width="12" height="14" rx="2" fill="#0f380f"/>
  
  <!-- Happy smile -->
  <path d="M228 230 Q256 258 284 230" stroke="#9bbc0f" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Tiny sparkle crest -->
  <circle cx="256" cy="118" r="5" fill="#0f380f"/>
  <circle cx="240" cy="128" r="3" fill="#0f380f"/>
  <circle cx="272" cy="128" r="3" fill="#0f380f"/>
  
  <!-- Device buttons -->
  <circle cx="186" cy="420" r="28" fill="#2a2a2a" stroke="#111" stroke-width="4"/>
  <circle cx="256" cy="420" r="28" fill="#2a2a2a" stroke="#111" stroke-width="4"/>
  <circle cx="326" cy="420" r="28" fill="#2a2a2a" stroke="#111" stroke-width="4"/>
  <circle cx="186" cy="420" r="10" fill="#4a9"/>
  <circle cx="256" cy="420" r="10" fill="#49a"/>
  <circle cx="326" cy="420" r="10" fill="#a54"/>
  
  <!-- Top speaker notch -->
  <rect x="226" y="40" width="60" height="10" rx="5" fill="#222"/>
</svg>
